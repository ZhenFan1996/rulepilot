services:
  api:
    build:
      context: ../backend
    command: ["--spring.profiles.active=api"]
    environment: &backend-environment
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-rulepilot}
      POSTGRES_USER: ${POSTGRES_USER:-rulepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-rulepilot}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-me-local-only}
      MINIO_HOST: minio
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-rulepilot}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-local-only}
      RULEPILOT_USER_USERNAME: ${RULEPILOT_USER_USERNAME:-player}
      RULEPILOT_USER_PASSWORD: ${RULEPILOT_USER_PASSWORD:-rulepilot-local}
      RULEPILOT_ADMIN_USERNAME: ${RULEPILOT_ADMIN_USERNAME:-admin}
      RULEPILOT_ADMIN_PASSWORD: ${RULEPILOT_ADMIN_PASSWORD:-rulepilot-admin-local}
      RULEPILOT_MODELS_STARTUP_ALLOWED_USERS: ${RULEPILOT_MODELS_STARTUP_ALLOWED_USERS:-${RULEPILOT_USER_USERNAME:-player}}
      MODEL_CREDENTIAL_ENCRYPTION_KEY: ${MODEL_CREDENTIAL_ENCRYPTION_KEY:-}
      MODEL_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${MODEL_CREDENTIAL_ENCRYPTION_KEY_VERSION:-1}
      MODEL_DEFAULT_MONTHLY_TOKEN_LIMIT: ${MODEL_DEFAULT_MONTHLY_TOKEN_LIMIT:-2000000}
      MODEL_PER_CALL_RESERVATION_TOKENS: ${MODEL_PER_CALL_RESERVATION_TOKENS:-16000}
      BGG_API_TOKEN: ${BGG_API_TOKEN:-}
      BGG_BASE_URL: ${BGG_BASE_URL:-https://boardgamegeek.com}
      BGG_RESOLVED_ADDRESSES: ${BGG_RESOLVED_ADDRESSES:-}
      TEACHING_PROVIDER: ${TEACHING_PROVIDER:-fake}
      TEACHING_MODEL_PROVIDER: ${TEACHING_MODEL_PROVIDER:-gemini}
      VISUAL_PROVIDER: ${VISUAL_PROVIDER:-fake}
      VISUAL_MODEL_PROVIDER: ${VISUAL_MODEL_PROVIDER:-gemini}
      VISUAL_REGION_PROPOSAL_ENABLED: ${VISUAL_REGION_PROPOSAL_ENABLED:-true}
      VISUAL_REGION_PROPOSAL_PYTHON_COMMAND: ${VISUAL_REGION_PROPOSAL_PYTHON_COMMAND:-python3}
      VISUAL_REGION_PROPOSAL_TIMEOUT: ${VISUAL_REGION_PROPOSAL_TIMEOUT:-PT2S}
      VISUAL_REGION_PROPOSAL_MAX_REGIONS_PER_PAGE: ${VISUAL_REGION_PROPOSAL_MAX_REGIONS_PER_PAGE:-32}
      VISUAL_REQUEST_PARALLELISM: ${VISUAL_REQUEST_PARALLELISM:-10}
      VISUAL_OCR_REQUEST_PARALLELISM: ${VISUAL_OCR_REQUEST_PARALLELISM:-10}
      VISUAL_SEMANTIC_REQUEST_PARALLELISM: ${VISUAL_SEMANTIC_REQUEST_PARALLELISM:-4}
      VISUAL_COMPATIBILITY_WORKFLOW_TIMEOUT: ${VISUAL_COMPATIBILITY_WORKFLOW_TIMEOUT:-PT10M}
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-fake}
      ANSWER_MODEL_PROVIDER: ${ANSWER_MODEL_PROVIDER:-gemini}
      CRITIC_PROVIDER: ${CRITIC_PROVIDER:-fake}
      CRITIC_MODEL_PROVIDER: ${CRITIC_MODEL_PROVIDER:-gemini}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DEEPSEEK_ENABLED: ${DEEPSEEK_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_GENERATION_THINKING: ${DEEPSEEK_GENERATION_THINKING:-false}
      BGG_TRANSLATION_ENABLED: ${BGG_TRANSLATION_ENABLED:-false}
      BGG_TRANSLATION_TIMEOUT: ${BGG_TRANSLATION_TIMEOUT:-PT20S}
      BGG_TRANSLATION_CACHE_TTL: ${BGG_TRANSLATION_CACHE_TTL:-P30D}
      BGG_TRANSLATION_HOURLY_LIMIT: ${BGG_TRANSLATION_HOURLY_LIMIT:-60}
      BGG_TRANSLATION_PROVIDER_CONCURRENCY: ${BGG_TRANSLATION_PROVIDER_CONCURRENCY:-2}
      BGG_CACHE_PREWARM_ENABLED: ${BGG_CACHE_PREWARM_ENABLED:-true}
      BGG_CACHE_PREWARM_GAME_COUNT: ${BGG_CACHE_PREWARM_GAME_COUNT:-10000}
      BGG_CACHE_MAXIMUM_ENTRIES: ${BGG_CACHE_MAXIMUM_ENTRIES:-20000}
      BGG_CACHE_MAXIMUM_BYTES: ${BGG_CACHE_MAXIMUM_BYTES:-268435456}
      BGG_CACHE_PREWARM_COHORT_SIZE: ${BGG_CACHE_PREWARM_COHORT_SIZE:-500}
      BGG_CACHE_PREWARM_TRANSLATION_COHORT_SIZE: ${BGG_CACHE_PREWARM_TRANSLATION_COHORT_SIZE:-60}
      BGG_CACHE_PREWARM_INITIAL_DELAY: ${BGG_CACHE_PREWARM_INITIAL_DELAY:-PT5M}
      BGG_CACHE_PREWARM_RESUME_DELAY: ${BGG_CACHE_PREWARM_RESUME_DELAY:-PT1H}
      BGG_CACHE_PREWARM_LEASE_DURATION: ${BGG_CACHE_PREWARM_LEASE_DURATION:-PT30M}
      BGG_RECOMMENDATION_AGENT_ENABLED: ${BGG_RECOMMENDATION_AGENT_ENABLED:-false}
      BGG_RECOMMENDATION_PROVIDER: ${BGG_RECOMMENDATION_PROVIDER:-fake}
      BGG_RECOMMENDATION_MODEL_PROVIDER: ${BGG_RECOMMENDATION_MODEL_PROVIDER:-qwen}
      BGG_RECOMMENDATION_AGENT_TIMEOUT: ${BGG_RECOMMENDATION_AGENT_TIMEOUT:-PT45S}
      BGG_RECOMMENDATION_WEB_RESEARCH_ENABLED: ${BGG_RECOMMENDATION_WEB_RESEARCH_ENABLED:-false}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-${QWEN_API_KEY:-}}
      WEB_SEARCH_BASE_URL: ${WEB_SEARCH_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      WEB_SEARCH_MODEL: ${WEB_SEARCH_MODEL:-qwen3.7-plus}
      QWEN_ENABLED: ${QWEN_ENABLED:-false}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.7-plus}
      QWEN_VISION_CAPABLE: ${QWEN_VISION_CAPABLE:-true}
      RULEBOOK_DISCOVERY_MODEL: ${RULEBOOK_DISCOVERY_MODEL:-qwen3.7-plus}
      RULEBOOK_DISCOVERY_TIMEOUT: ${RULEBOOK_DISCOVERY_TIMEOUT:-PT30S}
      RULEBOOK_DISCOVERY_CATALOG_PROVIDER_BUDGET: ${RULEBOOK_DISCOVERY_CATALOG_PROVIDER_BUDGET:-PT6S}
      RULEBOOK_DISCOVERY_SOURCE_INSPECTION_PROVIDER_BUDGET: ${RULEBOOK_DISCOVERY_SOURCE_INSPECTION_PROVIDER_BUDGET:-PT6S}
      RULEBOOK_DISCOVERY_WEB_SEARCH_PROVIDER_BUDGET: ${RULEBOOK_DISCOVERY_WEB_SEARCH_PROVIDER_BUDGET:-PT18S}
      RULEBOOK_DISCOVERY_TOTAL_BUDGET: ${RULEBOOK_DISCOVERY_TOTAL_BUDGET:-PT30S}
      RULEBOOK_DISCOVERY_NEGATIVE_CACHE_TTL: ${RULEBOOK_DISCOVERY_NEGATIVE_CACHE_TTL:-PT10M}
      RULEBOOK_DISCOVERY_HOURLY_LIMIT: ${RULEBOOK_DISCOVERY_HOURLY_LIMIT:-30}
      RULEBOOK_DISCOVERY_PROVIDER_CONCURRENCY: ${RULEBOOK_DISCOVERY_PROVIDER_CONCURRENCY:-1}
      RULEBOOK_TRUSTED_DOMAINS: ${RULEBOOK_TRUSTED_DOMAINS:-${RULEBOOK_OFFICIAL_DOMAINS:-}}
      COMPATIBLE_MODEL_ENABLED: ${COMPATIBLE_MODEL_ENABLED:-false}
      COMPATIBLE_MODEL_API_KEY: ${COMPATIBLE_MODEL_API_KEY:-}
      COMPATIBLE_MODEL_BASE_URL: ${COMPATIBLE_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      COMPATIBLE_MODEL_NAME: ${COMPATIBLE_MODEL_NAME:-local-model}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      # A small production host must keep reader requests independent from
      # optional telemetry exporters and oversized idle JDBC pools.
      # W3C propagation must remain active even when this small deployment does not run an OTLP collector.
      MANAGEMENT_TRACING_EXPORT_ENABLED: "true"
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DATABASE_POOL_SIZE:-4}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${DATABASE_MINIMUM_IDLE:-0}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: ${DATABASE_VALIDATION_TIMEOUT_MS:-2000}
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: ${DATABASE_MAX_LIFETIME_MS:-900000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ../backend
    command: ["--spring.profiles.active=worker"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/rulepilot-worker-ready"]
      interval: 3s
      timeout: 1s
      retries: 40
      start_period: 5s
    restart: unless-stopped
