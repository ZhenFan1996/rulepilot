services:
  postgres:
    image: rulepilot-postgres:local
    build:
      context: ../infra/postgres
      dockerfile: Dockerfile.runtime
    volumes: !override
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    mem_limit: 256m

  api:
    image: ${RULEPILOT_BACKEND_IMAGE:-rulepilot-backend:local}
    build:
      context: ../backend
      dockerfile: Dockerfile.runtime
    environment:
      # The production host has two vCPUs and 4 GiB RAM. G1 keeps request pauses bounded while one region set is
      # reclaimed concurrently; the former Serial GC accumulated more than 36 seconds of full-stop pauses in one
      # hour. Production sampling on 2026-08-22 showed a healthy 45% post-GC heap but only ~44 MiB of cgroup
      # headroom, so the heap and cgroup now leave room for normal allocation bursts and native image buffers.
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -Xss512k -XX:ActiveProcessorCount=${PRODUCTION_ACTIVE_PROCESSOR_COUNT:-2} -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=35 -XX:+ParallelRefProcEnabled
      # Model calls are network-bound. Two bounded runs prevent one player's preparation or lesson from making a
      # second player wait minutes for the first section. One lane is reserved for outline + first cited section;
      # one continuation lane finishes chapters and review, preserving the existing two-call host ceiling.
      OUTBOX_PUBLISH_FIXED_DELAY: "500ms"
      TEACHING_IMPORT_HANDOFF_FIXED_DELAY: "500ms"
      TEACHING_IMPORT_HANDOFF_SCHEDULER_POOL_SIZE: "1"
      TEACHING_STARTUP_QUEUE_CAPACITY: "3"
      TEACHING_BACKGROUND_CORE_POOL_SIZE: "1"
      TEACHING_BACKGROUND_MAX_POOL_SIZE: "1"
      TEACHING_BACKGROUND_QUEUE_CAPACITY: "3"
      # On a single-core host, one section at a time avoids three concurrent model responses retaining large
      # evidence contexts in the web process. The reader-facing API stays responsive while the complete lesson
      # still arrives in the same ordered structure.
      TEACHING_BASE_SECTION_PARALLELISM: ${PRODUCTION_TEACHING_BASE_SECTION_PARALLELISM:-1}
      # Verified local crops are optional post-publication work. Keep their queue separate from the base lesson
      # worker so a fresh upload can start immediately while older lessons gain illustrations. Four accepted lesson
      # sessions need one running visual task plus three lightweight queued launch records; visual work itself stays
      # single-threaded so queued sessions do not retain rendered page buffers or add concurrent provider calls.
      VISUAL_ENRICHMENT_BACKGROUND_CORE_POOL_SIZE: "1"
      VISUAL_ENRICHMENT_BACKGROUND_MAX_POOL_SIZE: "1"
      VISUAL_ENRICHMENT_BACKGROUND_QUEUE_CAPACITY: "3"
      # Post-publication positioning and complete visual audits stay independent from Teaching preparation lanes.
      VISUAL_REQUEST_PARALLELISM: ${PRODUCTION_VISUAL_REQUEST_PARALLELISM:-10}
      # Page-local OCR is I/O bound and completes before the heavier semantic rule catalog starts.
      VISUAL_OCR_REQUEST_PARALLELISM: ${PRODUCTION_VISUAL_OCR_REQUEST_PARALLELISM:-10}
      VISUAL_SEMANTIC_REQUEST_PARALLELISM: ${PRODUCTION_VISUAL_SEMANTIC_REQUEST_PARALLELISM:-4}
      VISUAL_CATALOG_TIMEOUT: PT120S
      VISUAL_COMPATIBILITY_WORKFLOW_TIMEOUT: ${VISUAL_COMPATIBILITY_WORKFLOW_TIMEOUT:-PT10M}
      # Publish the cited text lesson first. The single enrichment worker and per-call candidate attachment batch
      # protect reading, upload, and answer traffic without truncating the lesson's eligible visual chapters.
      ANSWER_RATE_PROVIDER_CONCURRENCY: ${PRODUCTION_ANSWER_PROVIDER_CONCURRENCY:-2}
      SERVER_TOMCAT_THREADS_MAX: ${PRODUCTION_TOMCAT_MAX_THREADS:-16}
      SERVER_TOMCAT_THREADS_MIN_SPARE: "4"
      # A guide page reads several independent persisted snapshots. Ten connections absorb a short reader/auth
      # overlap while staying well inside PostgreSQL's 30-connection host budget with the worker's three.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
      # The web application calls its model adapters directly. The optional MCP endpoint is
      # useful for local integrations, but costs a small host a full server/tool graph without
      # serving reader traffic.
      SPRING_AI_MCP_SERVER_ENABLED: "false"
      RULEPILOT_RELEASE_ID: ${RULEPILOT_RELEASE_ID:-local}
      RULEPILOT_DEPLOYMENT_ENVIRONMENT: production
      RULEPILOT_RUNTIME_ROLE: api
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${PRODUCTION_TRACING_EXPORT_OTLP_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${PRODUCTION_TRACING_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${PRODUCTION_TRACING_SAMPLING_PROBABILITY:-0.05}
      # A sampled W3C canary parent is retained under the 5% production ratio. Omit exception events that can carry
      # provider text and keep the resulting exact-release trace bounded.
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_MAX_QUEUE_SIZE: "512"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_MAX_BATCH_SIZE: "128"
      MANAGEMENT_OPENTELEMETRY_TRACING_LIMITS_MAX_ATTRIBUTE_VALUE_LENGTH: "256"
      MANAGEMENT_OPENTELEMETRY_TRACING_LIMITS_MAX_EVENTS: "0"
    # Measured production RSS reached ~852 MiB under a 896 MiB limit while post-GC heap remained healthy. 1.2 GiB
    # keeps the 512 MiB heap, ~190 MiB metaspace, thread stacks and bounded image buffers inside the cgroup; limits
    # are ceilings rather than reservations, and measured host availability leaves the required operating margin.
    mem_limit: 1200m

  worker:
    image: ${RULEPILOT_BACKEND_IMAGE:-rulepilot-backend:local}
    # Reuse the API runtime image. Building both services concurrently against
    # the same image tag causes Docker to race while exporting the image.
    build: !reset null
    environment:
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx352m -Xss512k -XX:ActiveProcessorCount=${PRODUCTION_ACTIVE_PROCESSOR_COUNT:-2} -XX:+UseSerialGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: "1"
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: "1"
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: "1"
      RULEPILOT_RELEASE_ID: ${RULEPILOT_RELEASE_ID:-local}
      RULEPILOT_DEPLOYMENT_ENVIRONMENT: production
      RULEPILOT_RUNTIME_ROLE: worker
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${PRODUCTION_TRACING_EXPORT_OTLP_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${PRODUCTION_TRACING_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${PRODUCTION_TRACING_SAMPLING_PROBABILITY:-0.05}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_MAX_QUEUE_SIZE: "512"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_MAX_BATCH_SIZE: "128"
      MANAGEMENT_OPENTELEMETRY_TRACING_LIMITS_MAX_ATTRIBUTE_VALUE_LENGTH: "256"
      MANAGEMENT_OPENTELEMETRY_TRACING_LIMITS_MAX_EVENTS: "0"
    mem_limit: 560m

  prometheus:
    profiles: ["observability"]

  tempo:
    profiles: ["observability"]
    ports: !override
      - "127.0.0.1:3200:3200"
    environment:
      # The local 2.10.5 process uses about 232 MiB RSS at idle; this bounds the production increment without
      # reserving memory from player-facing services. Trace retention remains the existing 24-hour local volume.
      GOMEMLIMIT: ${PRODUCTION_TEMPO_GOMEMLIMIT:-192MiB}
    mem_limit: 320m

  grafana:
    profiles: ["observability"]

  frontend:
    image: ${RULEPILOT_FRONTEND_IMAGE:-rulepilot-frontend:local}
    build:
      context: ../frontend
      dockerfile: Dockerfile.runtime
    ports:
      - "${RULEPILOT_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  gateway:
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
