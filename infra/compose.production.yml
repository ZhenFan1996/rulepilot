services:
  postgres:
    image: rulepilot-postgres:local
    build:
      context: ../infra/postgres
      dockerfile: Dockerfile.runtime
    volumes: !override
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    mem_limit: 192m

  api:
    image: rulepilot-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile.runtime
    environment:
      # Spring's API call graph does not need the JVM's 1 MiB default thread stacks. Halving them leaves useful
      # cgroup headroom for requests on this 1-core host without constraining the lesson-generation heap.
      # Let Serial GC return memory after an upload or a burst of generated lesson data. The default free-heap
      # ratio kept most of the 320 MiB maximum committed while idle and forced this 2 GiB host into swap.
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx320m -Xss512k -XX:+UseSerialGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20
      # This host has one CPU and 1.6 GiB available to containers. A single bounded lesson run keeps reader
      # requests responsive instead of allowing multiple large Agent contexts to contend with PDF uploads.
      TEACHING_BACKGROUND_CORE_POOL_SIZE: "1"
      TEACHING_BACKGROUND_MAX_POOL_SIZE: "1"
      TEACHING_BACKGROUND_QUEUE_CAPACITY: "3"
      # On a single-core host, one section at a time avoids three concurrent model responses retaining large
      # evidence contexts in the web process. The reader-facing API stays responsive while the complete lesson
      # still arrives in the same ordered structure.
      TEACHING_BASE_SECTION_PARALLELISM: "1"
      # Verified local crops are optional post-publication work. Keep their small queue separate from the base
      # lesson worker so a fresh upload can start immediately while an older lesson gains illustrations.
      VISUAL_ENRICHMENT_BACKGROUND_CORE_POOL_SIZE: "1"
      VISUAL_ENRICHMENT_BACKGROUND_MAX_POOL_SIZE: "1"
      VISUAL_ENRICHMENT_BACKGROUND_QUEUE_CAPACITY: "1"
      VISUAL_ENRICHMENT_REQUEST_PARALLELISM: "1"
      # Vision work is optional after the cited text lesson exists. A single Qwen request avoids holding multiple
      # rendered rulebook pages in the API process and protects ordinary reading, upload, and question requests.
      VISUAL_REQUEST_PARALLELISM: "1"
      VISUAL_CATALOG_TIMEOUT: PT75S
      # Produce a small first visual pass and let later feedback request more precise illustrations. This prevents
      # one upload from monopolising the small production host after its text lesson is already usable.
      VISUAL_MAX_SECTIONS: "2"
      VISUAL_MAX_STEPS_PER_SECTION: "1"
      ANSWER_RATE_PROVIDER_CONCURRENCY: "2"
      SERVER_TOMCAT_THREADS_MAX: "16"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "4"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
      # The web application calls its model adapters directly. The optional MCP endpoint is
      # useful for local integrations, but costs a small host a full server/tool graph without
      # serving reader traffic.
      SPRING_AI_MCP_SERVER_ENABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
    # PDF pages are stored outside the heap while they are resized for a vision call. The 320 MiB heap cap stays
    # fixed; this extra native headroom prevents the API cgroup from throttling those short-lived image buffers.
    # The API keeps its Java heap at 320 MiB. A 640 MiB cgroup leaves measured room for two short-lived resized
    # image buffers without forcing kernel reclaim, while the host retains more than 250 MiB for the other services.
    mem_limit: 640m

  worker:
    image: rulepilot-backend:local
    # Reuse the API runtime image. Building both services concurrently against
    # the same image tag causes Docker to race while exporting the image.
    build: !reset null
    environment:
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx352m -Xss512k -XX:+UseSerialGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: "1"
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: "1"
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: "1"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
    mem_limit: 560m

  prometheus:
    profiles: ["observability"]

  tempo:
    profiles: ["observability"]

  grafana:
    profiles: ["observability"]

  frontend:
    image: rulepilot-frontend:local
    build:
      context: ../frontend
      dockerfile: Dockerfile.runtime
    ports:
      - "${RULEPILOT_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  gateway:
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
