services:
  postgres:
    image: rulepilot-postgres:local
    build:
      context: ../infra/postgres
      dockerfile: Dockerfile.runtime
    volumes: !override
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    mem_limit: 192m

  api:
    image: rulepilot-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile.runtime
    environment:
      # Spring's API call graph does not need the JVM's 1 MiB default thread stacks. Halving them leaves useful
      # cgroup headroom for requests on this 1-core host without constraining the lesson-generation heap.
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx320m -Xss512k -XX:+UseSerialGC
      # This host has one CPU and 1.6 GiB available to containers. A single bounded lesson run keeps reader
      # requests responsive instead of allowing multiple large Agent contexts to contend with PDF uploads.
      TEACHING_BACKGROUND_CORE_POOL_SIZE: "1"
      TEACHING_BACKGROUND_MAX_POOL_SIZE: "1"
      TEACHING_BACKGROUND_QUEUE_CAPACITY: "3"
      # Qwen visual catalog calls run outside the JVM. Allow two bounded requests so one slow provider response
      # cannot serialize an entire rulebook, but keep the catalog timeout above the measured worst-case response.
      VISUAL_REQUEST_PARALLELISM: "2"
      VISUAL_CATALOG_TIMEOUT: PT75S
      # The first public pass gives each high-value chapter up to two useful crops. Further enrichment is optional
      # and must never turn a reader's page request into a long queue of full-resolution vision calls.
      VISUAL_MAX_SECTIONS: "4"
      VISUAL_MAX_STEPS_PER_SECTION: "2"
      SERVER_TOMCAT_THREADS_MAX: "32"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "4"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
      # The web application calls its model adapters directly. The optional MCP endpoint is
      # useful for local integrations, but costs a small host a full server/tool graph without
      # serving reader traffic.
      SPRING_AI_MCP_SERVER_ENABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
    # PDF pages are stored outside the heap while they are resized for a vision call. The 320 MiB heap cap stays
    # fixed; this extra native headroom prevents the API cgroup from throttling those short-lived image buffers.
    # The API keeps its Java heap at 320 MiB. A 640 MiB cgroup leaves measured room for two short-lived resized
    # image buffers without forcing kernel reclaim, while the host retains more than 250 MiB for the other services.
    mem_limit: 640m

  worker:
    image: rulepilot-backend:local
    # Reuse the API runtime image. Building both services concurrently against
    # the same image tag causes Docker to race while exporting the image.
    build: !reset null
    environment:
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx352m -XX:+UseSerialGC
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: "1"
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: "1"
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: "1"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
    mem_limit: 560m

  prometheus:
    profiles: ["observability"]

  tempo:
    profiles: ["observability"]

  grafana:
    profiles: ["observability"]

  frontend:
    image: rulepilot-frontend:local
    build:
      context: ../frontend
      dockerfile: Dockerfile.runtime
    ports:
      - "${RULEPILOT_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  gateway:
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
