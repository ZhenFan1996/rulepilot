services:
  postgres:
    image: rulepilot-postgres:local
    build:
      context: ../infra/postgres
      dockerfile: Dockerfile.runtime
    volumes: !override
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    mem_limit: 192m

  api:
    image: ${RULEPILOT_BACKEND_IMAGE:-rulepilot-backend:local}
    build:
      context: ../backend
      dockerfile: Dockerfile.runtime
    environment:
      # The production host has two vCPUs and 4 GiB RAM. G1 keeps request pauses bounded while one region set is
      # reclaimed concurrently; the former Serial GC accumulated more than 36 seconds of full-stop pauses in one
      # hour. The larger cgroup below leaves native/metaspace and image-buffer headroom outside this 384 MiB heap.
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -Xss512k -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=35 -XX:+ParallelRefProcEnabled
      # Model calls are network-bound. Two bounded runs prevent one player's preparation or lesson from making a
      # second player wait minutes for the first section. One lane is reserved for outline + first cited section;
      # one continuation lane finishes chapters and review, preserving the existing two-call host ceiling.
      OUTBOX_PUBLISH_FIXED_DELAY: "500ms"
      TEACHING_IMPORT_HANDOFF_FIXED_DELAY: "500ms"
      TEACHING_IMPORT_HANDOFF_SCHEDULER_POOL_SIZE: "1"
      TEACHING_STARTUP_QUEUE_CAPACITY: "3"
      TEACHING_BACKGROUND_CORE_POOL_SIZE: "1"
      TEACHING_BACKGROUND_MAX_POOL_SIZE: "1"
      TEACHING_BACKGROUND_QUEUE_CAPACITY: "3"
      # On a single-core host, one section at a time avoids three concurrent model responses retaining large
      # evidence contexts in the web process. The reader-facing API stays responsive while the complete lesson
      # still arrives in the same ordered structure.
      TEACHING_BASE_SECTION_PARALLELISM: ${PRODUCTION_TEACHING_BASE_SECTION_PARALLELISM:-1}
      # Verified local crops are optional post-publication work. Keep their queue separate from the base lesson
      # worker so a fresh upload can start immediately while older lessons gain illustrations. Four accepted lesson
      # sessions need one running visual task plus three lightweight queued launch records; visual work itself stays
      # single-threaded so queued sessions do not retain rendered page buffers or add concurrent provider calls.
      VISUAL_ENRICHMENT_BACKGROUND_CORE_POOL_SIZE: "1"
      VISUAL_ENRICHMENT_BACKGROUND_MAX_POOL_SIZE: "1"
      VISUAL_ENRICHMENT_BACKGROUND_QUEUE_CAPACITY: "3"
      VISUAL_ENRICHMENT_REQUEST_PARALLELISM: "1"
      # Each source page has an independent provider, validation, and persistence boundary. Ten bounded calls cover a
      # normal rulebook window without opening an unbounded provider queue.
      VISUAL_REQUEST_PARALLELISM: ${PRODUCTION_VISUAL_REQUEST_PARALLELISM:-10}
      VISUAL_CATALOG_TIMEOUT: PT120S
      VISUAL_PROGRESSIVE_START_TIMEOUT: PT35S
      # Publish the cited text lesson first, then give the first visual pass enough breadth to cover the major
      # gameplay chapters. The bounded request pool protects reading, upload, and answer traffic while the single
      # enrichment worker prevents several lessons from retaining rendered-page buffers at once.
      VISUAL_MAX_SECTIONS: ${PRODUCTION_VISUAL_MAX_SECTIONS:-6}
      VISUAL_MAX_STEPS_PER_SECTION: ${PRODUCTION_VISUAL_MAX_STEPS_PER_SECTION:-1}
      ANSWER_RATE_PROVIDER_CONCURRENCY: ${PRODUCTION_ANSWER_PROVIDER_CONCURRENCY:-2}
      SERVER_TOMCAT_THREADS_MAX: ${PRODUCTION_TOMCAT_MAX_THREADS:-16}
      SERVER_TOMCAT_THREADS_MIN_SPARE: "4"
      # A guide page reads several independent persisted snapshots. Six connections cover one page fan-out plus
      # background bookkeeping without exceeding PostgreSQL's 30-connection host budget.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "6"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
      # The web application calls its model adapters directly. The optional MCP endpoint is
      # useful for local integrations, but costs a small host a full server/tool graph without
      # serving reader traffic.
      SPRING_AI_MCP_SERVER_ENABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
    # Measured production RSS repeatedly reached the former 640 MiB hard limit and forced reclaim/swap. 896 MiB
    # keeps the 384 MiB heap, ~190 MiB metaspace, thread stacks and bounded image buffers inside the cgroup while
    # leaving more than 1 GiB host headroom with the current worker, database, gateway and observability services.
    mem_limit: 896m

  worker:
    image: ${RULEPILOT_BACKEND_IMAGE:-rulepilot-backend:local}
    # Reuse the API runtime image. Building both services concurrently against
    # the same image tag causes Docker to race while exporting the image.
    build: !reset null
    environment:
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx352m -Xss512k -XX:+UseSerialGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: "1"
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: "1"
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: "1"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
    mem_limit: 560m

  prometheus:
    profiles: ["observability"]

  tempo:
    profiles: ["observability"]

  grafana:
    profiles: ["observability"]

  frontend:
    image: rulepilot-frontend:local
    build:
      context: ../frontend
      dockerfile: Dockerfile.runtime
    ports:
      - "${RULEPILOT_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  gateway:
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
