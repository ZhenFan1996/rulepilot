# Development-only observability access. First run `make compose-up`, then
# `make mcp-grafana-setup`; credentials stay under ignored `.local/` state.
[mcp_servers.rulepilot_grafana]
command = "sh"
args = ["scripts/run-grafana-mcp.sh"]
startup_timeout_sec = 120
tool_timeout_sec = 20
enabled = true
required = false
default_tools_approval_mode = "writes"
enabled_tools = [
  "search_dashboards",
  "list_datasources",
  "get_datasource",
  "check_datasources_health",
  "list_prometheus_metric_names",
  "list_prometheus_label_names",
  "list_prometheus_label_values",
  "query_prometheus",
  "query_prometheus_histogram",
  "get_dashboard_summary",
  "get_dashboard_property",
  "get_dashboard_panel_queries",
  "generate_deeplink",
]

# Anonymous read-only access works without a key. Set CONTEXT7_API_KEY locally
# only when higher Context7 rate limits are needed; never commit the value.
[mcp_servers.rulepilot_context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
startup_timeout_sec = 20
tool_timeout_sec = 30
enabled = true
required = false
default_tools_approval_mode = "writes"
enabled_tools = ["resolve-library-id", "query-docs"]

# Local distributed-trace diagnostics. Tempo already runs in the development
# Compose stack; its embedded MCP endpoint adds no process or credential. Trace
# content stays on the loopback-bound local service unless the client includes
# it in a separate remote-model request.
[mcp_servers.rulepilot_tempo]
url = "http://127.0.0.1:3200/api/mcp"
startup_timeout_sec = 10
tool_timeout_sec = 30
enabled = true
required = false
default_tools_approval_mode = "writes"
enabled_tools = [
  "traceql-search",
  "traceql-metrics-instant",
  "traceql-metrics-range",
  "get-trace",
  "get-attribute-names",
  "get-attribute-values",
  "docs-traceql",
]
