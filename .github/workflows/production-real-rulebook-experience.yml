name: Production real-rulebook experience

on:
  workflow_dispatch:
    inputs:
      rulebook_a_url:
        description: HTTPS URL of the first publisher-hosted PDF
        required: true
        default: https://www.alderac.com/wp-content/uploads/2025/04/PointSalad_BaseGame_Rulebook_Optimized.pdf
        type: string
      rulebook_a_title:
        description: Expected source-grounded title for the first PDF
        required: true
        default: Point Salad
        type: string
      rulebook_b_url:
        description: HTTPS URL of the second publisher-hosted PDF
        required: true
        default: https://filemanager.czechgames.com/storage/files/seti-search-for-extraterrestrial-intelligence/rules/seti-rules-en.pdf
        type: string
      rulebook_b_title:
        description: Expected source-grounded title for the second PDF
        required: true
        default: SETI Search for Extraterrestrial Intelligence
        type: string

permissions:
  contents: read

concurrency:
  group: production-real-rulebook-experience
  cancel-in-progress: false

jobs:
  experience:
    name: Two users generate and browse concurrently
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      RULEBOOK_A_TITLE: ${{ inputs.rulebook_a_title }}
      RULEBOOK_A_URL: ${{ inputs.rulebook_a_url }}
      RULEBOOK_B_TITLE: ${{ inputs.rulebook_b_title }}
      RULEBOOK_B_URL: ${{ inputs.rulebook_b_url }}
      RULEPILOT_PUBLIC_URL: https://rulepilot.cn
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install production browser probe
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure production SSH trust
        shell: bash
        run: |
          set -Eeuo pipefail
          for required_secret in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY DEPLOY_USER; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required production deployment secret: ${required_secret}" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Download publisher-hosted rulebooks
        shell: bash
        run: |
          set -Eeuo pipefail
          for variable_name in RULEBOOK_A_URL RULEBOOK_B_URL; do
            value=${!variable_name}
            if [[ "$value" != https://* ]]; then
              echo "$variable_name must use HTTPS" >&2
              exit 2
            fi
          done
          curl --proto '=https' --location --fail --silent --show-error --max-filesize 26214400 \
            "$RULEBOOK_A_URL" --output "$RUNNER_TEMP/rulebook-a.pdf"
          curl --proto '=https' --location --fail --silent --show-error --max-filesize 26214400 \
            "$RULEBOOK_B_URL" --output "$RUNNER_TEMP/rulebook-b.pdf"
          for pdf in "$RUNNER_TEMP/rulebook-a.pdf" "$RUNNER_TEMP/rulebook-b.pdf"; do
            [[ "$(head -c 5 "$pdf")" == '%PDF-' ]] || { echo "Publisher response was not a PDF" >&2; exit 1; }
          done

      - name: Exercise production with two independent users
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="$GITHUB_WORKSPACE/.artifacts/production-real-rulebook-experience"
          mkdir -p "$artifact_dir"
          printf '{"stage":"preflight"}\n' > "$artifact_dir/status.json"
          chmod 600 "$artifact_dir/status.json"
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o ExitOnForwardFailure=yes
            -o StrictHostKeyChecking=yes
            -p "$DEPLOY_SSH_PORT"
          )

          expected_sha=$(git rev-parse HEAD)
          active_release=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          readlink -f "$1/current"
          REMOTE
          )
          case "${active_release##*/}" in
            "$expected_sha"-*) ;;
            *) echo "Production is not running the checked-out main commit" >&2; exit 1 ;;
          esac

          credentials=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          env_file="$1/current/.env"
          read_value() {
            local value
            value=$(sed -n "s/^$1=//p" "$env_file" | head -n 1)
            value=${value#\"}; value=${value%\"}; value=${value#\'}; value=${value%\'}
            printf '%s' "$value"
          }
          printf '%s\n%s\n%s\n%s' \
            "$(read_value RULEPILOT_USER_USERNAME)" \
            "$(read_value RULEPILOT_USER_PASSWORD)" \
            "$(read_value RULEPILOT_ADMIN_USERNAME)" \
            "$(read_value RULEPILOT_ADMIN_PASSWORD)"
          REMOTE
          )
          mapfile -t credential_lines <<< "$credentials"
          player_username=${credential_lines[0]:-player}
          player_password=${credential_lines[1]:-}
          admin_username=${credential_lines[2]:-admin}
          admin_password=${credential_lines[3]:-}
          test -n "$player_password"
          test -n "$admin_password"
          echo "::add-mask::$player_username"
          echo "::add-mask::$player_password"
          echo "::add-mask::$admin_username"
          echo "::add-mask::$admin_password"

          ssh "${ssh_options[@]}" -N -L 18082:127.0.0.1:8080 "${DEPLOY_USER}@${DEPLOY_HOST}" &
          tunnel_pid=$!
          child_pids=()
          browser_pid=
          server_resource_pid=
          cleanup_processes() {
            touch "$RUNNER_TEMP/concurrent-generation-finished"
            for child_pid in "${child_pids[@]}"; do kill "$child_pid" 2>/dev/null || true; done
            if [[ -n "$browser_pid" ]]; then kill "$browser_pid" 2>/dev/null || true; fi
            if [[ -n "$server_resource_pid" ]]; then kill "$server_resource_pid" 2>/dev/null || true; fi
            kill "$tunnel_pid" 2>/dev/null || true
          }
          trap cleanup_processes EXIT
          for attempt in {1..20}; do
            curl --fail --silent --output /dev/null http://127.0.0.1:18082/actuator/health && break
            [[ "$attempt" == 20 ]] && { echo "Production SSH tunnel did not become ready" >&2; exit 1; }
            sleep 1
          done

          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'trap "exit 0" HUP INT TERM; while true; do
              measured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              docker stats --no-stream --format "{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}" |
                while IFS= read -r measurement; do
                  printf "%s\t%s\n" "$measured_at" "$measurement"
                done
              sleep 5
            done' \
            > "$artifact_dir/server-resources.tsv" \
            2> "$artifact_dir/server-resources-diagnostics.log" &
          server_resource_pid=$!

          RULEPILOT_PRODUCTION_EXPERIENCE=true \
          RULEPILOT_PRODUCTION_BASE_URL="$RULEPILOT_PUBLIC_URL" \
          RULEPILOT_EXPERIENCE_COMPLETION_FILE="$RUNNER_TEMP/concurrent-generation-finished" \
          RULEPILOT_EXPERIENCE_BROWSER_REPORT="$artifact_dir/browser-navigation.json" \
          RULEPILOT_EXPERIENCE_USER_A="$player_username" \
          RULEPILOT_EXPERIENCE_PASSWORD_A="$player_password" \
          RULEPILOT_EXPERIENCE_USER_B="$admin_username" \
          RULEPILOT_EXPERIENCE_PASSWORD_B="$admin_password" \
            npm --prefix frontend exec -- playwright test --config frontend/playwright.production.config.ts &
          browser_pid=$!

          RULEPILOT_SMOKE_PASSWORD="$player_password" \
            bash scripts/smoke-production-ordinary-user.sh \
              --base-url "http://127.0.0.1:18082" \
              --pdf "$RUNNER_TEMP/rulebook-a.pdf" \
              --username "$player_username" \
              --expected-title "${RULEBOOK_A_TITLE,,}" \
              --uploaded-title "$RULEBOOK_A_TITLE" \
              --official-source-url "$RULEBOOK_A_URL" \
              --preparation-mode visual \
              --visual-expectation required \
              --navigation-mode api \
              --navigation-file "$artifact_dir/user-a-navigation.tsv" \
              --result-file "$artifact_dir/user-a-result.json" \
              > "$artifact_dir/user-a-summary.json" 2> "$artifact_dir/user-a-diagnostics.log" &
          child_pids+=("$!")

          RULEPILOT_SMOKE_PASSWORD="$admin_password" \
            bash scripts/smoke-production-ordinary-user.sh \
              --base-url "http://127.0.0.1:18082" \
              --pdf "$RUNNER_TEMP/rulebook-b.pdf" \
              --username "$admin_username" \
              --expected-title "${RULEBOOK_B_TITLE,,}" \
              --uploaded-title "$RULEBOOK_B_TITLE" \
              --official-source-url "$RULEBOOK_B_URL" \
              --visual-expectation required \
              --navigation-mode api \
              --navigation-file "$artifact_dir/user-b-navigation.tsv" \
              --result-file "$artifact_dir/user-b-result.json" \
              > "$artifact_dir/user-b-summary.json" 2> "$artifact_dir/user-b-diagnostics.log" &
          child_pids+=("$!")

          set +e
          wait "${child_pids[0]}"; user_a_status=$?
          wait "${child_pids[1]}"; user_b_status=$?
          set -e
          touch "$RUNNER_TEMP/concurrent-generation-finished"
          for attempt in {1..30}; do
            if ! kill -0 "$browser_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$browser_pid" 2>/dev/null; then
            echo "Browser probe did not stop after the generation completion signal" >&2
            kill "$browser_pid" 2>/dev/null || true
            wait "$browser_pid" 2>/dev/null || true
            browser_status=124
          else
            set +e
            wait "$browser_pid"; browser_status=$?
            set -e
          fi
          if [[ -d frontend/test-results ]]; then
            cp -R frontend/test-results "$artifact_dir/playwright-test-results"
          fi
          kill "$server_resource_pid" 2>/dev/null || true
          wait "$server_resource_pid" 2>/dev/null || true
          server_resource_pid=
          printf '{"userA":%d,"userB":%d,"browser":%d}\n' \
            "$user_a_status" "$user_b_status" "$browser_status" > "$artifact_dir/status.json"
          chmod -R go-rwx "$artifact_dir"
          [[ "$user_a_status" == 0 && "$user_b_status" == 0 && "$browser_status" == 0 ]]

      - name: Upload private diagnostic output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-real-rulebook-experience-${{ github.run_id }}
          path: .artifacts/production-real-rulebook-experience
          if-no-files-found: warn
          retention-days: 1
