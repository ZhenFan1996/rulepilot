name: Production recommendation journey

on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact 40-character main commit SHA already active in production
        required: true
        type: string
      selection_prompt:
        description: Natural player request for one ranked recommendation slate
        required: true
        type: string
        default: '今晚五个人，90 分钟内，BGG 复杂度不超过 2.5，并且只看 BGG 的 PARTY（聚会游戏）分类。请直接挑三款，并把最推荐的一款放第一。'
      requested_card_count:
        description: Card count requested by the player; recorded as shortfall evidence
        required: true
        type: number
        default: 3
      expected_player_count:
        description: Exact hard player count that the typed profile and every returned game must satisfy
        required: true
        type: number
        default: 5
      maximum_duration_minutes:
        description: Hard maximum duration that the typed profile and every returned game must satisfy
        required: true
        type: number
        default: 90
      maximum_complexity:
        description: Hard maximum BGG complexity that the typed profile and every returned game must satisfy
        required: true
        type: number
        default: 2.5
      expected_game_type:
        description: Exact BGG product class that the typed profile and every returned game must satisfy
        required: true
        type: choice
        default: party
        options:
          - abstract
          - customizable
          - children
          - family
          - party
          - strategy
          - thematic
          - war
          - expansion
      expected_title_term:
        description: Optional case-insensitive title term that every card must match
        required: false
        type: string
        default: ''
      expected_provider:
        description: Effective recommendation provider required for this canary
        required: true
        type: string
        default: 'qwen'
      expected_model:
        description: Effective recommendation model required for this canary
        required: true
        type: string
        default: 'qwen3.7-plus'

permissions:
  contents: read

concurrency:
  group: production-runtime
  queue: max
  cancel-in-progress: false

jobs:
  prepare_probe:
    name: Prepare immutable recommendation probe without production authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RULEPILOT_RECOMMENDATION_TESTED_SHA: ${{ inputs.tested_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and detach the exact tested main commit
        shell: bash
        run: |
          set -Eeuo pipefail
          tested_sha="$RULEPILOT_RECOMMENDATION_TESTED_SHA"
          if [[ ! "$tested_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "tested_sha must be one exact lowercase 40-character commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git cat-file -e "${tested_sha}^{commit}"
          if ! git merge-base --is-ancestor "$tested_sha" origin/main; then
            echo "tested_sha is not an ancestor of current origin/main" >&2
            exit 1
          fi
          git checkout --detach "$tested_sha"
          [[ "$(git rev-parse HEAD)" == "$tested_sha" ]]

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and seal the exact browser probe without production authority
        shell: bash
        run: |
          set -Eeuo pipefail
          npm --prefix frontend ci
          playwright_version=$(node -p \
            "require('./frontend/node_modules/@playwright/test/package.json').version")
          [[ "$playwright_version" == '1.61.1' ]]

          artifact_dir="$RUNNER_TEMP/production-recommendation-probe-artifact"
          archive="production-recommendation-probe-${RULEPILOT_RECOMMENDATION_TESTED_SHA}.tar.gz"
          mkdir -p "$artifact_dir"
          tar \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./.artifacts' \
            -czf "$artifact_dir/$archive" .
          (
            cd "$artifact_dir"
            sha256sum "$archive" > "${archive}.sha256"
            sha256sum --check "${archive}.sha256"
          )

      - name: Publish the sealed probe for an isolated production runner
        uses: actions/upload-artifact@v7
        with:
          name: production-recommendation-probe-${{ inputs.tested_sha }}
          path: ${{ runner.temp }}/production-recommendation-probe-artifact
          if-no-files-found: error
          retention-days: 1

  journey:
    name: Production recommendation browser canary
    needs: prepare_probe
    if: needs.prepare_probe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    environment:
      name: production
    env:
      RULEPILOT_PUBLIC_URL: https://rulepilot.cn
      RULEPILOT_RECOMMENDATION_TESTED_SHA: ${{ inputs.tested_sha }}
      RULEPILOT_RECOMMENDATION_SELECTION_PROMPT: ${{ inputs.selection_prompt }}
      RULEPILOT_RECOMMENDATION_EXPECTED_CARD_COUNT: ${{ inputs.requested_card_count }}
      RULEPILOT_RECOMMENDATION_EXPECTED_PLAYER_COUNT: ${{ inputs.expected_player_count }}
      RULEPILOT_RECOMMENDATION_MAXIMUM_DURATION_MINUTES: ${{ inputs.maximum_duration_minutes }}
      RULEPILOT_RECOMMENDATION_MAXIMUM_COMPLEXITY: ${{ inputs.maximum_complexity }}
      RULEPILOT_RECOMMENDATION_EXPECTED_GAME_TYPE: ${{ inputs.expected_game_type }}
      RULEPILOT_RECOMMENDATION_EXPECTED_TITLE_TERM: ${{ inputs.expected_title_term }}
      RULEPILOT_RECOMMENDATION_EXPECTED_PROVIDER: ${{ inputs.expected_provider }}
      RULEPILOT_RECOMMENDATION_EXPECTED_MODEL: ${{ inputs.expected_model }}
    steps:
      - name: Download the sealed probe on a fresh runner
        uses: actions/download-artifact@v8
        with:
          name: production-recommendation-probe-${{ inputs.tested_sha }}
          path: ${{ runner.temp }}/production-recommendation-probe-artifact

      - name: Verify and extract the exact probe before production authority exists
        shell: bash
        run: |
          set -Eeuo pipefail
          tested_sha="$RULEPILOT_RECOMMENDATION_TESTED_SHA"
          artifact_dir="$RUNNER_TEMP/production-recommendation-probe-artifact"
          archive="production-recommendation-probe-${tested_sha}.tar.gz"
          workspace="$RUNNER_TEMP/production-recommendation-probe-workspace"
          [[ "$tested_sha" =~ ^[0-9a-f]{40}$ ]]
          test -f "$artifact_dir/$archive" && test ! -L "$artifact_dir/$archive"
          test -f "$artifact_dir/${archive}.sha256" && test ! -L "$artifact_dir/${archive}.sha256"
          [[ "$(find "$artifact_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" == 2 ]]
          (cd "$artifact_dir" && sha256sum --check "${archive}.sha256")
          mkdir -p "$workspace"
          tar -xzf "$artifact_dir/$archive" -C "$workspace"
          test ! -e "$workspace/.git"
          test ! -e "$workspace/.env"
          playwright_version=$(node -p \
            "require('$workspace/frontend/node_modules/@playwright/test/package.json').version")
          [[ "$playwright_version" == '1.61.1' ]]

      - name: Ensure the official browser image has the fixed probe prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v ssh >/dev/null || ! command -v jq >/dev/null \
              || ! command -v python3 >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              jq openssh-client python3
            rm -rf /var/lib/apt/lists/*
          fi
          command -v node
          command -v ssh
          command -v jq
          command -v python3

      - name: Read exact active release and bounded player credentials
        id: production_identity
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          credential_file="$RUNNER_TEMP/rulepilot-recommendation-player-credentials"
          cleanup_authority() {
            rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          }
          trap cleanup_authority EXIT
          for required_secret in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY DEPLOY_USER; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required production deployment secret: ${required_secret}" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts"
            -p "$DEPLOY_SSH_PORT"
          )
          active_release_coordinates=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$(readlink -f "$1")
          if [[ -e "$application_root/deployment-guards/active-transaction" ]]; then
            echo "Production has an active deployment transaction" >&2
            exit 1
          fi
          readlink -f "$application_root/current"
          readlink -f "$application_root/releases"
          REMOTE
          )
          mapfile -t release_lines <<< "$active_release_coordinates"
          active_release=${release_lines[0]:-}
          releases_root=${release_lines[1]:-}
          active_release_id=${active_release##*/}
          tested_sha="$RULEPILOT_RECOMMENDATION_TESTED_SHA"
          if [[ -z "$active_release" || -z "$releases_root"
            || "${active_release%/*}" != "$releases_root"
            || ! "$active_release_id" =~ ^${tested_sha}-[0-9]+-[0-9]+$ ]]; then
            echo "Production current does not resolve to the exact tested release" >&2
            exit 1
          fi

          credentials=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          env_file="$1/current/.env"
          read_value() {
            local value
            value=$(sed -n "s/^$1=//p" "$env_file" | head -n 1)
            value=${value#\"}; value=${value%\"}; value=${value#\'}; value=${value%\'}
            printf '%s' "$value"
          }
          read_value RULEPILOT_USER_USERNAME | base64 -w0
          printf '\n'
          read_value RULEPILOT_USER_PASSWORD | base64 -w0
          printf '\n'
          REMOTE
          )
          mapfile -t credential_lines <<< "$credentials"
          player_username_b64=${credential_lines[0]:-}
          player_password_b64=${credential_lines[1]:-}
          player_username=$(printf '%s' "$player_username_b64" | base64 --decode)
          player_password=$(printf '%s' "$player_password_b64" | base64 --decode)
          test -n "$player_username"
          test -n "$player_password"
          echo "::add-mask::$player_username"
          echo "::add-mask::$player_password"
          echo "::add-mask::$player_username_b64"
          echo "::add-mask::$player_password_b64"
          umask 077
          printf '%s\n%s\n' "$player_username_b64" "$player_password_b64" > "$credential_file"
          printf 'active_release_id=%s\n' "$active_release_id" >> "$GITHUB_OUTPUT"
          unset player_username player_password player_username_b64 player_password_b64 credentials credential_lines
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          test ! -e "$HOME/.ssh/id_ed25519"
          test ! -e "$HOME/.ssh/known_hosts"

      - name: Exercise one production recommendation with only player authority
        shell: bash
        env:
          RULEPILOT_RECOMMENDATION_ACTIVE_RELEASE_ID: ${{ steps.production_identity.outputs.active_release_id }}
        run: |
          set -Eeuo pipefail
          umask 077
          test ! -e "$HOME/.ssh/id_ed25519"
          test ! -e "$HOME/.ssh/known_hosts"
          credential_file="$RUNNER_TEMP/rulepilot-recommendation-player-credentials"
          workspace="$RUNNER_TEMP/production-recommendation-probe-workspace"
          artifact_dir="$RUNNER_TEMP/production-recommendation-journey"
          raw_report="$artifact_dir/journey.raw.json"
          runner_env_file="$GITHUB_ENV"
          runner_path_file="$GITHUB_PATH"
          case "$runner_env_file" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          case "$runner_path_file" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          reset_runner_command_file() {
            local target=$1
            test -f "$target" && test ! -L "$target"
            /usr/bin/truncate -s 0 -- "$target"
            /usr/bin/chmod 600 -- "$target"
          }
          cleanup_credentials() {
            /usr/bin/rm -f -- "$credential_file"
            reset_runner_command_file "$runner_env_file"
            reset_runner_command_file "$runner_path_file"
          }
          trap cleanup_credentials EXIT
          reset_runner_command_file "$runner_env_file"
          reset_runner_command_file "$runner_path_file"
          test -f "$credential_file" && test ! -L "$credential_file"
          mapfile -t credential_lines < "$credential_file"
          player_username=$(printf '%s' "${credential_lines[0]:-}" | base64 --decode)
          player_password=$(printf '%s' "${credential_lines[1]:-}" | base64 --decode)
          test -n "$player_username"
          test -n "$player_password"
          echo "::add-mask::$player_username"
          echo "::add-mask::$player_password"
          rm -f "$credential_file"

          mkdir -p "$artifact_dir"
          chmod 700 "$artifact_dir"
          node_binary=$(command -v node)
          case "$node_binary" in /usr/bin/node|/usr/local/bin/node) ;; *) exit 1 ;; esac
          cd "$workspace"
          set +e
          /usr/bin/env -i \
            HOME="$HOME" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            PATH=/usr/local/bin:/usr/bin:/bin \
            PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            RULEPILOT_PRODUCTION_RECOMMENDATION_JOURNEY=true \
            RULEPILOT_PRODUCTION_BASE_URL="$RULEPILOT_PUBLIC_URL" \
            RULEPILOT_RECOMMENDATION_USER="$player_username" \
            RULEPILOT_RECOMMENDATION_PASSWORD="$player_password" \
            RULEPILOT_RECOMMENDATION_REPORT="$raw_report" \
            RULEPILOT_RECOMMENDATION_TESTED_SHA="$RULEPILOT_RECOMMENDATION_TESTED_SHA" \
            RULEPILOT_RECOMMENDATION_ACTIVE_RELEASE_ID="$RULEPILOT_RECOMMENDATION_ACTIVE_RELEASE_ID" \
            RULEPILOT_RECOMMENDATION_SELECTION_PROMPT="$RULEPILOT_RECOMMENDATION_SELECTION_PROMPT" \
            RULEPILOT_RECOMMENDATION_EXPECTED_CARD_COUNT="$RULEPILOT_RECOMMENDATION_EXPECTED_CARD_COUNT" \
            RULEPILOT_RECOMMENDATION_EXPECTED_PLAYER_COUNT="$RULEPILOT_RECOMMENDATION_EXPECTED_PLAYER_COUNT" \
            RULEPILOT_RECOMMENDATION_MAXIMUM_DURATION_MINUTES="$RULEPILOT_RECOMMENDATION_MAXIMUM_DURATION_MINUTES" \
            RULEPILOT_RECOMMENDATION_MAXIMUM_COMPLEXITY="$RULEPILOT_RECOMMENDATION_MAXIMUM_COMPLEXITY" \
            RULEPILOT_RECOMMENDATION_EXPECTED_GAME_TYPE="$RULEPILOT_RECOMMENDATION_EXPECTED_GAME_TYPE" \
            RULEPILOT_RECOMMENDATION_EXPECTED_TITLE_TERM="$RULEPILOT_RECOMMENDATION_EXPECTED_TITLE_TERM" \
            RULEPILOT_RECOMMENDATION_EXPECTED_PROVIDER="$RULEPILOT_RECOMMENDATION_EXPECTED_PROVIDER" \
            RULEPILOT_RECOMMENDATION_EXPECTED_MODEL="$RULEPILOT_RECOMMENDATION_EXPECTED_MODEL" \
            "$node_binary" frontend/node_modules/@playwright/test/cli.js test \
              --config frontend/playwright.recommendation-production.config.ts
          journey_status=$?
          set -e
          unset player_username player_password credential_lines
          chmod -R go-rwx "$artifact_dir"
          exit "$journey_status"

      - name: Prove credentials are absent and rebuild the allowlisted journey report
        id: cleanup_credentials
        if: always()
        shell: /bin/bash --noprofile --norc -p {0}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LC_ALL: C
          LD_LIBRARY_PATH: ''
          LD_PRELOAD: ''
          PATH: /usr/bin:/bin
          RULEPILOT_RECOMMENDATION_TESTED_SHA: ${{ inputs.tested_sha }}
          RULEPILOT_RECOMMENDATION_ACTIVE_RELEASE_ID: ${{ steps.production_identity.outputs.active_release_id }}
          RULEPILOT_RECOMMENDATION_EXPECTED_CARD_COUNT: ${{ inputs.requested_card_count }}
          RULEPILOT_RECOMMENDATION_EXPECTED_PLAYER_COUNT: ${{ inputs.expected_player_count }}
          RULEPILOT_RECOMMENDATION_MAXIMUM_DURATION_MINUTES: ${{ inputs.maximum_duration_minutes }}
          RULEPILOT_RECOMMENDATION_MAXIMUM_COMPLEXITY: ${{ inputs.maximum_complexity }}
          RULEPILOT_RECOMMENDATION_EXPECTED_GAME_TYPE: ${{ inputs.expected_game_type }}
          RULEPILOT_RECOMMENDATION_EXPECTED_PROVIDER: ${{ inputs.expected_provider }}
          RULEPILOT_RECOMMENDATION_EXPECTED_MODEL: ${{ inputs.expected_model }}
        run: |
          set -Eeuo pipefail
          artifact_dir="$RUNNER_TEMP/production-recommendation-journey"
          raw_report="$artifact_dir/journey.raw.json"
          sanitized_report="$artifact_dir/journey.json"
          rm -f \
            "$HOME/.ssh/id_ed25519" \
            "$HOME/.ssh/known_hosts" \
            "$RUNNER_TEMP/rulepilot-recommendation-player-credentials"
          test ! -e "$HOME/.ssh/id_ed25519"
          test ! -e "$HOME/.ssh/known_hosts"
          test ! -e "$RUNNER_TEMP/rulepilot-recommendation-player-credentials"
          if [[ -e "$artifact_dir" || -L "$artifact_dir" ]]; then
            test -d "$artifact_dir" && test ! -L "$artifact_dir"
          else
            mkdir -m 700 "$artifact_dir"
          fi
          chmod 700 "$artifact_dir"

          temporary_report=
          sanitization_complete=false
          cleanup_untrusted_reports() {
            rm -f "$raw_report"
            [[ -z "$temporary_report" ]] || rm -f "$temporary_report"
            [[ "$sanitization_complete" == true ]] || rm -f "$sanitized_report"
          }
          trap cleanup_untrusted_reports EXIT
          temporary_report=$(mktemp "$RUNNER_TEMP/production-recommendation-sanitized.XXXXXX")
          rm -f "$sanitized_report"

          tested_sha="$RULEPILOT_RECOMMENDATION_TESTED_SHA"
          active_release_id=${RULEPILOT_RECOMMENDATION_ACTIVE_RELEASE_ID:-not-observed}
          requested_card_count="$RULEPILOT_RECOMMENDATION_EXPECTED_CARD_COUNT"
          expected_player_count="$RULEPILOT_RECOMMENDATION_EXPECTED_PLAYER_COUNT"
          maximum_duration_minutes="$RULEPILOT_RECOMMENDATION_MAXIMUM_DURATION_MINUTES"
          maximum_complexity="$RULEPILOT_RECOMMENDATION_MAXIMUM_COMPLEXITY"
          expected_game_type="$RULEPILOT_RECOMMENDATION_EXPECTED_GAME_TYPE"
          expected_provider="$RULEPILOT_RECOMMENDATION_EXPECTED_PROVIDER"
          expected_model="$RULEPILOT_RECOMMENDATION_EXPECTED_MODEL"

          [[ "$tested_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$active_release_id" != not-observed ]]; then
            [[ "$active_release_id" =~ ^${tested_sha}-[0-9]+-[0-9]+$ ]]
          fi
          [[ "$requested_card_count" =~ ^[0-9]+$ ]]
          [[ "$expected_player_count" =~ ^[0-9]+$ ]]
          [[ "$maximum_duration_minutes" =~ ^[0-9]+$ ]]
          [[ "$maximum_complexity" =~ ^[0-9]+([.][0-9]+)?$ ]]
          (( requested_card_count >= 1 && requested_card_count <= 20 ))
          (( expected_player_count >= 1 && expected_player_count <= 100 ))
          (( maximum_duration_minutes >= 1 && maximum_duration_minutes <= 10080 ))
          jq --exit-status -n --arg value "$maximum_complexity" \
            '$value | tonumber | . > 0 and . <= 5' > /dev/null
          case "$expected_game_type" in
            abstract|customizable|children|family|party|strategy|thematic|war|expansion) ;;
            *) exit 1 ;;
          esac
          [[ "$expected_provider" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$ ]]
          [[ "$expected_model" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]]

          raw_available=false
          if [[ -f "$raw_report" && ! -L "$raw_report" ]]; then
            raw_size=$(wc -c < "$raw_report" | tr -d '[:space:]')
            if [[ "$raw_size" =~ ^[0-9]+$ ]] && (( raw_size <= 1048576 )) \
                && jq --exit-status 'type == "object"' "$raw_report" > /dev/null 2>&1; then
              raw_available=true
            fi
          fi
          if [[ "$raw_available" != true ]]; then
            rm -f "$raw_report"
            printf 'null\n' > "$raw_report"
            chmod 600 "$raw_report"
          fi

          jq --exit-status --compact-output \
            --arg testedSha "$tested_sha" \
            --arg activeReleaseId "$active_release_id" \
            --arg expectedProvider "$expected_provider" \
            --arg expectedModel "$expected_model" \
            --arg expectedGameType "$expected_game_type" \
            --argjson requestedCardCount "$requested_card_count" \
            --argjson expectedPlayerCount "$expected_player_count" \
            --argjson maximumDurationMinutes "$maximum_duration_minutes" \
            --argjson maximumComplexity "$maximum_complexity" '
              def is_finite_number:
                type == "number" and ((. - .) == 0);
              def is_integer($minimum; $maximum):
                is_finite_number and . == floor and . >= $minimum and . <= $maximum;
              def is_integer_or_null($minimum; $maximum):
                . == null or is_integer($minimum; $maximum);
              def is_elapsed_array:
                type == "array" and all(.[]; is_integer(0; 120000));
              def is_boolean_or_null:
                . == null or type == "boolean";
              def is_sha256:
                type == "string" and test("^[0-9a-f]{64}$");
              def is_sha256_or_null:
                . == null or is_sha256;
              def is_uuid:
                type == "string"
                  and test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$");
              def is_uuid_or_null:
                . == null or is_uuid;
              def is_safe_text:
                type == "string" and length >= 1 and length <= 128
                  and test("^[A-Za-z0-9_./: -]+$");
              def is_safe_text_or_null:
                . == null or is_safe_text;
              def is_outcome_or_null:
                . == null or IN("conversation", "needs_clarification", "recommendations",
                  "no_match", "unavailable");
              def is_failure_or_null:
                . == null or (
                  type == "object"
                  and (.classification
                    | IN("product_terminal", "terminal_evidence_gap",
                      "lifecycle_deadline", "observer_failure"))
                  and (.boundary == null or (.boundary
                    | IN("time_budget", "model_response", "service_configuration",
                      "action_budget", "publication_boundary", "service_failure")))
                  and (.reason == null or (.reason
                    | IN("time_limit", "model_not_configured", "resource_budget_exhausted",
                      "provider_call_failed", "provider_protocol_invalid",
                      "provider_output_truncated", "empty_model_response",
                      "repeated_incompatible_actions", "repeated_invalid_action",
                      "publication_rejected", "service_failure")))
                  and (.code | is_safe_text_or_null)
                );
              def is_release_or_null:
                . == null or (
                  type == "object"
                  and (.releaseId | type) == "string"
                  and (.releaseId | test("^[0-9a-f]{40}-[0-9]+(-[0-9]+)?$"))
                  and (.commitSha | type) == "string"
                  and (.commitSha | test("^[0-9a-f]{40}$"))
                  and (.noStore | type) == "boolean"
                );
              def is_model_or_null:
                . == null or (
                  type == "object"
                  and (.provider | is_safe_text)
                  and (.model | is_safe_text)
                );
              def is_card:
                type == "object"
                  and (.bggId | is_integer(1; 1000000000))
                  and (.nameSha256 | is_sha256)
                  and (.originalNameSha256 | is_sha256)
                  and (.replyPartsSha256 | is_sha256);
              def is_safe_text_array($maximum):
                type == "array" and length <= $maximum and all(.[]; is_safe_text);
              def is_report_shape:
                type == "object"
                  and .reportSchemaVersion == 2
                  and (.generatedAt | type) == "string"
                  and (.generatedAt | length) <= 64
                  and (.completed | type) == "boolean"
                  and (.stage | is_safe_text)
                  and (.failedStage | is_safe_text_or_null)
                  and (.fatalFailure | is_failure_or_null)
                  and .rawModelOutputCaptured == false
                  and (.deployment | type) == "object"
                  and (.deployment.testedSha | type) == "string"
                  and (.deployment.activeReleaseId | type) == "string"
                  and (.deployment.before | is_release_or_null)
                  and (.deployment.after | is_release_or_null)
                  and (.deployment.exactAndStable | is_boolean_or_null)
                  and (.model | type) == "object"
                  and (.model.expected | is_model_or_null)
                  and .model.expected != null
                  and (.model.before | is_model_or_null)
                  and (.model.after | is_model_or_null)
                  and (.model.stable | is_boolean_or_null)
                  and (.naturalReply | type) == "object"
                  and (.naturalReply.promptSha256 | is_sha256)
                  and (.naturalReply.requestMatched | type) == "boolean"
                  and (.naturalReply.outcome | is_outcome_or_null)
                  and (.naturalReply.assistantMessageSha256 | is_sha256_or_null)
                  and (.naturalReply.noExternalWork | is_boolean_or_null)
                  and (.naturalReply.persistedMatched | is_boolean_or_null)
                  and (.naturalReply.domMatched | is_boolean_or_null)
                  and (.naturalReply.agentElapsedMs | is_integer_or_null(0; 120000))
                  and (.naturalReply.modelCallElapsedMs | is_elapsed_array)
                  and (.naturalReply.failure | is_failure_or_null)
                  and (.recommendation | type) == "object"
                  and (.recommendation.promptSha256 | is_sha256)
                  and (.recommendation.requestedCardCount | is_integer_or_null(1; 20))
                  and (.recommendation.expectedPlayerCount | is_integer_or_null(1; 100))
                  and (.recommendation.maximumDurationMinutes | is_integer_or_null(1; 10080))
                  and (.recommendation.maximumComplexity == null
                    or (.recommendation.maximumComplexity | is_finite_number)
                      and .recommendation.maximumComplexity > 0
                      and .recommendation.maximumComplexity <= 5)
                  and (.recommendation.expectedGameType == null
                    or (.recommendation.expectedGameType
                      | IN("abstract", "customizable", "children", "family", "party",
                        "strategy", "thematic", "war", "expansion")))
                  and (.recommendation.requestMatched | type) == "boolean"
                  and (.recommendation.outcome | is_outcome_or_null)
                  and (.recommendation.assistantMessageSha256 | is_sha256_or_null)
                  and (.recommendation.cards | type) == "array"
                  and (.recommendation.cards | length) <= 20
                  and all(.recommendation.cards[]; is_card)
                  and (.recommendation.shortfallCount | is_integer_or_null(0; 20))
                  and (.recommendation.publicationErrors | is_safe_text_array(64))
                  and (.recommendation.persistedMatched | is_boolean_or_null)
                  and (.recommendation.domMatched | is_boolean_or_null)
                  and (.recommendation.agentElapsedMs | is_integer_or_null(0; 120000))
                  and (.recommendation.modelCallElapsedMs | is_elapsed_array)
                  and (.recommendation.failure | is_failure_or_null)
                  and (.handoff | type) == "object"
                  and (.handoff.selectedBggId | is_integer_or_null(1; 1000000000))
                  and (.handoff.actionClicked | type) == "boolean"
                  and (.handoff.importResponseStatus | is_integer_or_null(100; 599))
                  and (.handoff.importedBggId | is_integer_or_null(1; 1000000000))
                  and (.handoff.importedGameId | is_uuid_or_null)
                  and (.handoff.importedEditionId | is_uuid_or_null)
                  and (.handoff.editionBelongsToGame | is_boolean_or_null)
                  and (.handoff.existingJobId | is_uuid_or_null)
                  and (.handoff.discoveryEditionMatched | is_boolean_or_null)
                  and (.handoff.sourceCount | is_integer_or_null(0; 10000))
                  and (.handoff.terminal
                    | IN("NOT_OBSERVED", "SOURCE_REVIEW", "SOURCE_UNAVAILABLE",
                      "RULEBOOK_READABLE", "LESSON_READABLE", "EXPLICIT_FAILURE"))
                  and (.handoff.surfaceState | is_safe_text_or_null)
                  and (.handoff.canReadRulebook | type) == "boolean"
                  and (.handoff.canReadLesson | type) == "boolean"
                  and (.handoff.failureClassification | is_safe_text_or_null)
                  and (.handoff.blockedMutationPaths | is_safe_text_array(16));
              def exact_release($release):
                $release != null
                  and $release.releaseId == $activeReleaseId
                  and $release.commitSha == $testedSha
                  and $release.noStore == true;
              def exact_model($model):
                $model != null
                  and $model.provider == $expectedProvider
                  and $model.model == $expectedModel;
              def accepted_handoff($handoff; $selectedBggId):
                $handoff.selectedBggId == $selectedBggId
                  and $handoff.actionClicked == true
                  and ($handoff.importResponseStatus
                    | is_integer(200; 299))
                  and $handoff.importedBggId == $selectedBggId
                  and ($handoff.importedGameId | is_uuid)
                  and ($handoff.importedEditionId | is_uuid)
                  and $handoff.editionBelongsToGame == true
                  and $handoff.failureClassification == null
                  and ($handoff.blockedMutationPaths | length) == 0
                  and (
                    if $handoff.terminal == "SOURCE_REVIEW" then
                      $handoff.discoveryEditionMatched == true
                    elif $handoff.terminal == "SOURCE_UNAVAILABLE" then
                      $handoff.discoveryEditionMatched == true
                    elif $handoff.terminal == "RULEBOOK_READABLE" then
                      ($handoff.existingJobId | is_uuid)
                    elif $handoff.terminal == "LESSON_READABLE" then
                      ($handoff.existingJobId | is_uuid)
                    else false
                    end
                  );
              def completed_acceptance($raw):
                $raw.reportSchemaVersion == 2
                  and $raw.completed == true
                  and $raw.stage == "completed"
                  and $raw.failedStage == null
                  and $raw.fatalFailure == null
                  and $raw.rawModelOutputCaptured == false
                  and $raw.deployment.testedSha == $testedSha
                  and $raw.deployment.activeReleaseId == $activeReleaseId
                  and exact_release($raw.deployment.before)
                  and exact_release($raw.deployment.after)
                  and $raw.deployment.exactAndStable == true
                  and exact_model($raw.model.expected)
                  and exact_model($raw.model.before)
                  and exact_model($raw.model.after)
                  and $raw.model.stable == true
                  and $raw.naturalReply.requestMatched == true
                  and $raw.naturalReply.outcome == "conversation"
                  and ($raw.naturalReply.promptSha256 | is_sha256)
                  and ($raw.naturalReply.assistantMessageSha256 | is_sha256)
                  and $raw.naturalReply.noExternalWork == true
                  and $raw.naturalReply.persistedMatched == true
                  and $raw.naturalReply.domMatched == true
                  and ($raw.naturalReply.agentElapsedMs | is_integer(0; 120000))
                  and ($raw.naturalReply.modelCallElapsedMs | is_elapsed_array)
                  and $raw.naturalReply.failure == null
                  and $raw.recommendation.requestedCardCount == $requestedCardCount
                  and $raw.recommendation.expectedPlayerCount == $expectedPlayerCount
                  and $raw.recommendation.maximumDurationMinutes == $maximumDurationMinutes
                  and $raw.recommendation.maximumComplexity == $maximumComplexity
                  and $raw.recommendation.expectedGameType == $expectedGameType
                  and $raw.recommendation.requestMatched == true
                  and $raw.recommendation.outcome == "recommendations"
                  and ($raw.recommendation.promptSha256 | is_sha256)
                  and ($raw.recommendation.assistantMessageSha256 | is_sha256)
                  and ($raw.recommendation.cards | length) >= 1
                  and ($raw.recommendation.cards | length) <= $requestedCardCount
                  and all($raw.recommendation.cards[]; is_card)
                  and ([ $raw.recommendation.cards[].bggId ] | unique | length)
                    == ($raw.recommendation.cards | length)
                  and $raw.recommendation.shortfallCount
                    == ($requestedCardCount - ($raw.recommendation.cards | length))
                  and ($raw.recommendation.publicationErrors | length) == 0
                  and $raw.recommendation.persistedMatched == true
                  and $raw.recommendation.domMatched == true
                  and ($raw.recommendation.agentElapsedMs | is_integer(0; 120000))
                  and ($raw.recommendation.modelCallElapsedMs | is_elapsed_array)
                  and $raw.recommendation.failure == null
                  and accepted_handoff(
                    $raw.handoff;
                    $raw.recommendation.cards[0].bggId
                  );
              def fallback_report($code):
                {
                  reportSchemaVersion: 2,
                  generatedAt: (now | todateiso8601),
                  completed: false,
                  stage: "preflight-failed",
                  failedStage: "preflight",
                  fatalFailure: {
                    classification: "observer_failure",
                    boundary: null,
                    reason: null,
                    code: $code
                  },
                  rawModelOutputCaptured: false,
                  deployment: {
                    testedSha: $testedSha,
                    activeReleaseId: $activeReleaseId,
                    before: null,
                    after: null,
                    exactAndStable: null
                  },
                  model: {
                    expected: {provider: $expectedProvider, model: $expectedModel},
                    before: null,
                    after: null,
                    stable: null
                  },
                  naturalReply: {
                    promptSha256: null,
                    requestMatched: false,
                    outcome: null,
                    assistantMessageSha256: null,
                    noExternalWork: null,
                    persistedMatched: null,
                    domMatched: null,
                    agentElapsedMs: null,
                    modelCallElapsedMs: [],
                    failure: null
                  },
                  recommendation: {
                    promptSha256: null,
                    requestedCardCount: $requestedCardCount,
                    expectedPlayerCount: $expectedPlayerCount,
                    maximumDurationMinutes: $maximumDurationMinutes,
                    maximumComplexity: $maximumComplexity,
                    expectedGameType: $expectedGameType,
                    requestMatched: false,
                    outcome: null,
                    assistantMessageSha256: null,
                    cards: [],
                    shortfallCount: null,
                    publicationErrors: [],
                    persistedMatched: null,
                    domMatched: null,
                    agentElapsedMs: null,
                    modelCallElapsedMs: [],
                    failure: null
                  },
                  handoff: {
                    selectedBggId: null,
                    actionClicked: false,
                    importResponseStatus: null,
                    importedBggId: null,
                    importedGameId: null,
                    importedEditionId: null,
                    editionBelongsToGame: null,
                    existingJobId: null,
                    discoveryEditionMatched: null,
                    sourceCount: null,
                    terminal: "NOT_OBSERVED",
                    surfaceState: null,
                    canReadRulebook: false,
                    canReadLesson: false,
                    failureClassification: null,
                    blockedMutationPaths: []
                  }
                };
              if is_report_shape then
                completed_acceptance(.) as $accepted
                | {
                    reportSchemaVersion: 2,
                    generatedAt: .generatedAt,
                    completed: $accepted,
                    stage: (
                      if $accepted then "completed"
                      elif .completed then "failed-acceptance"
                      else .stage
                      end
                    ),
                    failedStage: (
                      if $accepted then null
                      elif .failedStage != null then .failedStage
                      else .stage
                      end
                    ),
                    fatalFailure: (
                      if $accepted then null
                      elif .fatalFailure != null then .fatalFailure
                      else {
                        classification: "observer_failure",
                        boundary: null,
                        reason: null,
                        code: "acceptance_contract_failed"
                      }
                      end
                    ),
                    rawModelOutputCaptured: false,
                    deployment: {
                      testedSha: $testedSha,
                      activeReleaseId: $activeReleaseId,
                      before: .deployment.before,
                      after: .deployment.after,
                      exactAndStable: .deployment.exactAndStable
                    },
                    model: {
                      expected: {provider: $expectedProvider, model: $expectedModel},
                      before: .model.before,
                      after: .model.after,
                      stable: .model.stable
                    },
                    naturalReply: {
                      promptSha256: .naturalReply.promptSha256,
                      requestMatched: .naturalReply.requestMatched,
                      outcome: .naturalReply.outcome,
                      assistantMessageSha256: .naturalReply.assistantMessageSha256,
                      noExternalWork: .naturalReply.noExternalWork,
                      persistedMatched: .naturalReply.persistedMatched,
                      domMatched: .naturalReply.domMatched,
                      agentElapsedMs: .naturalReply.agentElapsedMs,
                      modelCallElapsedMs: .naturalReply.modelCallElapsedMs,
                      failure: .naturalReply.failure
                    },
                    recommendation: {
                      promptSha256: .recommendation.promptSha256,
                      requestedCardCount: $requestedCardCount,
                      expectedPlayerCount: $expectedPlayerCount,
                      maximumDurationMinutes: $maximumDurationMinutes,
                      maximumComplexity: $maximumComplexity,
                      expectedGameType: $expectedGameType,
                      requestMatched: .recommendation.requestMatched,
                      outcome: .recommendation.outcome,
                      assistantMessageSha256: .recommendation.assistantMessageSha256,
                      cards: [.recommendation.cards[] | {
                        bggId, nameSha256, originalNameSha256, replyPartsSha256
                      }],
                      shortfallCount: .recommendation.shortfallCount,
                      publicationErrors: .recommendation.publicationErrors,
                      persistedMatched: .recommendation.persistedMatched,
                      domMatched: .recommendation.domMatched,
                      agentElapsedMs: .recommendation.agentElapsedMs,
                      modelCallElapsedMs: .recommendation.modelCallElapsedMs,
                      failure: .recommendation.failure
                    },
                    handoff: {
                      selectedBggId: .handoff.selectedBggId,
                      actionClicked: .handoff.actionClicked,
                      importResponseStatus: .handoff.importResponseStatus,
                      importedBggId: .handoff.importedBggId,
                      importedGameId: .handoff.importedGameId,
                      importedEditionId: .handoff.importedEditionId,
                      editionBelongsToGame: .handoff.editionBelongsToGame,
                      existingJobId: .handoff.existingJobId,
                      discoveryEditionMatched: .handoff.discoveryEditionMatched,
                      sourceCount: .handoff.sourceCount,
                      terminal: .handoff.terminal,
                      surfaceState: .handoff.surfaceState,
                      canReadRulebook: .handoff.canReadRulebook,
                      canReadLesson: .handoff.canReadLesson,
                      failureClassification: .handoff.failureClassification,
                      blockedMutationPaths: .handoff.blockedMutationPaths
                    }
                  }
              else
                fallback_report("missing_or_invalid_raw_report")
              end
            ' "$raw_report" > "$temporary_report"

          chmod 600 "$temporary_report"
          mv "$temporary_report" "$sanitized_report"
          rm -f "$raw_report"
          test -f "$sanitized_report" && test ! -L "$sanitized_report"
          [[ "$(find "$artifact_dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" == 1 ]]
          chmod -R go-rwx "$artifact_dir"
          sanitization_complete=true
          trap - EXIT

      - name: Upload sanitized journey report
        if: always() && steps.cleanup_credentials.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: production-recommendation-journey-${{ github.run_id }}
          path: ${{ runner.temp }}/production-recommendation-journey/journey.json
          if-no-files-found: error
          retention-days: 14

      - name: Require a completed production recommendation journey
        if: always() && steps.cleanup_credentials.outcome == 'success'
        shell: /bin/bash --noprofile --norc -p {0}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          GITHUB_ENV: /dev/null
          GITHUB_PATH: /dev/null
          LD_PRELOAD: ''
          PATH: /usr/bin:/bin
          RULEPILOT_RECOMMENDATION_TESTED_SHA: ${{ inputs.tested_sha }}
          RULEPILOT_RECOMMENDATION_ACTIVE_RELEASE_ID: ${{ steps.production_identity.outputs.active_release_id }}
          RULEPILOT_RECOMMENDATION_EXPECTED_CARD_COUNT: ${{ inputs.requested_card_count }}
          RULEPILOT_RECOMMENDATION_EXPECTED_PROVIDER: ${{ inputs.expected_provider }}
          RULEPILOT_RECOMMENDATION_EXPECTED_MODEL: ${{ inputs.expected_model }}
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/production-recommendation-journey/journey.json"
          test -f "$report" && test ! -L "$report"
          jq --exit-status \
            --arg testedSha "$RULEPILOT_RECOMMENDATION_TESTED_SHA" \
            --arg activeReleaseId "$RULEPILOT_RECOMMENDATION_ACTIVE_RELEASE_ID" \
            --arg expectedProvider "$RULEPILOT_RECOMMENDATION_EXPECTED_PROVIDER" \
            --arg expectedModel "$RULEPILOT_RECOMMENDATION_EXPECTED_MODEL" \
            --argjson requestedCardCount "$RULEPILOT_RECOMMENDATION_EXPECTED_CARD_COUNT" '
              def is_sha256:
                type == "string" and test("^[0-9a-f]{64}$");
              def is_uuid:
                type == "string"
                  and test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$");
              def exact_release:
                .releaseId == $activeReleaseId
                  and .commitSha == $testedSha
                  and .noStore == true;
              def exact_model:
                .provider == $expectedProvider and .model == $expectedModel;
              .reportSchemaVersion == 2
                and .completed == true
                and .stage == "completed"
                and .failedStage == null
                and .fatalFailure == null
                and .rawModelOutputCaptured == false
                and .deployment.testedSha == $testedSha
                and .deployment.activeReleaseId == $activeReleaseId
                and (.deployment.before | exact_release)
                and (.deployment.after | exact_release)
                and .deployment.exactAndStable == true
                and (.model.expected | exact_model)
                and (.model.before | exact_model)
                and (.model.after | exact_model)
                and .model.stable == true
                and .naturalReply.requestMatched == true
                and .naturalReply.outcome == "conversation"
                and (.naturalReply.promptSha256 | is_sha256)
                and (.naturalReply.assistantMessageSha256 | is_sha256)
                and .naturalReply.noExternalWork == true
                and .naturalReply.persistedMatched == true
                and .naturalReply.domMatched == true
                and .naturalReply.failure == null
                and .recommendation.requestedCardCount == $requestedCardCount
                and .recommendation.requestMatched == true
                and .recommendation.outcome == "recommendations"
                and (.recommendation.promptSha256 | is_sha256)
                and (.recommendation.assistantMessageSha256 | is_sha256)
                and (.recommendation.cards | length) >= 1
                and (.recommendation.cards | length) <= $requestedCardCount
                and all(.recommendation.cards[];
                  (.bggId | type) == "number"
                    and (.nameSha256 | is_sha256)
                    and (.originalNameSha256 | is_sha256)
                    and (.replyPartsSha256 | is_sha256))
                and ([.recommendation.cards[].bggId] | unique | length)
                  == (.recommendation.cards | length)
                and .recommendation.shortfallCount
                  == ($requestedCardCount - (.recommendation.cards | length))
                and (.recommendation.publicationErrors | length) == 0
                and .recommendation.persistedMatched == true
                and .recommendation.domMatched == true
                and .recommendation.failure == null
                and .handoff.selectedBggId == .recommendation.cards[0].bggId
                and .handoff.actionClicked == true
                and .handoff.importResponseStatus >= 200
                and .handoff.importResponseStatus < 300
                and .handoff.importedBggId == .handoff.selectedBggId
                and (.handoff.importedGameId | is_uuid)
                and (.handoff.importedEditionId | is_uuid)
                and .handoff.editionBelongsToGame == true
                and .handoff.failureClassification == null
                and (.handoff.blockedMutationPaths | length) == 0
                and (
                  if .handoff.terminal == "SOURCE_REVIEW" then
                    .handoff.discoveryEditionMatched == true
                  elif .handoff.terminal == "SOURCE_UNAVAILABLE" then
                    .handoff.discoveryEditionMatched == true
                  elif .handoff.terminal == "RULEBOOK_READABLE" then
                    (.handoff.existingJobId | is_uuid)
                  elif .handoff.terminal == "LESSON_READABLE" then
                    (.handoff.existingJobId | is_uuid)
                  else false
                  end
                )
            ' "$report" > /dev/null
