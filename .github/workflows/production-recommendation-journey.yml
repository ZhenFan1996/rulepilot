name: Production recommendation journey

on:
  workflow_dispatch:
    inputs:
      target_bgg_id:
        description: Exact BGG base-game id
        required: true
        type: string
        default: '230802'
      target_names:
        description: Literal game-name aliases separated by |
        required: true
        type: string
        default: '花砖物语|Azul'
      recommendation_prompt:
        description: Natural-language request that must produce the selected game
        required: true
        type: string
        default: '我今晚已经决定玩花砖物语（Azul），第一次开桌。请直接帮我找到这款，不要换成相似游戏；找到后我想接着读规则书、听讲解，再问几个问题。'
      rule_question:
        description: Question asked after the cited lesson becomes readable
        required: true
        type: string
        default: '我从一个工厂展示板拿走同色砖以后，剩下的砖要放到哪里？请用日常的话简短回答，并引用规则书页码。'
      require_fresh_import:
        description: Fail if production reuses an existing imported rulebook
        required: true
        type: boolean
        default: false
      diagnostics_only:
        description: Collect bounded production answer diagnostics without replaying the browser journey
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-runtime
  cancel-in-progress: false

jobs:
  journey:
    name: Recommendation, Gstone import, teaching, and cited Q&A
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      RULEPILOT_PUBLIC_URL: https://rulepilot.cn
      RULEPILOT_RECOMMENDATION_TARGET_BGG_ID: ${{ inputs.target_bgg_id }}
      RULEPILOT_RECOMMENDATION_TARGET_NAMES: ${{ inputs.target_names }}
      RULEPILOT_RECOMMENDATION_PROMPT: ${{ inputs.recommendation_prompt }}
      RULEPILOT_RECOMMENDATION_RULE_QUESTION: ${{ inputs.rule_question }}
      RULEPILOT_RECOMMENDATION_REQUIRE_FRESH_IMPORT: ${{ inputs.require_fresh_import }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install production browser probe
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure production SSH trust
        shell: bash
        run: |
          set -Eeuo pipefail
          for required_secret in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY DEPLOY_USER; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required production deployment secret: ${required_secret}" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Exercise the complete public recommendation journey
        if: ${{ !inputs.diagnostics_only }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          artifact_dir="$GITHUB_WORKSPACE/.artifacts/production-recommendation-journey"
          mkdir -p "$artifact_dir"
          chmod 700 "$artifact_dir"
          printf '{"completed":false,"stage":"preflight"}\n' > "$artifact_dir/journey.json"
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -p "$DEPLOY_SSH_PORT"
          )

          expected_sha=$(git rev-parse HEAD)
          active_release=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          readlink -f "$1/current"
          REMOTE
          )
          case "${active_release##*/}" in
            "$expected_sha"-*) ;;
            *) echo "Production is not running the checked-out main commit" >&2; exit 1 ;;
          esac

          credentials=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          env_file="$1/current/.env"
          read_value() {
            local value
            value=$(sed -n "s/^$1=//p" "$env_file" | head -n 1)
            value=${value#\"}; value=${value%\"}; value=${value#\'}; value=${value%\'}
            printf '%s' "$value"
          }
          printf '%s\n%s' \
            "$(read_value RULEPILOT_USER_USERNAME)" \
            "$(read_value RULEPILOT_USER_PASSWORD)"
          REMOTE
          )
          mapfile -t credential_lines <<< "$credentials"
          player_username=${credential_lines[0]:-}
          player_password=${credential_lines[1]:-}
          test -n "$player_username"
          test -n "$player_password"
          echo "::add-mask::$player_username"
          echo "::add-mask::$player_password"

          RULEPILOT_PRODUCTION_RECOMMENDATION_JOURNEY=true \
          RULEPILOT_PRODUCTION_BASE_URL="$RULEPILOT_PUBLIC_URL" \
          RULEPILOT_RECOMMENDATION_USER="$player_username" \
          RULEPILOT_RECOMMENDATION_PASSWORD="$player_password" \
          RULEPILOT_RECOMMENDATION_REPORT="$artifact_dir/journey.json" \
            npm --prefix frontend exec -- playwright test \
              --config frontend/playwright.recommendation-production.config.ts
          chmod -R go-rwx "$artifact_dir"

      - name: Collect bounded API diagnostics after a failed journey
        if: ${{ failure() || inputs.diagnostics_only }}
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="$GITHUB_WORKSPACE/.artifacts/production-recommendation-journey"
          diagnostic_file="$artifact_dir/api-diagnostics.log"
          mkdir -p "$artifact_dir"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" > "$diagnostic_file" 2>&1 <<'REMOTE' || true
          set -Eeuo pipefail
          application_root=$1
          active_release=$(readlink -f "${application_root}/current")
          if [[ "$active_release" != "${application_root}/releases/"* ]]; then
            echo "Refusing to inspect an active release outside ${application_root}/releases" >&2
            exit 1
          fi
          cd "$active_release"
          compose=(
            docker compose --env-file .env
            -f infra/compose.yml
            -f infra/compose.deployment.yml
            -f infra/compose.production.yml
          )
          echo "Active production services:"
          "${compose[@]}" ps api worker
          echo "API logs from the last 35 minutes (bounded to 500 lines):"
          "${compose[@]}" logs --since 35m --tail 500 --no-color api
          echo "Worker logs from the last 35 minutes (bounded to 500 lines):"
          "${compose[@]}" logs --since 35m --tail 500 --no-color worker
          owner_username=$(sed -n 's/^RULEPILOT_USER_USERNAME=//p' .env | head -n 1)
          owner_username=${owner_username#\"}
          owner_username=${owner_username%\"}
          owner_username=${owner_username#\'}
          owner_username=${owner_username%\'}
          if [[ -n "$owner_username" ]]; then
            echo "Recent answer Run outcomes and bounded activity timings:"
            "${compose[@]}" exec -T postgres sh -c '
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -v owner="$1" -P pager=off <<'"'"'SQL'"'"'
              WITH recent AS (
                SELECT id, state, last_error_code, created_at, updated_at, completed_at
                FROM assistant_run
                WHERE mode = '"'"'QUESTION_ANSWER'"'"'
                  AND owner_username = :'"'"'owner'"'"'
                  AND created_at >= now() - interval '"'"'20 minutes'"'"'
                ORDER BY created_at DESC
                LIMIT 3
              )
              SELECT id, state, last_error_code,
                     round(extract(epoch FROM (coalesce(completed_at, updated_at) - created_at))::numeric, 3)
                       AS wall_seconds
              FROM recent
              ORDER BY created_at DESC;

              WITH recent AS (
                SELECT id
                FROM assistant_run
                WHERE mode = '"'"'QUESTION_ANSWER'"'"'
                  AND owner_username = :'"'"'owner'"'"'
                  AND created_at >= now() - interval '"'"'20 minutes'"'"'
                ORDER BY created_at DESC
                LIMIT 3
              )
              SELECT activity.assistant_run_id, activity.sequence_number, activity.activity_type,
                     activity.operation_name, activity.outcome, activity.latency_ms
              FROM assistant_run_activity activity
              JOIN recent ON recent.id = activity.assistant_run_id
              ORDER BY activity.occurred_at;

              SELECT turn.id, turn.answer_status, count(citation.position) AS citation_count,
                     length(turn.short_verdict) AS verdict_chars,
                     length(turn.explanation) AS explanation_chars
              FROM game_session_conversation_turn turn
              LEFT JOIN game_session_turn_citation citation ON citation.turn_id = turn.id
              WHERE turn.created_by = :'"'"'owner'"'"'
                AND turn.created_at >= now() - interval '"'"'20 minutes'"'"'
              GROUP BY turn.id, turn.answer_status, turn.short_verdict, turn.explanation, turn.created_at
              ORDER BY turn.created_at DESC
              LIMIT 3;
              SQL
            ' sh "$owner_username"
          fi
          REMOTE
          chmod 600 "$diagnostic_file"

      - name: Upload private journey measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-recommendation-journey-${{ github.run_id }}
          path: .artifacts/production-recommendation-journey
          if-no-files-found: error
          retention-days: 14
