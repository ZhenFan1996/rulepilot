name: Production recommendation journey

on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact 40-character main commit SHA already active in production
        required: true
        type: string
      selection_prompt:
        description: Natural player request for one ranked recommendation slate
        required: true
        type: string
        default: '今晚五个人，想玩能谈判、互相骗一骗的；有两个新手，90 分钟内。请直接挑三款，并把你最推荐的一款放第一。'
      requested_card_count:
        description: Card count requested by the player; recorded as shortfall evidence
        required: true
        type: number
        default: 3
      expected_title_term:
        description: Optional case-insensitive title term that every card must match
        required: true
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: production-runtime
  cancel-in-progress: false

jobs:
  journey:
    name: Production recommendation canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      RULEPILOT_PUBLIC_URL: https://rulepilot.cn
      RULEPILOT_RECOMMENDATION_TESTED_SHA: ${{ inputs.tested_sha }}
      RULEPILOT_RECOMMENDATION_SELECTION_PROMPT: ${{ inputs.selection_prompt }}
      RULEPILOT_RECOMMENDATION_EXPECTED_CARD_COUNT: ${{ inputs.requested_card_count }}
      RULEPILOT_RECOMMENDATION_EXPECTED_TITLE_TERM: ${{ inputs.expected_title_term }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tested_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install production browser probe
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure production SSH trust
        shell: bash
        run: |
          set -Eeuo pipefail
          for required_secret in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY DEPLOY_USER; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required production deployment secret: ${required_secret}" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Exercise one production recommendation
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          artifact_dir="$GITHUB_WORKSPACE/.artifacts/production-recommendation-journey"
          report="$artifact_dir/journey.json"
          mkdir -p "$artifact_dir"
          chmod 700 "$artifact_dir"
          jq -n \
            --arg testedSha "$RULEPILOT_RECOMMENDATION_TESTED_SHA" \
            '{generatedAt:(now | todate),completed:false,stage:"preflight",testedSha:$testedSha,activeReleaseSha:null}' \
            > "$report"

          if [[ ! "$RULEPILOT_RECOMMENDATION_TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "tested_sha must be one exact lowercase 40-character commit SHA" >&2
            exit 1
          fi
          tested_sha=$(git rev-parse HEAD)
          if [[ "$tested_sha" != "$RULEPILOT_RECOMMENDATION_TESTED_SHA" ]]; then
            echo "The checked-out commit does not equal tested_sha" >&2
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$tested_sha" origin/main; then
            echo "tested_sha is not an ancestor of current origin/main" >&2
            exit 1
          fi

          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -p "$DEPLOY_SSH_PORT"
          )
          active_release_coordinates=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$(readlink -f "$1")
          readlink -f "$application_root/current"
          readlink -f "$application_root/releases"
          REMOTE
          )
          mapfile -t release_lines <<< "$active_release_coordinates"
          active_release=${release_lines[0]:-}
          releases_root=${release_lines[1]:-}
          active_release_id=${active_release##*/}
          if [[ -z "$active_release" || -z "$releases_root"
            || "${active_release%/*}" != "$releases_root"
            || ! "$active_release_id" =~ ^${tested_sha}-[0-9]+(-[0-9]+)?$ ]]; then
            echo "Production current does not resolve to the exact tested release" >&2
            exit 1
          fi
          active_release_sha=${active_release_id%%-*}
          if [[ "$active_release_sha" != "$tested_sha" ]]; then
            echo "Production active release SHA does not equal tested_sha" >&2
            exit 1
          fi

          report_update="$artifact_dir/journey.active-release.json"
          jq --arg activeReleaseSha "$active_release_sha" \
            '.activeReleaseSha = $activeReleaseSha' "$report" > "$report_update"
          mv "$report_update" "$report"

          credentials=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          env_file="$1/current/.env"
          read_value() {
            local value
            value=$(sed -n "s/^$1=//p" "$env_file" | head -n 1)
            value=${value#\"}; value=${value%\"}; value=${value#\'}; value=${value%\'}
            printf '%s' "$value"
          }
          printf '%s\n%s' \
            "$(read_value RULEPILOT_USER_USERNAME)" \
            "$(read_value RULEPILOT_USER_PASSWORD)"
          REMOTE
          )
          mapfile -t credential_lines <<< "$credentials"
          player_username=${credential_lines[0]:-}
          player_password=${credential_lines[1]:-}
          test -n "$player_username"
          test -n "$player_password"
          echo "::add-mask::$player_username"
          echo "::add-mask::$player_password"

          set +e
          RULEPILOT_PRODUCTION_RECOMMENDATION_JOURNEY=true \
          RULEPILOT_PRODUCTION_BASE_URL="$RULEPILOT_PUBLIC_URL" \
          RULEPILOT_RECOMMENDATION_USER="$player_username" \
          RULEPILOT_RECOMMENDATION_PASSWORD="$player_password" \
          RULEPILOT_RECOMMENDATION_ACTIVE_RELEASE_SHA="$active_release_sha" \
          RULEPILOT_RECOMMENDATION_REPORT="$report" \
            npm --prefix frontend exec -- playwright test \
              --config frontend/playwright.recommendation-production.config.ts
          journey_status=$?
          set -e
          chmod -R go-rwx "$artifact_dir"
          exit "$journey_status"

      - name: Upload sanitized journey report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-recommendation-journey-${{ github.run_id }}
          path: .artifacts/production-recommendation-journey/journey.json
          if-no-files-found: error
          retention-days: 14
