name: Production recommendation journey

on:
  workflow_dispatch:
    inputs:
      opening_prompt:
        description: Natural opening from a player who does not know what to play yet
        required: true
        type: string
        default: '这周末想和朋友开一局，但我完全不知道该玩什么。你会先问我什么，帮我一起缩小范围？'
      selection_prompt:
        description: Natural refinement that asks the Agent to select a ranked recommendation slate
        required: true
        type: string
        default: '想清楚了：我们三个人，想玩两小时左右的德式重策，最好是 DBG 为主。请直接给我三款，把你最推荐的一款放第一；选好后我们还想找规则书、听讲解。'
      expected_mechanic:
        description: Canonical BGG mechanic that every selected card must satisfy for this evaluation input
        required: true
        type: string
        default: 'Deck, Bag, and Pool Building'
      rule_question:
        description: Question asked after the cited lesson becomes readable
        required: true
        type: string
        default: '我们现在要开第一局：所有组件分别怎么摆、每个人先拿什么？请按顺序说，并标出规则书页码。'
      rule_follow_up:
        description: Natural follow-up that must reuse the same document-bound answer session
        required: true
        type: string
        default: '你刚才列出的第二个准备步骤具体需要哪些组件？仍然只根据同一本规则书回答并标页码。'
      require_fresh_import:
        description: Fail if production reuses an existing imported rulebook
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: production-runtime
  cancel-in-progress: false

jobs:
  journey:
    name: Unknown-target recommendation, rulebook, teaching, and cited Q&A
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      RULEPILOT_PUBLIC_URL: https://rulepilot.cn
      RULEPILOT_RECOMMENDATION_OPENING_PROMPT: ${{ inputs.opening_prompt }}
      RULEPILOT_RECOMMENDATION_SELECTION_PROMPT: ${{ inputs.selection_prompt }}
      RULEPILOT_RECOMMENDATION_EXPECTED_MECHANIC: ${{ inputs.expected_mechanic }}
      RULEPILOT_RECOMMENDATION_RULE_QUESTION: ${{ inputs.rule_question }}
      RULEPILOT_RECOMMENDATION_RULE_FOLLOW_UP: ${{ inputs.rule_follow_up }}
      RULEPILOT_RECOMMENDATION_REQUIRE_FRESH_IMPORT: ${{ inputs.require_fresh_import }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install production browser probe
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure production SSH trust
        shell: bash
        run: |
          set -Eeuo pipefail
          for required_secret in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY DEPLOY_USER; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required production deployment secret: ${required_secret}" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Exercise the complete public recommendation journey
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/rulepilot-private-journey-${GITHUB_RUN_ID}"
          mkdir -p "$private_dir"
          chmod 700 "$private_dir"
          printf '{"completed":false,"stage":"preflight"}\n' > "$private_dir/journey.json"
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -p "$DEPLOY_SSH_PORT"
          )

          expected_sha=$(git rev-parse HEAD)
          active_release=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          readlink -f "$1/current"
          REMOTE
          )
          case "${active_release##*/}" in
            "$expected_sha"-*) ;;
            *) echo "Production is not running the checked-out main commit" >&2; exit 1 ;;
          esac

          credentials=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          env_file="$1/current/.env"
          read_value() {
            local value
            value=$(sed -n "s/^$1=//p" "$env_file" | head -n 1)
            value=${value#\"}; value=${value%\"}; value=${value#\'}; value=${value%\'}
            printf '%s' "$value"
          }
          printf '%s\n%s' \
            "$(read_value RULEPILOT_USER_USERNAME)" \
            "$(read_value RULEPILOT_USER_PASSWORD)"
          REMOTE
          )
          mapfile -t credential_lines <<< "$credentials"
          player_username=${credential_lines[0]:-}
          player_password=${credential_lines[1]:-}
          test -n "$player_username"
          test -n "$player_password"
          echo "::add-mask::$player_username"
          echo "::add-mask::$player_password"

          trace_export="$RUNNER_TEMP/rulepilot-agent-trace-${GITHUB_RUN_ID}.zip"
          trap 'rm -f "$trace_export"' EXIT

          RULEPILOT_PRODUCTION_RECOMMENDATION_JOURNEY=true \
          RULEPILOT_PRODUCTION_BASE_URL="$RULEPILOT_PUBLIC_URL" \
          RULEPILOT_RECOMMENDATION_USER="$player_username" \
          RULEPILOT_RECOMMENDATION_PASSWORD="$player_password" \
          RULEPILOT_RECOMMENDATION_REPORT="$private_dir/journey.json" \
          RULEPILOT_AGENT_TRACE_EXPORT="$trace_export" \
          RULEPILOT_PRODUCTION_PLAYWRIGHT_OUTPUT_DIR="$private_dir/playwright-test-results" \
            npm --prefix frontend exec -- playwright test \
              --config frontend/playwright.recommendation-production.config.ts \
              > "$private_dir/browser-probe.log" 2>&1
          test -s "$trace_export"
          unzip -p "$trace_export" manifest.json | jq -e '
            .complete == true
            and .state == "SEALED"
            and .sensitive == true
            and (.eventCount > 0)
            and (.stages | (
              index("IMPORT") != null
              and index("RECOMMENDATION") != null
              and index("TEACHING") != null
              and index("ANSWER") != null
            ))
          ' >/dev/null
          unzip -p "$trace_export" events.ndjson | jq -s -e '
            ([.[] | select(.event.kind == "MODEL_TURN") | .event.context.stage] | unique) as $stages
            | ([.[] | select(
                .event.kind == "BINDING_OR_FAILURE"
                and .event.context.stage == "IMPORT"
                and .event.signal == "REPLAY"
                and .event.code == "RULEBOOK_DISCOVERY_CACHE_REUSED"
              )] | length > 0) as $importReplay
            | all(["RECOMMENDATION", "TEACHING", "ANSWER"][];
                . as $stage | $stages | index($stage) != null)
              and (($stages | index("IMPORT") != null) or $importReplay)
          ' >/dev/null
          chmod -R go-rwx "$private_dir"

      - name: Create non-sensitive journey measurements
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          private_report="$RUNNER_TEMP/rulepilot-private-journey-${GITHUB_RUN_ID}/journey.json"
          public_dir="$GITHUB_WORKSPACE/.artifacts/production-recommendation-journey"
          mkdir -p "$public_dir"
          if [[ -s "$private_report" ]]; then
            jq -e '{
              schemaVersion: 1,
              generatedAt,
              completed,
              journeyReachedEnd,
              stage,
              failedChecks: (.failedChecks // [] | map(select(type == "string"))),
              trace: {
                started: .privateAgentTraceStarted,
                state: .privateAgentTraceState,
                integrity: .privateAgentTraceIntegrity,
                incompleteReason: .privateAgentTraceIncompleteReason,
                eventCount: .privateAgentTraceEventCount,
                storedBytes: .privateAgentTraceStoredBytes,
                exported: .privateAgentTraceExported,
                deletedAfterExport: .privateAgentTraceDeletedAfterExport
              },
              latencyMs: {
                opening: .openGuidanceMs,
                recommendation: .recommendationMs,
                discovery: .discoveryMs,
                import: .importMs,
                firstCitedLesson: .firstCitedLessonMs,
                completeLesson: .lessonCompletionMs,
                firstAnswer: .answerMs,
                followUpAnswer: .followUpAnswerMs
              },
              recommendation: {
                terminalObserved: .recommendationTerminalObserved,
                requestCount: .recommendationSelectionRequestCount,
                sloMet: .recommendationSloMet,
                exactCardinalityWithinSlo: .recommendationExactCardinalityWithinSlo,
                contractMet: .recommendationContractMet,
                resultUsable: .recommendationResultUsable,
                hardMechanicFitVerified: .recommendationHardMechanicFitVerified,
                structuredCardCount: .recommendationStructuredCardCount,
                renderedCardCount: .recommendationCardCount
              },
              import: {
                requestCount: .importRequestCount,
                reused: .importReused,
                duplicate: .importDuplicate,
                editionIdentityPreserved: (
                  .candidateEditionMatchesSelection
                  and .importEditionMatchesSelection
                  and .documentEditionMatchesSelection
                )
              },
              teaching: {
                documentProgressComplete: .documentProgressComplete,
                publishedSectionCount: .teachingPublishedSectionCount,
                lessonSectionCount: .lessonSectionCount,
                citedDraftSectionCount: .citedDraftSectionCount,
                insufficientSectionCount: .insufficientSectionCount,
                citedLessonStep: .citedLessonStep
              },
              answers: {
                firstStatus: .answerStatus,
                firstCitationCount: .answerCitationCount,
                followUpStatus: .followUpAnswerStatus,
                followUpCitationCount: .followUpCitationCount,
                sessionPreserved: .answerSessionPreserved
              },
              ui: {
                routeStayedOnDiscover: .routeStayedOnDiscover,
                detailsDialogOpenedAndClosed: .detailsDialogOpenedAndClosed,
                recommendationRestored: .recommendationRestored,
                answerRestored: .answerRestored,
                pageErrorCount: .pageErrorCount
              }
            }' "$private_report" > "$public_dir/summary.json"
          else
            printf '%s\n' \
              '{"schemaVersion":1,"completed":false,"journeyReachedEnd":false,"stage":"workflow-failed-before-report","failedChecks":["REPORT_UNAVAILABLE"]}' \
              > "$public_dir/summary.json"
          fi
          chmod 600 "$public_dir/summary.json"

      - name: Upload non-sensitive journey measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-recommendation-journey-${{ github.run_id }}
          path: .artifacts/production-recommendation-journey/summary.json
          if-no-files-found: error
          retention-days: 3

      - name: Delete private journey evidence from the runner
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- "$RUNNER_TEMP/rulepilot-private-journey-${GITHUB_RUN_ID}"
          rm -rf -- "$GITHUB_WORKSPACE/.artifacts/production-recommendation-journey"
          rm -rf -- "$GITHUB_WORKSPACE/frontend/test-results"
          rm -rf -- "$GITHUB_WORKSPACE/frontend/playwright-report"
          rm -f -- "$HOME/.ssh/id_ed25519"
