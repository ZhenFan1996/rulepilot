name: Production recommendation journey

on:
  workflow_dispatch:
    inputs:
      opening_prompt:
        description: Natural opening from a player who does not know what to play yet
        required: true
        type: string
        default: '嗨，今晚五个人聚会，最近合作玩得有点腻，但我还没想清楚换什么方向。你会先怎么帮我挑？'
      selection_prompt:
        description: Natural refinement that asks the Agent to select a ranked recommendation slate
        required: true
        type: string
        default: '我想换成能谈判、互相骗一骗的；有两个新手，90 分钟内。你直接挑三款，并把你最推荐的一款放第一吧。我们选好后还想接着找规则书、听讲解。'
      rule_question:
        description: Question asked after the cited lesson becomes readable
        required: true
        type: string
        default: '我们现在要开第一局：所有组件分别怎么摆、每个人先拿什么？请按顺序说，并标出规则书页码。'
      rule_follow_up:
        description: Natural follow-up that must reuse the same document-bound answer session
        required: true
        type: string
        default: '你刚才列出的第二个准备步骤具体需要哪些组件？仍然只根据同一本规则书回答并标页码。'
      require_fresh_import:
        description: Fail if production reuses an existing imported rulebook
        required: true
        type: boolean
        default: false
      recommendation_only:
        description: Stop after validating the persisted recommendation result; do not select a game or start rulebook work
        required: true
        type: boolean
        default: false
      expected_title_term:
        description: Optional case-insensitive title term that every recommendation-only card must match
        required: true
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: production-runtime
  cancel-in-progress: false

jobs:
  journey:
    name: Unknown-target recommendation, rulebook, teaching, and cited Q&A
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      RULEPILOT_PUBLIC_URL: https://rulepilot.cn
      RULEPILOT_RECOMMENDATION_OPENING_PROMPT: ${{ inputs.opening_prompt }}
      RULEPILOT_RECOMMENDATION_SELECTION_PROMPT: ${{ inputs.selection_prompt }}
      RULEPILOT_RECOMMENDATION_RULE_QUESTION: ${{ inputs.rule_question }}
      RULEPILOT_RECOMMENDATION_RULE_FOLLOW_UP: ${{ inputs.rule_follow_up }}
      RULEPILOT_RECOMMENDATION_REQUIRE_FRESH_IMPORT: ${{ inputs.require_fresh_import }}
      RULEPILOT_RECOMMENDATION_ONLY: ${{ inputs.recommendation_only }}
      RULEPILOT_RECOMMENDATION_EXPECTED_TITLE_TERM: ${{ inputs.expected_title_term }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install production browser probe
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure production SSH trust
        shell: bash
        run: |
          set -Eeuo pipefail
          for required_secret in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY DEPLOY_USER; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required production deployment secret: ${required_secret}" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Exercise the complete public recommendation journey
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          artifact_dir="$GITHUB_WORKSPACE/.artifacts/production-recommendation-journey"
          mkdir -p "$artifact_dir"
          chmod 700 "$artifact_dir"
          printf '{"completed":false,"stage":"preflight"}\n' > "$artifact_dir/journey.json"
          if [[ "$RULEPILOT_RECOMMENDATION_ONLY" == true
            && -z "${RULEPILOT_RECOMMENDATION_EXPECTED_TITLE_TERM//[[:space:]]/}" ]]; then
            echo "recommendation_only requires a non-empty expected_title_term" >&2
            exit 1
          fi
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -p "$DEPLOY_SSH_PORT"
          )

          expected_sha=$(git rev-parse HEAD)
          active_release=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          readlink -f "$1/current"
          REMOTE
          )
          case "${active_release##*/}" in
            "$expected_sha"-*) ;;
            *) echo "Production is not running the checked-out main commit" >&2; exit 1 ;;
          esac

          credentials=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          env_file="$1/current/.env"
          read_value() {
            local value
            value=$(sed -n "s/^$1=//p" "$env_file" | head -n 1)
            value=${value#\"}; value=${value%\"}; value=${value#\'}; value=${value%\'}
            printf '%s' "$value"
          }
          printf '%s\n%s' \
            "$(read_value RULEPILOT_USER_USERNAME)" \
            "$(read_value RULEPILOT_USER_PASSWORD)"
          REMOTE
          )
          mapfile -t credential_lines <<< "$credentials"
          player_username=${credential_lines[0]:-}
          player_password=${credential_lines[1]:-}
          test -n "$player_username"
          test -n "$player_password"
          echo "::add-mask::$player_username"
          echo "::add-mask::$player_password"

          RULEPILOT_PRODUCTION_RECOMMENDATION_JOURNEY=true \
          RULEPILOT_PRODUCTION_BASE_URL="$RULEPILOT_PUBLIC_URL" \
          RULEPILOT_RECOMMENDATION_USER="$player_username" \
          RULEPILOT_RECOMMENDATION_PASSWORD="$player_password" \
          RULEPILOT_RECOMMENDATION_REPORT="$artifact_dir/journey.json" \
            npm --prefix frontend exec -- playwright test \
              --config frontend/playwright.recommendation-production.config.ts
          chmod -R go-rwx "$artifact_dir"

      - name: Build public-safe journey summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="$GITHUB_WORKSPACE/.artifacts/production-recommendation-journey"
          jq '{
            generatedAt,
            completed,
            stage,
            recommendationOnly,
            recommendationHarnessSafetyCategory,
            selectedBggId,
            selectedGameName,
            routeStayedOnDiscover,
            recommendationMs,
            recommendationElapsedBasis,
            recommendationOutcome,
            recommendationTerminalCategory,
            recommendationCardCount,
            expectedRecommendationTitleTerm,
            recommendationPublishedGames,
            recommendationCompletedWork,
            recommendationModelCalls,
            recommendationCatalogCalls,
            recommendationWebResearchCalls,
            recommendationPublicationRecovered,
            recommendationFailureBoundary,
            rawModelOutputCaptured,
            importRequestCount,
            sourceDomain,
            sourceMode,
            sourceLanguage,
            sourceLanguageVerified,
            sourceOfficialDomainVerified,
            confirmedMilestonesFinal,
            lessonStatus,
            lessonSectionCount,
            citedLessonStep,
            answerStatus,
            answerCitationCount,
            citedAnswer,
            followUpAnswerStatus,
            followUpCitationCount,
            answerSessionPreserved,
            recommendationRestored,
            answerRestored,
            pageErrorCount
          }' "$artifact_dir/journey.json" > "$artifact_dir/public-summary.json"
          chmod 600 "$artifact_dir/public-summary.json"

      - name: Upload sanitized journey measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-recommendation-journey-${{ github.run_id }}
          path: .artifacts/production-recommendation-journey/public-summary.json
          if-no-files-found: error
          retention-days: 14
