                      $raw.handoffTerminalCategory == "RESTORED_EXISTING"
                        and $raw.handoffRestoredImportJobId != null
                    else
                      $raw.handoffTerminalCategory != "RESTORED_EXISTING"
                        and $raw.handoffRestoredImportJobId == null
                        and $raw.handoffRestoredDocumentVersionId == null
                        and $raw.handoffRestoredPreparationRunId == null
                        and $raw.handoffFreshnessRequestPreparationRunMatched == null
                        and $raw.handoffFreshnessResponseStatus == null
                        and $raw.handoffFreshnessResponseIdentityMatched == null
                        and $raw.handoffFreshnessResponseEligible == null
                    end)
                  and (($raw.handoffOfficialMutationAttemptedPaths | type) == "array"
                    and ($raw.handoffOfficialMutationAttemptedPaths | length) <= 16
                    and all($raw.handoffOfficialMutationAttemptedPaths[]; is_safe_official_mutation_path))
                  and ($raw.handoffOfficialMutationBlocked | is_boolean)
                  and ($raw.handoffStoppedAtDiscoveryBoundary | is_boolean)
                  and $raw.rawModelOutputCaptured == false
                  and (($raw.completed | not) or completed_recommendation_acceptance($raw)))
                then {
                  reportSchemaVersion: 1,
                  generatedAt: $raw.generatedAt,
                  completed: $raw.completed,
                  stage: $raw.stage,
                  testedSha: $testedSha,
                  activeReleaseSha: $testedSha,
                  activeReleaseId: $activeReleaseId,
                  publicReleaseId: $raw.publicReleaseId,
                  publicReleaseSha: $raw.publicReleaseSha,
                  publicReleaseNoStore: $raw.publicReleaseNoStore,
                  routeStayedOnDiscover: $raw.routeStayedOnDiscover,
                  recommendationRequestedCardCount: $requestedCardCount,
                  recommendationExpectedPlayerCount: $expectedPlayerCount,
                  recommendationMaximumDurationMinutes: $maximumDurationMinutes,
                  recommendationMaximumComplexity: $maximumComplexity,
                  recommendationExpectedGameType: $expectedGameType,
                  recommendationRequestMessageMatched: $raw.recommendationRequestMessageMatched,
                  recommendationProfileHardConstraintsMatched: $raw.recommendationProfileHardConstraintsMatched,
                  recommendationCardsHardConstraintsMatched: $raw.recommendationCardsHardConstraintsMatched,
                  recommendationFitClaimsHardConstraintsMatched: $raw.recommendationFitClaimsHardConstraintsMatched,
                  recommendationComplexityHardConstraintsMatched: $raw.recommendationComplexityHardConstraintsMatched,
                  recommendationGameTypeHardConstraintsMatched: $raw.recommendationGameTypeHardConstraintsMatched,
                  recommendationEvidenceBoundReplyParts: $raw.recommendationEvidenceBoundReplyParts,
                  recommendationPersistedCardCount: $raw.recommendationPersistedCardCount,
                  recommendationShortfallCount: $raw.recommendationShortfallCount,
                  recommendationOutcome: $raw.recommendationOutcome,
                  recommendationTerminalCategory: $raw.recommendationTerminalCategory,
                  recommendationTerminalObserved: $raw.recommendationTerminalObserved,
                  recommendationClickCaptured: $raw.recommendationClickCaptured,
                  recommendationFirstProgressMs: $raw.recommendationFirstProgressMs,
                  recommendationSseTerminalCategory: $raw.recommendationSseTerminalCategory,
                  recommendationSseTerminalMs: $raw.recommendationSseTerminalMs,
                  recommendationSseResultMs: $raw.recommendationSseResultMs,
                  recommendationSseErrorCode: $raw.recommendationSseErrorCode,
                  recommendationSseFailureBoundary: $raw.recommendationSseFailureBoundary,
                  recommendationSseFailureReason: $raw.recommendationSseFailureReason,
                  recommendationPersistedTerminalMs: $raw.recommendationPersistedTerminalMs,
                  recommendationRenderedSlateMs: $raw.recommendationRenderedSlateMs,
                  recommendationElapsedMs: $raw.recommendationElapsedMs,
                  recommendationSloMet: $raw.recommendationSloMet,
                  recommendationObservationWindowMs: $raw.recommendationObservationWindowMs,
                  recommendationCanaryFailureClass: $raw.recommendationCanaryFailureClass,
                  recommendationLastSessionProcessing: $raw.recommendationLastSessionProcessing,
                  recommendationProgressEventCount: ($raw.recommendationProgressEvents | length),
                  recommendationLastProgressStage: $raw.recommendationLastProgressStage,
                  recommendationLastProgressPhase: $raw.recommendationLastProgressPhase,
                  recommendationLastProgressAction: $raw.recommendationLastProgressAction,
                  recommendationLastProgressServerElapsedMs: $raw.recommendationLastProgressServerElapsedMs,
                  recommendationLastProgressBrowserReceivedMs:
                    $raw.recommendationLastProgressBrowserReceivedMs,
                  recommendationStreamProbeFailed: $raw.recommendationStreamProbeFailed,
                  recommendationPublishedBggIds: $raw.recommendationPublishedBggIds,
                  recommendationAssistantReplyCharacterCount: $raw.recommendationAssistantReplyCharacterCount,
                  recommendationRenderedReplyCharacterCount: $raw.recommendationRenderedReplyCharacterCount,
                  recommendationCardReplyPartCount: $raw.recommendationCardReplyPartCount,
                  recommendationUsableCardCount: $raw.recommendationUsableCardCount,
                  recommendationUsableReplyPartCount: $raw.recommendationUsableReplyPartCount,
                  recommendationAssistantReplyUsable: $raw.recommendationAssistantReplyUsable,
                  recommendationAllCardsUsable: $raw.recommendationAllCardsUsable,
                  recommendationAllReplyPartsUsable: $raw.recommendationAllReplyPartsUsable,
                  recommendationSseContentDigest: $raw.recommendationSseContentDigest,
                  recommendationPersistedContentDigest: $raw.recommendationPersistedContentDigest,
                  recommendationRenderedContentDigest: $raw.recommendationRenderedContentDigest,
                  recommendationSsePersistedContentConsistent: $raw.recommendationSsePersistedContentConsistent,
                  recommendationPersistedDomContentConsistent: $raw.recommendationPersistedDomContentConsistent,
                  recommendationCompletedWorkCount: ($raw.recommendationCompletedWork | length),
                  recommendationExpectedModel: {provider: $expectedProvider, model: $expectedModel},
                  recommendationModelBeforeRequest: (if $raw.recommendationModelBeforeRequest == null then null
                    else {provider: $expectedProvider, model: $expectedModel} end),
                  recommendationModelAfterRequest: (if $raw.recommendationModelAfterRequest == null then null
                    else {provider: $expectedProvider, model: $expectedModel} end),
                  recommendationModelProvider: (if $raw.recommendationModelProvider == null then null
                    else $expectedProvider end),
                  recommendationModelName: (if $raw.recommendationModelName == null then null else $expectedModel end),
                  recommendationModelCalls: $raw.recommendationModelCalls,
                  recommendationModelCallElapsedMs: $raw.recommendationModelCallElapsedMs,
                  recommendationAgentElapsedMs: $raw.recommendationAgentElapsedMs,
                  recommendationModelElapsedShare: $raw.recommendationModelElapsedShare,
                  recommendationCatalogCalls: $raw.recommendationCatalogCalls,
                  recommendationWebResearchCalls: $raw.recommendationWebResearchCalls,
                  recommendationFailureBoundary: $raw.recommendationFailureBoundary,
                  recommendationFailureReason: $raw.recommendationFailureReason,
                  expectedRecommendationTitleTermSha256: $expectedTitleTermSha256,
                  handoffSelectedBggId: $raw.handoffSelectedBggId,
                  handoffActionClicked: $raw.handoffActionClicked,
                  handoffSurfaceVisible: $raw.handoffSurfaceVisible,
                  handoffImportRequestedBggId: $raw.handoffImportRequestedBggId,
                  handoffImportResponseStatus: $raw.handoffImportResponseStatus,
                  handoffImportResponseOk: $raw.handoffImportResponseOk,
                  handoffImportResponseBggId: $raw.handoffImportResponseBggId,
                  handoffImportedGameId: $raw.handoffImportedGameId,
                  handoffImportedEditionId: $raw.handoffImportedEditionId,
                  handoffEditionBelongsToImportedGame: $raw.handoffEditionBelongsToImportedGame,
                  handoffImportElapsedMs: $raw.handoffImportElapsedMs,
                  handoffDiscoveryRequestedEditionId: $raw.handoffDiscoveryRequestedEditionId,
                  handoffDiscoveryResponseStatus: $raw.handoffDiscoveryResponseStatus,
                  handoffDiscoveryResponseOk: $raw.handoffDiscoveryResponseOk,
                  handoffDiscoveryIdentityEditionId: $raw.handoffDiscoveryIdentityEditionId,
                  handoffDiscoveryIdentityMatched: $raw.handoffDiscoveryIdentityMatched,
                  handoffDiscoveryConfigured: $raw.handoffDiscoveryConfigured,
                  handoffDiscoveryCandidateCount: $raw.handoffDiscoveryCandidateCount,
                  handoffImportableCandidateCount: $raw.handoffImportableCandidateCount,
                  handoffImportableCandidateFound: $raw.handoffImportableCandidateFound,
                  handoffDiscoveryCandidateIdentitySha256: $raw.handoffDiscoveryCandidateIdentitySha256,
                  handoffRenderedCandidateIdentitySha256: $raw.handoffRenderedCandidateIdentitySha256,
                  handoffCandidateIdentityOrderConsistent: $raw.handoffCandidateIdentityOrderConsistent,
                  handoffDiscoveryElapsedMs: $raw.handoffDiscoveryElapsedMs,
                  handoffTerminalCategory: $raw.handoffTerminalCategory,
                  handoffTerminalVisible: $raw.handoffTerminalVisible,
                  handoffElapsedMs: $raw.handoffElapsedMs,
                  handoffRulebookImportStarted: $raw.handoffRulebookImportStarted,
                  handoffRestoredExistingJourney: $raw.handoffRestoredExistingJourney,
                  handoffRestoredImportJobId: $raw.handoffRestoredImportJobId,
                  handoffRestoredDocumentVersionId: $raw.handoffRestoredDocumentVersionId,
                  handoffRestoredPreparationRunId: $raw.handoffRestoredPreparationRunId,
                  handoffFreshnessRequestPreparationRunMatched:
                    $raw.handoffFreshnessRequestPreparationRunMatched,
                  handoffFreshnessResponseStatus: $raw.handoffFreshnessResponseStatus,
                  handoffFreshnessResponseIdentityMatched: $raw.handoffFreshnessResponseIdentityMatched,
                  handoffFreshnessResponseEligible: $raw.handoffFreshnessResponseEligible,
                  handoffOfficialMutationAttemptCount: ($raw.handoffOfficialMutationAttemptedPaths | length),
                  handoffOfficialMutationBlocked: $raw.handoffOfficialMutationBlocked,
                  handoffStoppedAtDiscoveryBoundary: $raw.handoffStoppedAtDiscoveryBoundary,
                  rawModelOutputCaptured: false
                }
                else error("invalid production recommendation report")
                end
              end
          ' "$raw_report" > "$temporary_report"
          chmod 600 "$temporary_report"
          mv "$temporary_report" "$sanitized_report"
          rm -f "$raw_report"
          test -f "$sanitized_report" && test ! -L "$sanitized_report"
          [[ "$(find "$artifact_dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" == 1 ]]
          chmod -R go-rwx "$artifact_dir"
          sanitization_complete=true
          trap - EXIT

      - name: Upload sanitized journey report
        if: always() && steps.cleanup_credentials.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: production-recommendation-journey-${{ github.run_id }}
          path: ${{ runner.temp }}/production-recommendation-journey/journey.json
          if-no-files-found: error
          retention-days: 14

      - name: Require a completed production recommendation journey
        if: always() && steps.cleanup_credentials.outcome == 'success'
        shell: /bin/bash --noprofile --norc -p {0}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          GITHUB_ENV: /dev/null
          GITHUB_PATH: /dev/null
          LD_PRELOAD: ''
          PATH: /usr/bin:/bin
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/production-recommendation-journey/journey.json"
          test -f "$report" && test ! -L "$report"
          jq --exit-status '
            .completed == true
              and .stage == "completed"
              and .recommendationOutcome == "recommendations"
              and .recommendationSloMet == true
              and (.handoffTerminalCategory == "RESTORED_EXISTING"
                or .handoffTerminalCategory == "REVIEW"
                or .handoffTerminalCategory == "UNAVAILABLE")
          ' "$report" > /dev/null
