name: Manage public lesson candidate

on:
  workflow_dispatch:
    inputs:
      plan_id:
        description: Public teaching plan UUID (use this or lesson title)
        required: false
        type: string
      lesson_title:
        description: Exact public rulebook title (use this or plan UUID)
        required: false
        type: string
      operation:
        description: Stage a candidate or apply the existing recommendation
        required: true
        default: stage
        type: choice
        options:
          - stage
          - apply

permissions:
  contents: read

concurrency:
  group: public-lesson-candidate-${{ inputs.plan_id || inputs.lesson_title }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Stage, compare, or select a public lesson
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure production SSH trust
        shell: bash
        run: |
          set -Eeuo pipefail
          for required_secret in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY DEPLOY_USER; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required production deployment secret: ${required_secret}" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Open an authenticated production tunnel and manage the candidate
        shell: bash
        env:
          PLAN_ID: ${{ inputs.plan_id }}
          LESSON_TITLE: ${{ inputs.lesson_title }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -Eeuo pipefail
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o ExitOnForwardFailure=yes
            -o StrictHostKeyChecking=yes
            -p "$DEPLOY_SSH_PORT"
          )

          expected_sha=$(git rev-parse HEAD)
          active_release=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          readlink -f "$1/current"
          REMOTE
          )
          case "${active_release##*/}" in
            "$expected_sha"-*) ;;
            *) echo "Production is not running the checked-out main commit" >&2; exit 1 ;;
          esac

          credentials=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          env_file="$1/current/.env"
          username=$(sed -n 's/^RULEPILOT_ADMIN_USERNAME=//p' "$env_file" | head -n 1)
          password=$(sed -n 's/^RULEPILOT_ADMIN_PASSWORD=//p' "$env_file" | head -n 1)
          username=${username#\"}; username=${username%\"}; username=${username#\'}; username=${username%\'}
          password=${password#\"}; password=${password%\"}; password=${password#\'}; password=${password%\'}
          test -n "$username"; test -n "$password"
          printf '%s\n%s' "$username" "$password"
          REMOTE
          )
          admin_username=${credentials%%$'\n'*}
          admin_password=${credentials#*$'\n'}
          echo "::add-mask::$admin_username"
          echo "::add-mask::$admin_password"

          ssh "${ssh_options[@]}" -N -L 18081:127.0.0.1:8080 "${DEPLOY_USER}@${DEPLOY_HOST}" &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent --output /dev/null http://127.0.0.1:18081/actuator/health && break
            [[ "$attempt" == 20 ]] && { echo "Production SSH tunnel did not become ready" >&2; exit 1; }
            sleep 1
          done

          lesson_selector=()
          if [[ -n "$PLAN_ID" && -z "$LESSON_TITLE" ]]; then
            lesson_selector=(--plan-id "$PLAN_ID")
          elif [[ -z "$PLAN_ID" && -n "$LESSON_TITLE" ]]; then
            lesson_selector=(--lesson-title "$LESSON_TITLE")
          else
            echo "Exactly one of plan_id or lesson_title is required" >&2
            exit 2
          fi

          RULEPILOT_ADMIN_USERNAME="$admin_username" RULEPILOT_ADMIN_PASSWORD="$admin_password" \
            bash scripts/manage-public-lesson-candidate.sh \
              --base-url http://127.0.0.1:18081 \
              "${lesson_selector[@]}" \
              --operation "$OPERATION"
