name: Production ordinary-user smoke

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: Upload a PDF or let production import an ordered image-gallery source
        required: true
        default: upload
        type: choice
        options:
          - upload
          - official_image_gallery
      rulebook_url:
        description: Optional HTTPS publisher PDF, or required canonical gallery URL in official_image_gallery mode
        required: false
        default: ''
        type: string
      rulebook_title:
        description: Exact source-grounded title when rulebook_url is supplied
        required: false
        default: ''
        type: string
      question:
        description: Source-grounded question when rulebook_url is supplied
        required: false
        default: ''
        type: string
      bgg_id:
        description: Positive BGG id required for official_image_gallery mode
        required: false
        default: ''
        type: string
      expected_page_count:
        description: Ordered page count required for official_image_gallery mode
        required: false
        default: ''
        type: string
      language:
        description: Answer and verified gallery language
        required: true
        default: en
        type: string
      rights_confirmed:
        description: Confirm that this production canary may download and process the supplied gallery
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-runtime
  cancel-in-progress: false

jobs:
  smoke:
    name: Import, teach, verify, and clean up
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      RULEBOOK_URL: ${{ inputs.rulebook_url }}
      RULEBOOK_TITLE: ${{ inputs.rulebook_title }}
      RULEBOOK_QUESTION: ${{ inputs.question }}
      RULEBOOK_SOURCE_MODE: ${{ inputs.source_mode }}
      RULEBOOK_BGG_ID: ${{ inputs.bgg_id }}
      RULEBOOK_EXPECTED_PAGE_COUNT: ${{ inputs.expected_page_count }}
      RULEBOOK_LANGUAGE: ${{ inputs.language }}
      RULEBOOK_RIGHTS_CONFIRMED: ${{ inputs.rights_confirmed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Configure production SSH trust
        shell: bash
        run: |
          set -Eeuo pipefail
          for required_secret in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY DEPLOY_USER; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required production deployment secret: ${required_secret}" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Prepare a unique smoke source
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$RULEBOOK_SOURCE_MODE" == official_image_gallery ]]; then
            [[ "$RULEBOOK_URL" == https://* ]] || { echo "rulebook_url must use HTTPS" >&2; exit 2; }
            [[ -n "$RULEBOOK_TITLE" && -n "$RULEBOOK_QUESTION" ]] || {
              echo "rulebook_title and question are required for an image gallery" >&2
              exit 2
            }
            [[ "$RULEBOOK_BGG_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "bgg_id must be a positive integer for an image gallery" >&2
              exit 2
            }
            [[ "$RULEBOOK_EXPECTED_PAGE_COUNT" =~ ^[1-9][0-9]*$ ]] \
              && (( RULEBOOK_EXPECTED_PAGE_COUNT <= 500 )) || {
                echo "expected_page_count must be between 1 and 500 for an image gallery" >&2
                exit 2
              }
            [[ -n "$RULEBOOK_LANGUAGE" ]] || { echo "language is required" >&2; exit 2; }
            [[ "$RULEBOOK_RIGHTS_CONFIRMED" == true ]] || {
              echo "rights_confirmed must be explicitly true for an image gallery" >&2
              exit 2
            }
            printf '%s\n' official_image_gallery > "$RUNNER_TEMP/preparation-mode"
            exit 0
          fi
          [[ "$RULEBOOK_SOURCE_MODE" == upload ]] || { echo "unknown source_mode" >&2; exit 2; }
          if [[ -z "$RULEBOOK_URL" ]]; then
            [[ -z "$RULEBOOK_TITLE" && -z "$RULEBOOK_QUESTION" ]] || {
              echo "rulebook_title and question require rulebook_url" >&2
              exit 2
            }
            cp examples/lantern-relay-rules.txt "$RUNNER_TEMP/lantern-relay-smoke.txt"
            printf '\nSMOKE RUN %s\n' "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/lantern-relay-smoke.txt"
            node scripts/generate-demo-pdf.mjs \
              "$RUNNER_TEMP/lantern-relay-smoke.txt" \
              "$RUNNER_TEMP/rulebook.pdf"
            printf '%s\n' text > "$RUNNER_TEMP/preparation-mode"
          else
            [[ "$RULEBOOK_URL" == https://* ]] || { echo "rulebook_url must use HTTPS" >&2; exit 2; }
            [[ -n "$RULEBOOK_TITLE" && -n "$RULEBOOK_QUESTION" ]] || {
              echo "rulebook_title and question are required for a publisher PDF" >&2
              exit 2
            }
            curl --proto '=https' --location --fail --silent --show-error --max-filesize 26214400 \
              "$RULEBOOK_URL" --output "$RUNNER_TEMP/rulebook.pdf"
            [[ "$(head -c 5 "$RUNNER_TEMP/rulebook.pdf")" == '%PDF-' ]] || {
              echo "Publisher response was not a PDF" >&2
              exit 1
            }
            printf '%s\n' visual > "$RUNNER_TEMP/preparation-mode"
          fi

      - name: Open an authenticated production tunnel and replay the journey
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o ExitOnForwardFailure=yes
            -o StrictHostKeyChecking=yes
            -p "$DEPLOY_SSH_PORT"
          )

          expected_sha=$(git rev-parse HEAD)
          active_release=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          readlink -f "$1/current"
          REMOTE
          )
          case "${active_release##*/}" in
            "$expected_sha"-*) ;;
            *)
              echo "Production is not running the checked-out main commit" >&2
              exit 1
              ;;
          esac

          player_password=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          env_file="$1/current/.env"
          value=$(sed -n 's/^RULEPILOT_USER_PASSWORD=//p' "$env_file" | head -n 1)
          value=${value#\"}
          value=${value%\"}
          value=${value#\'}
          value=${value%\'}
          test -n "$value"
          printf '%s' "$value"
          REMOTE
          )
          echo "::add-mask::$player_password"

          ssh "${ssh_options[@]}" -N -L 18080:127.0.0.1:8080 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18080/actuator/health; then
              break
            fi
            if [[ "$attempt" == 20 ]]; then
              echo "Production SSH tunnel did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          artifact_dir="$GITHUB_WORKSPACE/.artifacts/production-ordinary-user-smoke"
          mkdir -p "$artifact_dir"
          public_status="$artifact_dir/public-status.json"
          success_summary="$artifact_dir/success-summary.tmp"
          printf '%s\n' '{"outcome":"FAILED","exitCode":1,"lastCompletedStage":"not-started","failureCode":"UNEXPECTED_SMOKE_FAILURE","failureCauseCode":null,"cleanupOutcome":"NOT_REQUIRED"}' > "$public_status"
          chmod 600 "$public_status"
          smoke_args=(--base-url http://127.0.0.1:18080 --result-file "$artifact_dir/result.json")
          preparation_mode=$(<"$RUNNER_TEMP/preparation-mode")
          if [[ "$preparation_mode" == official_image_gallery ]]; then
            smoke_args+=(
              --source-mode official_image_gallery
              --expected-title "${RULEBOOK_TITLE,,}"
              --uploaded-title "$RULEBOOK_TITLE"
              --official-source-url "$RULEBOOK_URL"
              --bgg-id "$RULEBOOK_BGG_ID"
              --expected-page-count "$RULEBOOK_EXPECTED_PAGE_COUNT"
              --language "$RULEBOOK_LANGUAGE"
              --canary-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              --rights-confirmed
              --navigation-mode api
              --question "$RULEBOOK_QUESTION"
            )
          else
            smoke_args+=(--pdf "$RUNNER_TEMP/rulebook.pdf")
          fi
          if [[ "$preparation_mode" == visual ]]; then
            smoke_args+=(
              --expected-title "${RULEBOOK_TITLE,,}"
              --uploaded-title "$RULEBOOK_TITLE"
              --official-source-url "$RULEBOOK_URL"
              --preparation-mode visual
              --visual-expectation required
              --navigation-mode api
              --question "$RULEBOOK_QUESTION"
            )
          fi
          set +e
          RULEPILOT_SMOKE_PASSWORD="$player_password" \
            RULEPILOT_SMOKE_PUBLIC_STATUS_FILE="$public_status" \
            bash scripts/smoke-production-ordinary-user.sh "${smoke_args[@]}" \
              > "$success_summary" 2> "$artifact_dir/diagnostics.log"
          smoke_exit=$?
          set -e

          if ! bash scripts/smoke-production-ordinary-user.sh \
              --validate-public-status "$public_status" "$smoke_exit"; then
            if [[ "$smoke_exit" == 0 ]]; then smoke_exit=1; fi
            jq -n --argjson exitCode "$smoke_exit" '
              {outcome: "FAILED", exitCode: $exitCode, lastCompletedStage: "status-unavailable",
               failureCode: "UNEXPECTED_SMOKE_FAILURE", failureCauseCode: null, cleanupOutcome: "FAILED"}
            ' > "$public_status"
          fi

          if [[ "$smoke_exit" == 0 ]] && jq -e --slurpfile execution "$public_status" '
            select(type == "object")
            | select(
                (.title | type == "string" and length > 0)
                and (.preparationState | type == "string" and length > 0)
                and (.lessonState | type == "string" and length > 0)
                and (.lessonStatus | type == "string" and length > 0)
                and (.answerStatus | type == "string" and length > 0)
                and (.sectionCount | type == "number" and . >= 0)
                and (.answerCitationCount | type == "number" and . >= 0)
                and (.visualStepCount | type == "number" and . >= 0)
                and (.focusedVisualStepCount | type == "number" and . >= 0)
                and (.visualEnrichmentState | type == "string" and length > 0)
                and (.cleanup == "scheduled")
                and (.navigation | type == "object")
                and (.navigation | keys | sort == ["averageMs", "failureCount", "maxMs", "requestCount"])
                and (.navigation.requestCount | type == "number" and . >= 0)
                and (.navigation.failureCount == 0)
                and (.navigation.averageMs | type == "number" and . >= 0)
                and (.navigation.maxMs | type == "number" and . >= 0)
                and (if .sourceMode == "official_image_gallery" then
                  (.sourceUrl | type == "string" and length > 0)
                  and (.effectiveSourceUrl | type == "string" and length > 0)
                  and (.pageCount | type == "number" and . > 0)
                  and (.pageAttempts | type == "object" and .valid == true)
                else .sourceMode == null end)
              )
            | . as $source
            | {
                sourceMode: $source.sourceMode,
                title: $source.title,
                sourceUrl: $source.sourceUrl,
                effectiveSourceUrl: $source.effectiveSourceUrl,
                pageCount: $source.pageCount,
                pageAttempts: (if $source.pageAttempts == null then null else {
                  pages: [$source.pageAttempts.pages[]? | {
                    page, ocrOutcome, initialOutcome, recoveryKind, repairCode,
                    recoveryOutcome, semanticAttempts, finalOutcome
                  }],
                  ocrSucceeded: $source.pageAttempts.ocrSucceeded,
                  ocrFailed: $source.pageAttempts.ocrFailed,
                  ocrRejected: $source.pageAttempts.ocrRejected,
                  ocrRetryAttempted: $source.pageAttempts.ocrRetryAttempted,
                  initialSucceeded: $source.pageAttempts.initialSucceeded,
                  initialFailed: $source.pageAttempts.initialFailed,
                  initialRejected: $source.pageAttempts.initialRejected,
                  transientRetryAttempted: $source.pageAttempts.transientRetryAttempted,
                  transientRetrySucceeded: $source.pageAttempts.transientRetrySucceeded,
                  transientRetryFailed: $source.pageAttempts.transientRetryFailed,
                  repairAttempted: $source.pageAttempts.repairAttempted,
                  repairSucceeded: $source.pageAttempts.repairSucceeded,
                  repairFailed: $source.pageAttempts.repairFailed,
                  finalUnavailablePages: $source.pageAttempts.finalUnavailablePages,
                  maximumSemanticAttemptsForAnyPage: $source.pageAttempts.maximumSemanticAttemptsForAnyPage,
                  valid: $source.pageAttempts.valid
                } end),
                preparationState: $source.preparationState,
                lessonState: $source.lessonState,
                lessonStatus: $source.lessonStatus,
                answerStatus: $source.answerStatus,
                sectionCount: $source.sectionCount,
                answerCitationCount: $source.answerCitationCount,
                visualStepCount: $source.visualStepCount,
                focusedVisualStepCount: $source.focusedVisualStepCount,
                visualEnrichmentState: $source.visualEnrichmentState,
                navigation: {
                  requestCount: $source.navigation.requestCount,
                  failureCount: $source.navigation.failureCount,
                  averageMs: $source.navigation.averageMs,
                  maxMs: $source.navigation.maxMs
                },
                cleanup: $source.cleanup,
                execution: $execution[0]
              }
            | with_entries(select(.value != null))
          ' "$success_summary" > "$artifact_dir/summary.tmp"; then
            mv "$artifact_dir/summary.tmp" "$artifact_dir/summary.json"
          else
            if [[ "$smoke_exit" == 0 ]]; then
              smoke_exit=1
              jq '{outcome: "FAILED", exitCode: 1, lastCompletedStage: "summary-unavailable",
                   failureCode: "UNEXPECTED_SMOKE_FAILURE", failureCauseCode: null, cleanupOutcome}' "$public_status" \
                > "$artifact_dir/public-status.tmp"
              mv "$artifact_dir/public-status.tmp" "$public_status"
            fi
            cp "$public_status" "$artifact_dir/summary.json"
          fi
          chmod -R go-rwx "$artifact_dir"
          exit "$smoke_exit"

      - name: Upload sanitized journey output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-ordinary-user-smoke-${{ github.run_id }}
          path: .artifacts/production-ordinary-user-smoke/summary.json
          if-no-files-found: error
          retention-days: 1
