name: Production ordinary-user smoke

on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact 40-character main commit SHA already active in production
        required: true
        type: string
      source_mode:
        description: Upload a PDF or let production import an ordered image-gallery source
        required: true
        default: upload
        type: choice
        options:
          - upload
          - official_image_gallery
      rulebook_url:
        description: Optional HTTPS publisher PDF, or required canonical gallery URL in official_image_gallery mode
        required: false
        default: ''
        type: string
      rulebook_title:
        description: Exact source-grounded title when rulebook_url is supplied
        required: false
        default: ''
        type: string
      question:
        description: Source-grounded question when rulebook_url is supplied
        required: false
        default: ''
        type: string
      bgg_id:
        description: Positive BGG id required for official_image_gallery mode
        required: false
        default: ''
        type: string
      expected_page_count:
        description: Ordered page count required for official_image_gallery mode
        required: false
        default: ''
        type: string
      language:
        description: Answer and verified gallery language
        required: true
        default: en
        type: string
      rights_confirmed:
        description: Confirm that this production canary may download and process the supplied gallery
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-runtime
  queue: max
  cancel-in-progress: false

jobs:
  prepare_smoke:
    name: Prepare immutable ordinary-user probe without production authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RULEBOOK_URL: ${{ inputs.rulebook_url }}
      RULEBOOK_TITLE: ${{ inputs.rulebook_title }}
      RULEBOOK_QUESTION: ${{ inputs.question }}
      RULEBOOK_SOURCE_MODE: ${{ inputs.source_mode }}
      RULEBOOK_BGG_ID: ${{ inputs.bgg_id }}
      RULEBOOK_EXPECTED_PAGE_COUNT: ${{ inputs.expected_page_count }}
      RULEBOOK_LANGUAGE: ${{ inputs.language }}
      RULEBOOK_RIGHTS_CONFIRMED: ${{ inputs.rights_confirmed }}
      RULEPILOT_SMOKE_TESTED_SHA: ${{ inputs.tested_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and detach the exact tested main commit
        shell: bash
        run: |
          set -Eeuo pipefail
          tested_sha="$RULEPILOT_SMOKE_TESTED_SHA"
          [[ "$tested_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "tested_sha must be one exact lowercase 40-character commit SHA" >&2
            exit 2
          }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git cat-file -e "${tested_sha}^{commit}"
          git merge-base --is-ancestor "$tested_sha" origin/main
          git checkout --detach "$tested_sha"
          [[ "$(git rev-parse HEAD)" == "$tested_sha" ]]

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Prepare a unique smoke source
        shell: bash
        run: |
          set -Eeuo pipefail
          probe_dir="$RUNNER_TEMP/production-ordinary-user-probe"
          mkdir -p "$probe_dir"
          install -m 0755 scripts/smoke-production-ordinary-user.sh \
            "$probe_dir/smoke-production-ordinary-user.sh"
          install -m 0644 scripts/smoke-production-http.mjs \
            "$probe_dir/smoke-production-http.mjs"
          printf '%s\n' "$RULEPILOT_SMOKE_TESTED_SHA" > "$probe_dir/source-sha"
          if [[ "$RULEBOOK_SOURCE_MODE" == official_image_gallery ]]; then
            [[ "$RULEBOOK_URL" == https://* ]] || { echo "rulebook_url must use HTTPS" >&2; exit 2; }
            [[ -n "$RULEBOOK_TITLE" && -n "$RULEBOOK_QUESTION" ]] || {
              echo "rulebook_title and question are required for an image gallery" >&2
              exit 2
            }
            [[ "$RULEBOOK_BGG_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "bgg_id must be a positive integer for an image gallery" >&2
              exit 2
            }
            [[ "$RULEBOOK_EXPECTED_PAGE_COUNT" =~ ^[1-9][0-9]*$ ]] || {
              echo "expected_page_count must be a positive integer" >&2
              exit 2
            }
            [[ -n "$RULEBOOK_LANGUAGE" ]] || { echo "language is required" >&2; exit 2; }
            [[ "$RULEBOOK_RIGHTS_CONFIRMED" == true ]] || {
              echo "rights_confirmed must be explicitly true for an image gallery" >&2
              exit 2
            }
            printf '%s\n' official_image_gallery > "$probe_dir/preparation-mode"
            exit 0
          fi
          [[ "$RULEBOOK_SOURCE_MODE" == upload ]] || { echo "unknown source_mode" >&2; exit 2; }
          if [[ -z "$RULEBOOK_URL" ]]; then
            [[ -z "$RULEBOOK_TITLE" && -z "$RULEBOOK_QUESTION" ]] || {
              echo "rulebook_title and question require rulebook_url" >&2
              exit 2
            }
            cp examples/lantern-relay-rules.txt "$RUNNER_TEMP/lantern-relay-smoke.txt"
            printf '\nSMOKE RUN %s\n' "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/lantern-relay-smoke.txt"
            node scripts/generate-demo-pdf.mjs \
              "$RUNNER_TEMP/lantern-relay-smoke.txt" \
              "$probe_dir/rulebook.pdf"
            printf '%s\n' text > "$probe_dir/preparation-mode"
          else
            [[ "$RULEBOOK_URL" == https://* ]] || { echo "rulebook_url must use HTTPS" >&2; exit 2; }
            [[ -n "$RULEBOOK_TITLE" && -n "$RULEBOOK_QUESTION" ]] || {
              echo "rulebook_title and question are required for a publisher PDF" >&2
              exit 2
            }
            node "$probe_dir/smoke-production-http.mjs" \
              --proto '=https' --location --fail --silent --show-error --max-filesize 26214400 \
              "$RULEBOOK_URL" --output "$probe_dir/rulebook.pdf"
            [[ "$(head -c 5 "$probe_dir/rulebook.pdf")" == '%PDF-' ]] || {
              echo "Publisher response was not a PDF" >&2
              exit 1
            }
            printf '%s\n' visual > "$probe_dir/preparation-mode"
          fi

      - name: Seal the exact smoke probe
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="$RUNNER_TEMP/production-ordinary-user-probe-artifact"
          archive="production-ordinary-user-probe-${RULEPILOT_SMOKE_TESTED_SHA}.tar.gz"
          mkdir -p "$artifact_dir"
          tar -C "$RUNNER_TEMP/production-ordinary-user-probe" -czf "$artifact_dir/$archive" .
          (
            cd "$artifact_dir"
            sha256sum "$archive" > "${archive}.sha256"
            sha256sum --check "${archive}.sha256"
          )

      - name: Publish the sealed probe for an isolated production runner
        uses: actions/upload-artifact@v7
        with:
          name: production-ordinary-user-probe-${{ inputs.tested_sha }}
          path: ${{ runner.temp }}/production-ordinary-user-probe-artifact
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: Import, teach, verify, and clean up
    needs: prepare_smoke
    if: needs.prepare_smoke.result == 'success'
    runs-on: ubuntu-latest
    # The longest forward journey is 110 minutes; the remainder is reserved for
    # runner setup, bounded cancellation, document deletion, and artifact sealing.
    timeout-minutes: 135
    environment:
      name: production
    env:
      RULEPILOT_PUBLIC_URL: https://rulepilot.cn
      RULEPILOT_SMOKE_TESTED_SHA: ${{ inputs.tested_sha }}
      RULEBOOK_URL: ${{ inputs.rulebook_url }}
      RULEBOOK_TITLE: ${{ inputs.rulebook_title }}
      RULEBOOK_QUESTION: ${{ inputs.question }}
      RULEBOOK_SOURCE_MODE: ${{ inputs.source_mode }}
      RULEBOOK_BGG_ID: ${{ inputs.bgg_id }}
      RULEBOOK_EXPECTED_PAGE_COUNT: ${{ inputs.expected_page_count }}
      RULEBOOK_LANGUAGE: ${{ inputs.language }}
      RULEBOOK_RIGHTS_CONFIRMED: ${{ inputs.rights_confirmed }}
    steps:
      - name: Download the sealed probe on a fresh runner
        uses: actions/download-artifact@v8
        with:
          name: production-ordinary-user-probe-${{ inputs.tested_sha }}
          path: ${{ runner.temp }}/production-ordinary-user-probe-artifact

      - name: Verify and extract the exact smoke probe before production authority exists
        shell: bash
        run: |
          set -Eeuo pipefail
          tested_sha="$RULEPILOT_SMOKE_TESTED_SHA"
          artifact_dir="$RUNNER_TEMP/production-ordinary-user-probe-artifact"
          archive="production-ordinary-user-probe-${tested_sha}.tar.gz"
          probe_dir="$RUNNER_TEMP/production-ordinary-user-probe"
          [[ "$tested_sha" =~ ^[0-9a-f]{40}$ ]]
          test -f "$artifact_dir/$archive" && test ! -L "$artifact_dir/$archive"
          test -f "$artifact_dir/${archive}.sha256" && test ! -L "$artifact_dir/${archive}.sha256"
          [[ "$(find "$artifact_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" == 2 ]]
          (cd "$artifact_dir" && sha256sum --check "${archive}.sha256")
          mkdir -p "$probe_dir"
          tar -xzf "$artifact_dir/$archive" -C "$probe_dir"
          source_sha=$(<"$probe_dir/source-sha")
          [[ "$source_sha" == "$tested_sha" ]]
          test -x "$probe_dir/smoke-production-ordinary-user.sh"
          test -f "$probe_dir/smoke-production-http.mjs" \
            && test ! -L "$probe_dir/smoke-production-http.mjs"
          preparation_mode=$(<"$probe_dir/preparation-mode")
          if [[ "$preparation_mode" == official_image_gallery ]]; then
            [[ "$(find "$probe_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" == 4 ]]
          else
            [[ "$preparation_mode" == text || "$preparation_mode" == visual ]]
            test -f "$probe_dir/rulebook.pdf" && test ! -L "$probe_dir/rulebook.pdf"
            [[ "$(head -c 5 "$probe_dir/rulebook.pdf")" == '%PDF-' ]]
            [[ "$(find "$probe_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" == 5 ]]
          fi

      - name: Read exact active release and bounded player credentials
        id: production_identity
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          credential_file="$RUNNER_TEMP/rulepilot-ordinary-user-credentials"
          cleanup_authority() {
            rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          }
          trap cleanup_authority EXIT
          for required_secret in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY DEPLOY_USER; do
            [[ -n "${!required_secret}" ]] || {
              echo "Missing required production deployment secret: ${required_secret}" >&2
              exit 1
            }
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -p "$DEPLOY_SSH_PORT"
          )

          active_release_coordinates=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$(readlink -f "$1")
          if [[ -e "$application_root/deployment-guards/active-transaction" ]]; then
            echo "Production has an active deployment transaction" >&2
            exit 1
          fi
          readlink -f "$application_root/current"
          readlink -f "$application_root/releases"
          REMOTE
          )
          mapfile -t release_lines <<< "$active_release_coordinates"
          active_release=${release_lines[0]:-}
          releases_root=${release_lines[1]:-}
          active_release_id=${active_release##*/}
          tested_sha="$RULEPILOT_SMOKE_TESTED_SHA"
          if [[ -z "$active_release" || -z "$releases_root"
            || "${active_release%/*}" != "$releases_root"
            || ! "$active_release_id" =~ ^${tested_sha}-[0-9]+-[0-9]+$ ]]; then
            echo "Production current does not resolve to the exact tested release" >&2
            exit 1
          fi

          credentials=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          env_file="$1/current/.env"
          read_value() {
            local value
            value=$(sed -n "s/^$1=//p" "$env_file" | head -n 1)
            value=${value#\"}; value=${value%\"}; value=${value#\'}; value=${value%\'}
            printf '%s' "$value"
          }
          read_value RULEPILOT_USER_USERNAME | base64 -w0
          printf '\n'
          read_value RULEPILOT_USER_PASSWORD | base64 -w0
          printf '\n'
          REMOTE
          )
          mapfile -t credential_lines <<< "$credentials"
          player_username_b64=${credential_lines[0]:-}
          player_password_b64=${credential_lines[1]:-}
          player_username=$(printf '%s' "$player_username_b64" | base64 --decode)
          player_password=$(printf '%s' "$player_password_b64" | base64 --decode)
          test -n "$player_username"
          test -n "$player_password"
          echo "::add-mask::$player_username"
          echo "::add-mask::$player_password"
          echo "::add-mask::$player_username_b64"
          echo "::add-mask::$player_password_b64"
          umask 077
          printf '%s\n%s\n' "$player_username_b64" "$player_password_b64" > "$credential_file"
          printf 'active_release_id=%s\n' "$active_release_id" >> "$GITHUB_OUTPUT"
          unset player_username player_password player_username_b64 player_password_b64 credentials credential_lines
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          test ! -e "$HOME/.ssh/id_ed25519"
          test ! -e "$HOME/.ssh/known_hosts"

      - name: Replay the public ordinary-user journey with only player authority
        shell: bash
        env:
          RULEPILOT_SMOKE_ACTIVE_RELEASE_ID: ${{ steps.production_identity.outputs.active_release_id }}
        run: |
          set -Eeuo pipefail
          umask 077
          test ! -e "$HOME/.ssh/id_ed25519"
          test ! -e "$HOME/.ssh/known_hosts"
          credential_file="$RUNNER_TEMP/rulepilot-ordinary-user-credentials"
          probe_dir="$RUNNER_TEMP/production-ordinary-user-probe"
          http_client="$probe_dir/smoke-production-http.mjs"
          raw_dir="$RUNNER_TEMP/production-ordinary-user-smoke-raw"
          public_status="$raw_dir/public-status.raw.json"
          success_summary="$raw_dir/success-summary.raw.json"
          raw_result="$raw_dir/result.raw.json"
          raw_diagnostics="$raw_dir/diagnostics.raw.log"
          raw_exit="$raw_dir/exit-code.raw"
          navigation_file="$raw_dir/navigation.raw.tsv"
          runner_env_file="$GITHUB_ENV"
          runner_path_file="$GITHUB_PATH"
          case "$runner_env_file" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          case "$runner_path_file" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          rm -rf "$raw_dir"
          mkdir -p "$raw_dir"
          chmod 700 "$raw_dir"
          printf '%s\n' '{"outcome":"FAILED","exitCode":1,"lastCompletedStage":"not-started","failureCode":"UNEXPECTED_SMOKE_FAILURE","failureCauseCode":null,"cleanupOutcome":"NOT_REQUIRED","answerDiagnostic":null}' > "$public_status"
          printf '%s\n' 1 > "$raw_exit"
          : > "$raw_diagnostics"
          chmod 600 "$public_status" "$raw_exit" "$raw_diagnostics"
          node_binary=$(readlink -f "$(command -v node)")
          case "$node_binary" in
            /opt/hostedtoolcache/node/*/x64/bin/node|/usr/bin/node|/usr/local/bin/node) ;;
            *) echo "The production smoke requires the runner-owned Node runtime" >&2; exit 1 ;;
          esac
          test -x "$node_binary"
          test -f "$http_client" && test ! -L "$http_client"
          reset_runner_command_file() {
            local target=$1
            test -f "$target" && test ! -L "$target"
            /usr/bin/truncate -s 0 -- "$target"
            /usr/bin/chmod 600 -- "$target"
          }
          cleanup_authority() {
            /usr/bin/rm -f -- \
              "$credential_file" \
              "$HOME/.ssh/id_ed25519" \
              "$HOME/.ssh/known_hosts"
            reset_runner_command_file "$runner_env_file"
            reset_runner_command_file "$runner_path_file"
          }
          trap cleanup_authority EXIT
          reset_runner_command_file "$runner_env_file"
          reset_runner_command_file "$runner_path_file"
          test -f "$credential_file" && test ! -L "$credential_file"
          mapfile -t credential_lines < "$credential_file"
          player_username=$(printf '%s' "${credential_lines[0]:-}" | base64 --decode)
          player_password=$(printf '%s' "${credential_lines[1]:-}" | base64 --decode)
          test -n "$player_username"
          test -n "$player_password"
          echo "::add-mask::$player_username"
          echo "::add-mask::$player_password"
          rm -f "$credential_file"

          verify_public_release_once() {
            local release_headers release_snapshot
            release_headers=$(mktemp "$RUNNER_TEMP/rulepilot-smoke-release-headers.XXXXXX")
            if ! release_snapshot=$("$node_binary" "$http_client" \
                --proto '=https' --silent --show-error --fail --max-time 10 \
                --dump-header "$release_headers" \
                "$RULEPILOT_PUBLIC_URL/api/public/release"); then
              rm -f "$release_headers"
              return 10
            fi
            if ! jq -e \
                --arg tested_sha "$RULEPILOT_SMOKE_TESTED_SHA" \
                --arg active_release_id "$RULEPILOT_SMOKE_ACTIVE_RELEASE_ID" '
                .commitSha == $tested_sha and .releaseId == $active_release_id
              ' <<< "$release_snapshot" >/dev/null \
              || ! tr -d '\r' < "$release_headers" | grep -Eiq '^cache-control:.*no-store'; then
              rm -f "$release_headers"
              return 11
            fi
            rm -f "$release_headers"
          }
          verify_public_release() {
            local attempt verification_status=10
            for attempt in 1 2 3; do
              if verify_public_release_once; then
                return 0
              else
                verification_status=$?
              fi
              if (( verification_status == 11 )); then
                return 11
              fi
              if (( attempt < 3 )); then
                sleep 2
              fi
            done
            return "$verification_status"
          }
          public_release_status=0
          verify_public_release >> "$raw_diagnostics" 2>&1 || public_release_status=$?
          if (( public_release_status != 0 )); then
            if (( public_release_status == 11 )); then
              public_release_failure=PUBLIC_RELEASE_MISMATCH
            else
              public_release_failure=PUBLIC_RELEASE_UNAVAILABLE
            fi
            printf '{"outcome":"FAILED","exitCode":1,"lastCompletedStage":"not-started","failureCode":"%s","failureCauseCode":null,"cleanupOutcome":"NOT_REQUIRED","answerDiagnostic":null}\n' \
              "$public_release_failure" > "$public_status"
            unset player_username player_password credential_lines
            exit 1
          fi

          printf '%s\n' '{"outcome":"FAILED","exitCode":1,"lastCompletedStage":"not-started","failureCode":"UNEXPECTED_SMOKE_FAILURE","failureCauseCode":null,"cleanupOutcome":"NOT_REQUIRED","answerDiagnostic":null}' > "$public_status"
          chmod 600 "$public_status"
          smoke_args=(
            --base-url "$RULEPILOT_PUBLIC_URL"
            --username "$player_username"
            --http-client "$http_client"
            --navigation-file "$navigation_file"
            --result-file "$raw_result"
          )
          preparation_mode=$(<"$probe_dir/preparation-mode")
          if [[ "$preparation_mode" == official_image_gallery ]]; then
            smoke_args+=(
              --source-mode official_image_gallery
              --expected-title "${RULEBOOK_TITLE,,}"
              --uploaded-title "$RULEBOOK_TITLE"
              --official-source-url "$RULEBOOK_URL"
              --bgg-id "$RULEBOOK_BGG_ID"
              --expected-page-count "$RULEBOOK_EXPECTED_PAGE_COUNT"
              --timeout-seconds 6600
              --language "$RULEBOOK_LANGUAGE"
              --canary-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              --rights-confirmed
              --navigation-mode api
              --question "$RULEBOOK_QUESTION"
            )
          else
            smoke_args+=(--pdf "$probe_dir/rulebook.pdf")
          fi
          if [[ "$preparation_mode" == visual ]]; then
            smoke_args+=(
              --expected-title "${RULEBOOK_TITLE,,}"
              --uploaded-title "$RULEBOOK_TITLE"
              --official-source-url "$RULEBOOK_URL"
              --preparation-mode visual
              --visual-expectation required
              --navigation-mode api
              --question "$RULEBOOK_QUESTION"
            )
          fi
          set +e
          /usr/bin/env -i \
            HOME="$HOME" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            PATH=/usr/bin:/bin \
            RULEPILOT_SMOKE_NODE_BINARY="$node_binary" \
            RULEPILOT_SMOKE_PASSWORD="$player_password" \
            RULEPILOT_SMOKE_PUBLIC_STATUS_FILE="$public_status" \
            /bin/bash "$probe_dir/smoke-production-ordinary-user.sh" "${smoke_args[@]}" \
              > "$success_summary" 2> "$raw_diagnostics"
          smoke_exit=$?
          set -e
          unset player_username player_password credential_lines

          public_release_status=0
          verify_public_release >> "$raw_diagnostics" 2>&1 || public_release_status=$?
          if (( public_release_status != 0 )); then
            echo "The public release changed or became cacheable during the ordinary-user journey" \
              >> "$raw_diagnostics"
            if (( smoke_exit == 0 )); then
              if (( public_release_status == 11 )); then
                public_release_failure=PUBLIC_RELEASE_MISMATCH
              else
                public_release_failure=PUBLIC_RELEASE_UNAVAILABLE
              fi
              printf '{"outcome":"FAILED","exitCode":1,"lastCompletedStage":"journey-completed","failureCode":"%s","failureCauseCode":null,"cleanupOutcome":"SUCCEEDED","answerDiagnostic":null}\n' \
                "$public_release_failure" > "$public_status"
              smoke_exit=1
            fi
          fi
          exit_tmp=$(mktemp "$RUNNER_TEMP/rulepilot-ordinary-user-exit.XXXXXX")
          printf '%s\n' "$smoke_exit" > "$exit_tmp"
          chmod 600 "$exit_tmp"
          mv -f "$exit_tmp" "$raw_exit"
          chmod 700 "$raw_dir"
          exit "$smoke_exit"

      - name: Prove credentials are absent and rebuild the allowlisted journey artifact
        id: cleanup_credentials
        if: always()
        shell: /bin/bash --noprofile --norc -p {0}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LC_ALL: C
          LD_LIBRARY_PATH: ''
          LD_PRELOAD: ''
          PATH: /usr/bin:/bin
          RULEPILOT_SMOKE_TESTED_SHA: ${{ inputs.tested_sha }}
          RULEPILOT_SMOKE_ACTIVE_RELEASE_ID: ${{ steps.production_identity.outputs.active_release_id }}
        run: |
          set -Eeuo pipefail
          raw_dir="$RUNNER_TEMP/production-ordinary-user-smoke-raw"
          artifact_dir="$RUNNER_TEMP/production-ordinary-user-smoke"
          raw_status="$raw_dir/public-status.raw.json"
          raw_summary="$raw_dir/success-summary.raw.json"
          raw_exit="$raw_dir/exit-code.raw"
          sanitized_status=$(mktemp "$RUNNER_TEMP/rulepilot-ordinary-user-status.XXXXXX")
          validated_summary=$(mktemp "$RUNNER_TEMP/rulepilot-ordinary-user-summary.XXXXXX")
          temporary_artifact=$(mktemp "$RUNNER_TEMP/rulepilot-ordinary-user-artifact.XXXXXX")
          cleanup_untrusted_outputs() {
            rm -rf "$raw_dir"
            rm -f "$sanitized_status" "$validated_summary" "$temporary_artifact"
          }
          trap cleanup_untrusted_outputs EXIT
          rm -f \
            "$HOME/.ssh/id_ed25519" \
            "$HOME/.ssh/known_hosts" \
            "$RUNNER_TEMP/rulepilot-ordinary-user-credentials"
          test ! -e "$HOME/.ssh/id_ed25519"
          test ! -e "$HOME/.ssh/known_hosts"
          test ! -e "$RUNNER_TEMP/rulepilot-ordinary-user-credentials"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          chmod 700 "$artifact_dir"

          tested_sha="$RULEPILOT_SMOKE_TESTED_SHA"
          active_release_id=${RULEPILOT_SMOKE_ACTIVE_RELEASE_ID:-not-observed}
          [[ "$tested_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$active_release_id" != not-observed ]]; then
            [[ "$active_release_id" =~ ^${tested_sha}-[0-9]+-[0-9]+$ ]]
          fi

          journey_exit=1
          if [[ -f "$raw_exit" && ! -L "$raw_exit" ]]; then
            raw_exit_size=$(wc -c < "$raw_exit" | tr -d ' ')
            if (( raw_exit_size >= 2 && raw_exit_size <= 4 )); then
              candidate_exit=$(<"$raw_exit")
              if [[ "$candidate_exit" =~ ^(0|[1-9][0-9]{0,2})$ ]] \
                  && (( candidate_exit <= 255 )); then
                journey_exit=$candidate_exit
              fi
            fi
          fi

          status_valid=false
          if [[ -f "$raw_status" && ! -L "$raw_status" ]]; then
            raw_status_size=$(wc -c < "$raw_status" | tr -d ' ')
            if (( raw_status_size > 0 && raw_status_size <= 4096 )) \
                && jq --exit-status --compact-output \
                  --argjson expectedExit "$journey_exit" '
                def is_stage:
                  IN("not-started", "csrf-ready", "login-completed", "bgg-binding-verified",
                    "image-gallery-candidate-verified", "official-import-accepted",
                    "official-import-completed", "image-gallery-pages-verified", "upload-completed",
                    "document-ready", "teaching-preparation-completed", "teaching-plan-inspected",
                    "teaching-plan-verified", "title-verified", "lesson-launch-visible",
                    "lesson-generation-completed", "lesson-verified", "visual-expectation-verified",
                    "answer-verified", "navigation-verified", "journey-completed");
                def is_failure_code:
                  IN("INPUT_INVALID", "AUTHENTICATION_FAILED", "SOURCE_DISCOVERY_FAILED",
                    "SOURCE_UPLOAD_FAILED", "OFFICIAL_IMPORT_FAILED", "PAGE_SEQUENCE_INVALID",
                    "TEACHING_PREPARATION_FAILED", "TEACHING_PLAN_INVALID",
                    "LESSON_GENERATION_FAILED", "ANSWER_EVIDENCE_INVALID", "NAVIGATION_FAILED",
                    "CLEANUP_FAILED", "PUBLIC_RELEASE_UNAVAILABLE",
                    "PUBLIC_RELEASE_MISMATCH", "UNEXPECTED_SMOKE_FAILURE");
                def is_cause:
                  . == null or (type == "string" and length >= 1 and length <= 80
                    and test("^[A-Z][A-Z0-9_]*$"));
                def is_answer_status:
                  IN("ANSWERED", "ANSWERED_WITH_WARNING", "CLARIFICATION_REQUIRED",
                    "INSUFFICIENT_EVIDENCE", "RETRIEVAL_UNAVAILABLE", "MODEL_UNAVAILABLE",
                    "MODEL_TIMEOUT", "INVALID_MODEL_OUTPUT", "VERSION_CONFLICT");
                def is_run_state:
                  IN("RECEIVED", "DOCUMENT_READINESS", "LESSON_PLANNING",
                    "QUESTION_UNDERSTANDING", "NEED_CLARIFICATION", "RETRIEVAL_PLANNING",
                    "RETRIEVING", "VERIFYING_EVIDENCE", "INSUFFICIENT_EVIDENCE",
                    "LESSON_COMPOSITION", "ANSWER_COMPOSITION", "MEDIA_PACKAGING",
                    "CRITIQUING", "COMPLETED", "FAILED", "DEGRADED");
                def is_answer_diagnostic:
                  . == null or (
                    type == "object"
                    and (keys | sort) == ["assistantRunId", "lastErrorCode", "ownerVerified",
                      "runState", "status", "stopReason"]
                    and (.status | is_answer_status)
                    and (.assistantRunId | type == "string"
                      and test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))
                    and (.runState | is_run_state)
                    and (.lastErrorCode == null or (.lastErrorCode | type == "string"
                      and test("^[A-Z][A-Z0-9_]{2,63}$")))
                    and (.stopReason == null or (.stopReason | IN("MODEL_CAPABILITY_UNAVAILABLE",
                      "MODEL_REQUEST_TIMEOUT", "MODEL_REQUEST_UNAVAILABLE", "TIMEOUT",
                      "STEP_BUDGET", "TOOL_BUDGET", "MODEL_BUDGET", "TOKEN_BUDGET",
                      "CANCELLED", "EXECUTION_FAILED", "TOOL_ALLOWLIST_UNAVAILABLE",
                      "COMPLETION_NO_PROGRESS", "ACTION_NO_PROGRESS",
                      "OBSERVATION_BUDGET_EXHAUSTED", "OBSERVATION_BUDGET_EXCEEDED",
                      "OBSERVATION_NO_PROGRESS")))
                    and .ownerVerified == true
                  );
                select(type == "object")
                | select((keys | sort) == ["answerDiagnostic", "cleanupOutcome", "exitCode",
                    "failureCauseCode", "failureCode", "lastCompletedStage", "outcome"])
                | select(.exitCode == $expectedExit and (.lastCompletedStage | is_stage))
                | select(.cleanupOutcome | IN("SUCCEEDED", "FAILED", "NOT_REQUIRED"))
                | select(.answerDiagnostic | is_answer_diagnostic)
                | select(if $expectedExit == 0 then
                    .outcome == "SUCCEEDED"
                      and .failureCode == null
                      and .failureCauseCode == null
                      and .lastCompletedStage == "journey-completed"
                      and .cleanupOutcome != "FAILED"
                      and .answerDiagnostic != null
                      and ((.answerDiagnostic.status == "ANSWERED"
                          and .answerDiagnostic.runState == "COMPLETED"
                          and .answerDiagnostic.stopReason == null)
                        or (.answerDiagnostic.status == "ANSWERED_WITH_WARNING"
                          and .answerDiagnostic.runState == "DEGRADED"
                          and .answerDiagnostic.stopReason == null))
                  else
                    .outcome == "FAILED"
                      and (.failureCode | is_failure_code)
                      and (.failureCauseCode | is_cause)
                      and (if .failureCode == "CLEANUP_FAILED" then
                        .cleanupOutcome == "FAILED" and .lastCompletedStage == "journey-completed"
                      else true end)
                  end)
                | {outcome, exitCode, lastCompletedStage, failureCode, failureCauseCode,
                    cleanupOutcome,
                    answerDiagnostic: (if .answerDiagnostic == null then null else {
                      status: .answerDiagnostic.status,
                      assistantRunId: .answerDiagnostic.assistantRunId,
                      runState: .answerDiagnostic.runState,
                      lastErrorCode: .answerDiagnostic.lastErrorCode,
                      stopReason: .answerDiagnostic.stopReason,
                      ownerVerified: .answerDiagnostic.ownerVerified
                    } end)}
              ' "$raw_status" > "$sanitized_status"; then
              status_valid=true
            fi
          fi
          if [[ "$status_valid" != true ]]; then
            jq -n \
              '{outcome:"FAILED",exitCode:1,lastCompletedStage:"status-unavailable",
               failureCode:"UNEXPECTED_SMOKE_FAILURE",failureCauseCode:null,
               cleanupOutcome:"FAILED",answerDiagnostic:null}
            ' > "$sanitized_status"
            journey_exit=1
          fi

          status_outcome=$(jq -r '.outcome' "$sanitized_status")
          summary_valid=false
          if [[ "$journey_exit" == 0 && "$status_outcome" == SUCCEEDED \
              && -f "$raw_summary" && ! -L "$raw_summary" ]]; then
            raw_summary_size=$(wc -c < "$raw_summary" | tr -d ' ')
            if (( raw_summary_size > 0 && raw_summary_size <= 1048576 )) \
                && jq --exit-status --compact-output '
                  def integer_between($minimum; $maximum):
                    type == "number" and floor == . and . >= $minimum and . <= $maximum;
                  def number_between($minimum; $maximum):
                    type == "number" and . >= $minimum and . <= $maximum;
                  def common_valid:
                    (.title | type == "string" and length >= 1 and length <= 160)
                      and (.preparationState | IN("COMPLETED", "DEGRADED"))
                      and (.lessonState | IN("COMPLETED", "DEGRADED"))
                      and (.lessonStatus | IN("COMPLETE", "DRAFT_READY"))
                      and (.answerStatus | IN("ANSWERED", "ANSWERED_WITH_WARNING"))
                      and (.sectionCount | integer_between(1; 10000))
                      and (.answerCitationCount | integer_between(1; 10000))
                      and (.visualStepCount | integer_between(0; 100000))
                      and (.focusedVisualStepCount | integer_between(0; 100000))
                      and .focusedVisualStepCount <= .visualStepCount
                      and .visualAssemblyMode == "IN_TEACHING"
                      and .cleanup == "scheduled"
                      and (.navigation | type == "object"
                        and (keys | sort) == ["averageMs", "failureCount", "maxMs", "requestCount"])
                      and (.navigation.requestCount | integer_between(1; 100000))
                      and .navigation.failureCount == 0
                      and (.navigation.averageMs | number_between(0; 1000000000))
                      and (.navigation.maxMs | number_between(0; 1000000000));
                  . as $raw
                  | if has("sourceMode") then
                      select(common_valid)
                      | select(.sourceMode == "official_image_gallery")
                      | select(.sourceUrl | type == "string" and length >= 1 and length <= 2048
                          and startswith("https://"))
                      | select(.effectiveSourceUrl | type == "string" and length >= 1 and length <= 2200
                          and startswith("https://"))
                      | select(.pageCount | integer_between(1; 500))
                    else
                      select(common_valid)
                    end
                  | {
                      sourceMode: .sourceMode,
                      title,
                      sourceUrl: .sourceUrl,
                      effectiveSourceUrl: .effectiveSourceUrl,
                      pageCount: .pageCount,
                      preparationState,
                      lessonState,
                      lessonStatus,
                      answerStatus,
                      sectionCount,
                      answerCitationCount,
                      visualStepCount,
                      focusedVisualStepCount,
                      visualAssemblyMode,
                      navigation: {
                        requestCount: .navigation.requestCount,
                        failureCount: .navigation.failureCount,
                        averageMs: .navigation.averageMs,
                        maxMs: .navigation.maxMs
                      },
                      cleanup
                    }
                  | with_entries(select(.value != null))
                ' "$raw_summary" > "$validated_summary"; then
              summary_valid=true
            fi
          fi

          if [[ "$summary_valid" == true ]]; then
            source_url_sha256=""
            effective_source_url_sha256=""
            source_url=$(jq -r '.sourceUrl // empty' "$validated_summary")
            effective_source_url=$(jq -r '.effectiveSourceUrl // empty' "$validated_summary")
            if [[ -n "$source_url" ]]; then
              source_url_sha256=$(printf '%s' "$source_url" | sha256sum | awk '{print $1}')
            fi
            if [[ -n "$effective_source_url" ]]; then
              effective_source_url_sha256=$(printf '%s' "$effective_source_url" | sha256sum | awk '{print $1}')
            fi
            jq --exit-status --compact-output \
              --arg releaseId "$active_release_id" \
              --arg commitSha "$tested_sha" \
              --arg sourceUrlSha256 "$source_url_sha256" \
              --arg effectiveSourceUrlSha256 "$effective_source_url_sha256" \
              --slurpfile execution "$sanitized_status" '
                del(.sourceUrl, .effectiveSourceUrl)
                | . + {
                    sourceUrlSha256: (if .sourceMode == null then null else $sourceUrlSha256 end),
                    effectiveSourceUrlSha256: (if .sourceMode == null then null
                      else $effectiveSourceUrlSha256 end),
                    execution: $execution[0],
                    releaseId: $releaseId,
                    commitSha: $commitSha
                  }
                | with_entries(select(.value != null))
              ' "$validated_summary" > "$temporary_artifact"
          else
            if [[ "$journey_exit" == 0 && "$status_outcome" == SUCCEEDED ]]; then
              jq '{outcome:"FAILED",exitCode:1,lastCompletedStage:"summary-unavailable",
                   failureCode:"UNEXPECTED_SMOKE_FAILURE",failureCauseCode:null,
                   cleanupOutcome,answerDiagnostic}' "$sanitized_status" > "$temporary_artifact"
            else
              cp "$sanitized_status" "$temporary_artifact"
            fi
            jq --exit-status --compact-output \
              --arg releaseId "$active_release_id" \
              --arg commitSha "$tested_sha" \
              '. + {releaseId:$releaseId,commitSha:$commitSha}' \
              "$temporary_artifact" > "$artifact_dir/summary.pending.json"
            mv "$artifact_dir/summary.pending.json" "$temporary_artifact"
          fi
          chmod 600 "$temporary_artifact"
          mv "$temporary_artifact" "$artifact_dir/summary.json"
          rm -rf "$raw_dir"
          test -f "$artifact_dir/summary.json" && test ! -L "$artifact_dir/summary.json"
          artifact_size=$(wc -c < "$artifact_dir/summary.json" | tr -d ' ')
          (( artifact_size > 0 && artifact_size <= 1048576 ))
          [[ "$(find "$artifact_dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" == 1 ]]
          chmod -R go-rwx "$artifact_dir"
          trap - EXIT

      - name: Upload sanitized journey output
        if: always() && steps.cleanup_credentials.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: production-ordinary-user-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/production-ordinary-user-smoke/summary.json
          if-no-files-found: error
          retention-days: 1

      - name: Require a successful ordinary-user journey
        if: always() && steps.cleanup_credentials.outcome == 'success'
        shell: /bin/bash --noprofile --norc -p {0}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          GITHUB_ENV: /dev/null
          GITHUB_PATH: /dev/null
          LD_PRELOAD: ''
          PATH: /usr/bin:/bin
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/production-ordinary-user-smoke/summary.json"
          test -f "$report" && test ! -L "$report"
          jq --exit-status '
            .execution.outcome == "SUCCEEDED"
              and .execution.exitCode == 0
              and .preparationState == "COMPLETED"
              and .lessonState == "COMPLETED"
              and (.lessonStatus == "COMPLETE" or .lessonStatus == "DRAFT_READY")
              and (.answerStatus == "ANSWERED" or .answerStatus == "ANSWERED_WITH_WARNING")
          ' "$report" > /dev/null
