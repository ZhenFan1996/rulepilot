name: Production ordinary-user smoke

on:
  workflow_dispatch:
    inputs:
      rulebook_url:
        description: Optional HTTPS publisher PDF; blank generates the unique CC0 text fixture
        required: false
        default: ''
        type: string
      rulebook_title:
        description: Exact source-grounded title when rulebook_url is supplied
        required: false
        default: ''
        type: string
      question:
        description: Source-grounded question when rulebook_url is supplied
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: production-runtime
  cancel-in-progress: false

jobs:
  smoke:
    name: Upload, teach, verify, and clean up
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      RULEBOOK_URL: ${{ inputs.rulebook_url }}
      RULEBOOK_TITLE: ${{ inputs.rulebook_title }}
      RULEBOOK_QUESTION: ${{ inputs.question }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Configure production SSH trust
        shell: bash
        run: |
          set -Eeuo pipefail
          for required_secret in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY DEPLOY_USER; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required production deployment secret: ${required_secret}" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Generate a unique CC0 smoke rulebook
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$RULEBOOK_URL" ]]; then
            [[ -z "$RULEBOOK_TITLE" && -z "$RULEBOOK_QUESTION" ]] || {
              echo "rulebook_title and question require rulebook_url" >&2
              exit 2
            }
            cp examples/lantern-relay-rules.txt "$RUNNER_TEMP/lantern-relay-smoke.txt"
            printf '\nSMOKE RUN %s\n' "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/lantern-relay-smoke.txt"
            node scripts/generate-demo-pdf.mjs \
              "$RUNNER_TEMP/lantern-relay-smoke.txt" \
              "$RUNNER_TEMP/rulebook.pdf"
            printf '%s\n' text > "$RUNNER_TEMP/preparation-mode"
          else
            [[ "$RULEBOOK_URL" == https://* ]] || { echo "rulebook_url must use HTTPS" >&2; exit 2; }
            [[ -n "$RULEBOOK_TITLE" && -n "$RULEBOOK_QUESTION" ]] || {
              echo "rulebook_title and question are required for a publisher PDF" >&2
              exit 2
            }
            curl --proto '=https' --location --fail --silent --show-error --max-filesize 26214400 \
              "$RULEBOOK_URL" --output "$RUNNER_TEMP/rulebook.pdf"
            [[ "$(head -c 5 "$RUNNER_TEMP/rulebook.pdf")" == '%PDF-' ]] || {
              echo "Publisher response was not a PDF" >&2
              exit 1
            }
            printf '%s\n' visual > "$RUNNER_TEMP/preparation-mode"
          fi

      - name: Open an authenticated production tunnel and replay the journey
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o ExitOnForwardFailure=yes
            -o StrictHostKeyChecking=yes
            -p "$DEPLOY_SSH_PORT"
          )

          expected_sha=$(git rev-parse HEAD)
          active_release=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          readlink -f "$1/current"
          REMOTE
          )
          case "${active_release##*/}" in
            "$expected_sha"-*) ;;
            *)
              echo "Production is not running the checked-out main commit" >&2
              exit 1
              ;;
          esac

          player_password=$(ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          env_file="$1/current/.env"
          value=$(sed -n 's/^RULEPILOT_USER_PASSWORD=//p' "$env_file" | head -n 1)
          value=${value#\"}
          value=${value%\"}
          value=${value#\'}
          value=${value%\'}
          test -n "$value"
          printf '%s' "$value"
          REMOTE
          )
          echo "::add-mask::$player_password"

          ssh "${ssh_options[@]}" -N -L 18080:127.0.0.1:8080 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18080/actuator/health; then
              break
            fi
            if [[ "$attempt" == 20 ]]; then
              echo "Production SSH tunnel did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          private_dir="$RUNNER_TEMP/rulepilot-private-ordinary-user-${GITHUB_RUN_ID}"
          mkdir -p "$private_dir"
          chmod 700 "$private_dir"
          smoke_args=(
            --base-url http://127.0.0.1:18080
            --pdf "$RUNNER_TEMP/rulebook.pdf"
            --result-file "$private_dir/result.json"
          )
          preparation_mode=$(<"$RUNNER_TEMP/preparation-mode")
          if [[ "$preparation_mode" == visual ]]; then
            smoke_args+=(
              --expected-title "${RULEBOOK_TITLE,,}"
              --uploaded-title "$RULEBOOK_TITLE"
              --official-source-url "$RULEBOOK_URL"
              --preparation-mode visual
              --visual-expectation required
              --navigation-mode api
              --question "$RULEBOOK_QUESTION"
            )
          fi
          RULEPILOT_SMOKE_PASSWORD="$player_password" \
            bash scripts/smoke-production-ordinary-user.sh "${smoke_args[@]}" \
              > "$private_dir/summary.json" 2> "$private_dir/diagnostics.log"
          chmod -R go-rwx "$private_dir"

      - name: Create non-sensitive smoke measurements
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          private_result="$RUNNER_TEMP/rulepilot-private-ordinary-user-${GITHUB_RUN_ID}/result.json"
          public_dir="$GITHUB_WORKSPACE/.artifacts/production-ordinary-user-smoke"
          mkdir -p "$public_dir"
          if [[ -s "$private_result" ]]; then
            jq -e '{
              schemaVersion: 1,
              generatedAt,
              completed: (.completed // false),
              stage,
              preparation: {
                state: (.summary.preparationState // .preparationState // null),
                planSectionCount: (.summary.sectionCount // .planSectionCount // 0)
              },
              lesson: {
                runState: (.summary.lessonState // null),
                status: (.summary.lessonStatus // null),
                visualStepCount: (.summary.visualStepCount // 0),
                focusedVisualStepCount: (.summary.focusedVisualStepCount // 0),
                visualEnrichmentState: (.summary.visualEnrichmentState // null)
              },
              answer: {
                status: (.summary.answerStatus // .answerStatus // null),
                citationCount: (.summary.answerCitationCount // .answerCitationCount // 0)
              },
              navigation: (.summary.navigation // {
                requestCount: 0, failureCount: 0, averageMs: 0, maxMs: 0
              }),
              titleVerified: (.summary.titleVerified // false)
            }' "$private_result" > "$public_dir/summary.json"
          else
            printf '%s\n' \
              '{"schemaVersion":1,"completed":false,"stage":"workflow-failed-before-result"}' \
              > "$public_dir/summary.json"
          fi
          chmod 600 "$public_dir/summary.json"

      - name: Upload non-sensitive smoke measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-ordinary-user-smoke-${{ github.run_id }}
          path: .artifacts/production-ordinary-user-smoke/summary.json
          if-no-files-found: warn
          retention-days: 1

      - name: Delete private smoke evidence from the runner
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- "$RUNNER_TEMP/rulepilot-private-ordinary-user-${GITHUB_RUN_ID}"
          rm -rf -- "$GITHUB_WORKSPACE/.artifacts/production-ordinary-user-smoke"
          rm -f -- "$HOME/.ssh/id_ed25519" "$RUNNER_TEMP/rulebook.pdf"
