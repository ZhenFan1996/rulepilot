name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-runtime
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy RulePilot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 3

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare immutable release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DEPLOY_RELEASE_ID=$(git rev-parse HEAD)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Build immutable deployment artifacts
        run: |
          ./mvnw -q -DskipTests package
        working-directory: backend

      - name: Build immutable backend runtime image
        shell: bash
        run: |
          set -Eeuo pipefail
          backend_image="rulepilot-backend:${DEPLOY_RELEASE_ID}"
          backend_image_archive="rulepilot-backend-${DEPLOY_RELEASE_ID}.tar.gz"
          docker build \
            --file backend/Dockerfile.runtime \
            --tag "$backend_image" \
            backend
          docker image inspect "$backend_image" >/dev/null
          docker save "$backend_image" | gzip -1 > "$RUNNER_TEMP/$backend_image_archive"
          test -s "$RUNNER_TEMP/$backend_image_archive"
          (cd "$RUNNER_TEMP" && sha256sum "$backend_image_archive" > "${backend_image_archive}.sha256")
          sha256sum "$RUNNER_TEMP/$backend_image_archive"

      - name: Build frontend artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run build
          previous_build_roots=()
          cleanup_previous_builds() {
            for previous_root in "${previous_build_roots[@]}"; do
              if [[ "$previous_root" == "$RUNNER_TEMP"/rulepilot-previous-frontend.* ]]; then
                rm -rf -- "$previous_root"
              fi
            done
          }
          trap cleanup_previous_builds EXIT
          for release_distance in 1 2; do
            previous_ref="HEAD~${release_distance}"
            git -C .. rev-parse --verify "${previous_ref}^{commit}" >/dev/null
            previous_root=$(mktemp -d "$RUNNER_TEMP/rulepilot-previous-frontend.XXXXXX")
            previous_build_roots+=("$previous_root")
            git -C .. archive "$previous_ref" frontend | tar -x -C "$previous_root"
            (
              cd "$previous_root/frontend"
              npm ci --prefer-offline --no-audit --no-fund
              npm run build
            )
            bash ../scripts/retain-frontend-release-assets.sh \
              dist/assets \
              "$previous_root/frontend/dist/assets"
          done
        working-directory: frontend

      - name: Configure production SSH trust
        id: configure_ssh
        shell: bash
        run: |
          set -Eeuo pipefail
          for required_secret in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY DEPLOY_USER; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required production deployment secret: ${required_secret}" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Synchronize protected BGG credential
        shell: bash
        env:
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$BGG_API_TOKEN" ]]; then
            echo "Missing required production integration secret: BGG_API_TOKEN" >&2
            exit 1
          fi
          if (( ${#BGG_API_TOKEN} > 4096 )) || [[ ! "$BGG_API_TOKEN" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "BGG_API_TOKEN has an invalid format" >&2
            exit 1
          fi

          local_token_file="$RUNNER_TEMP/rulepilot-bgg-token-${GITHUB_RUN_ID}"
          remote_token_file="/tmp/rulepilot-bgg-token-${GITHUB_RUN_ID}"
          cleanup_local() {
            rm -f "$local_token_file"
          }
          trap cleanup_local EXIT
          umask 077
          printf '%s' "$BGG_API_TOKEN" > "$local_token_file"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_SSH_PORT" \
            "$local_token_file" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_token_file}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" "$remote_token_file" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$1
          token_file=$2
          env_file="${application_root}/.env"
          temporary_env="${application_root}/.env.${GITHUB_RUN_ID:-sync}.tmp"
          cleanup_remote() {
            rm -f "$token_file" "$temporary_env"
          }
          trap cleanup_remote EXIT

          test -f "$env_file"
          test -f "$token_file"
          chmod 600 "$token_file"
          token=$(<"$token_file")
          if [[ -z "$token" ]] || (( ${#token} > 4096 )) || [[ ! "$token" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Uploaded BGG credential has an invalid format" >&2
            exit 1
          fi

          umask 077
          found=false
          qwen_enabled=false
          qwen_key_present=false
          deepseek_enabled=false
          deepseek_key_present=false
          model_credential_key_present=false
          managed_runtime_keys=' TEACHING_PROVIDER TEACHING_MODEL_PROVIDER VISUAL_PROVIDER VISUAL_MODEL_PROVIDER ANSWER_PROVIDER ANSWER_MODEL_PROVIDER BGG_TRANSLATION_ENABLED BGG_TRANSLATION_TIMEOUT BGG_TRANSLATION_CACHE_TTL BGG_TRANSLATION_HOURLY_LIMIT BGG_TRANSLATION_PROVIDER_CONCURRENCY BGG_CACHE_PREWARM_ENABLED BGG_CACHE_PREWARM_GAME_COUNT BGG_CACHE_PREWARM_COHORT_SIZE BGG_CACHE_PREWARM_TRANSLATION_COHORT_SIZE BGG_CACHE_PREWARM_RESUME_DELAY BGG_CACHE_PREWARM_LEASE_DURATION BGG_RECOMMENDATION_AGENT_ENABLED BGG_RECOMMENDATION_PROVIDER BGG_RECOMMENDATION_MODEL_PROVIDER BGG_RECOMMENDATION_MODEL_CANDIDATE_LIMIT BGG_RECOMMENDATION_AGENT_TIMEOUT BGG_RECOMMENDATION_TEMPERATURE BGG_RECOMMENDATION_WEB_RESEARCH_ENABLED BGG_RECOMMENDATION_WEB_RESEARCH_TIMEOUT WEB_SEARCH_MODEL QWEN_MODEL QWEN_VISION_CAPABLE RULEBOOK_DISCOVERY_MODEL RULEBOOK_DISCOVERY_NEGATIVE_CACHE_TTL RULEBOOK_DISCOVERY_HOURLY_LIMIT RULEBOOK_DISCOVERY_PROVIDER_CONCURRENCY PRODUCTION_TRACING_EXPORT_OTLP_ENABLED PRODUCTION_TRACING_OTLP_ENDPOINT PRODUCTION_TRACING_SAMPLING_PROBABILITY '
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ "$line" == BGG_API_TOKEN=* ]]; then
              printf 'BGG_API_TOKEN=%s\n' "$token"
              found=true
            elif [[ "$line" == QWEN_ENABLED=true ]]; then
              printf '%s\n' "$line"
              qwen_enabled=true
            elif [[ "$line" == QWEN_API_KEY=* ]]; then
              printf '%s\n' "$line"
              [[ -n "${line#QWEN_API_KEY=}" ]] && qwen_key_present=true
            elif [[ "$line" == DEEPSEEK_ENABLED=true ]]; then
              printf '%s\n' "$line"
              deepseek_enabled=true
            elif [[ "$line" == DEEPSEEK_API_KEY=* ]]; then
              printf '%s\n' "$line"
              [[ -n "${line#DEEPSEEK_API_KEY=}" ]] && deepseek_key_present=true
            elif [[ "$line" == MODEL_CREDENTIAL_ENCRYPTION_KEY=* ]]; then
              printf '%s\n' "$line"
              [[ -n "${line#MODEL_CREDENTIAL_ENCRYPTION_KEY=}" ]] && model_credential_key_present=true
            elif [[ "$managed_runtime_keys" == *" ${line%%=*} "* ]]; then
              continue
            else
              printf '%s\n' "$line"
            fi
          done < "$env_file" > "$temporary_env"
          if [[ "$found" == false ]]; then
            printf 'BGG_API_TOKEN=%s\n' "$token" >> "$temporary_env"
          fi
          if [[ "$qwen_enabled" != true || "$qwen_key_present" != true ]]; then
            echo "Production Qwen configuration is required for recommendation, teaching, visual evidence, and answers" >&2
            exit 1
          fi
          if [[ "$deepseek_enabled" != true || "$deepseek_key_present" != true ]]; then
            echo "Production DeepSeek configuration is required for persistent Chinese catalog translations" >&2
            exit 1
          fi
          if [[ "$model_credential_key_present" != true ]]; then
            printf 'MODEL_CREDENTIAL_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32 | tr -d '\n')" >> "$temporary_env"
          fi
          printf '%s\n' \
            'TEACHING_PROVIDER=spring-ai' \
            'TEACHING_MODEL_PROVIDER=deepseek' \
            'VISUAL_PROVIDER=spring-ai' \
            'VISUAL_MODEL_PROVIDER=qwen' \
            'ANSWER_PROVIDER=spring-ai' \
            'ANSWER_MODEL_PROVIDER=qwen' \
            'BGG_TRANSLATION_ENABLED=true' \
            'BGG_TRANSLATION_TIMEOUT=PT20S' \
            'BGG_TRANSLATION_CACHE_TTL=P30D' \
            'BGG_TRANSLATION_HOURLY_LIMIT=60' \
            'BGG_TRANSLATION_PROVIDER_CONCURRENCY=2' \
            'BGG_CACHE_PREWARM_ENABLED=true' \
            'BGG_CACHE_PREWARM_GAME_COUNT=10000' \
            'BGG_CACHE_MAXIMUM_ENTRIES=20000' \
            'BGG_CACHE_MAXIMUM_BYTES=268435456' \
            'BGG_CACHE_PREWARM_COHORT_SIZE=500' \
            'BGG_CACHE_PREWARM_TRANSLATION_COHORT_SIZE=60' \
            'BGG_CACHE_PREWARM_RESUME_DELAY=PT1H' \
            'BGG_CACHE_PREWARM_LEASE_DURATION=PT30M' \
            'BGG_RECOMMENDATION_AGENT_ENABLED=true' \
            'BGG_RECOMMENDATION_PROVIDER=spring-ai' \
            'BGG_RECOMMENDATION_MODEL_PROVIDER=deepseek' \
            'BGG_RECOMMENDATION_MODEL_CANDIDATE_LIMIT=8' \
            'BGG_RECOMMENDATION_AGENT_TIMEOUT=PT45S' \
            'BGG_RECOMMENDATION_TEMPERATURE=0.0' \
            'BGG_RECOMMENDATION_WEB_RESEARCH_ENABLED=true' \
            'BGG_RECOMMENDATION_WEB_RESEARCH_TIMEOUT=PT25S' \
            'WEB_SEARCH_MODEL=qwen3.7-plus' \
            'QWEN_MODEL=qwen3.7-plus' \
            'QWEN_VISION_CAPABLE=true' \
            'RULEBOOK_DISCOVERY_MODEL=qwen3.7-max' \
            'RULEBOOK_DISCOVERY_NEGATIVE_CACHE_TTL=PT10M' \
            'RULEBOOK_DISCOVERY_HOURLY_LIMIT=30' \
            'RULEBOOK_DISCOVERY_PROVIDER_CONCURRENCY=1' \
            'PRODUCTION_TRACING_EXPORT_OTLP_ENABLED=true' \
            'PRODUCTION_TRACING_OTLP_ENDPOINT=http://tempo:4318/v1/traces' \
            'PRODUCTION_TRACING_SAMPLING_PROBABILITY=0.05' >> "$temporary_env"
          chmod 600 "$temporary_env"
          mv "$temporary_env" "$env_file"
          unset token
          echo "Synchronized managed production integration configuration."
          REMOTE

      - name: Package release
        shell: bash
        run: |
          set -Eeuo pipefail
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude='.env.*' \
            --exclude=.local \
            --exclude=frontend/node_modules \
            -czf "$RUNNER_TEMP/rulepilot-release.tar.gz" .
          sha256sum "$RUNNER_TEMP/rulepilot-release.tar.gz"

      - name: Upload release bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_SSH_PORT" \
            "$RUNNER_TEMP/rulepilot-release.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/rulepilot-${DEPLOY_RELEASE_ID}.tar.gz"

      - name: Upload immutable backend runtime image
        shell: bash
        run: |
          set -Eeuo pipefail
          backend_image_archive="rulepilot-backend-${DEPLOY_RELEASE_ID}.tar.gz"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_SSH_PORT" \
            "$RUNNER_TEMP/$backend_image_archive" \
            "$RUNNER_TEMP/${backend_image_archive}.sha256" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"

      - name: Prepare exact-release canary trace context
        shell: bash
        run: |
          set -Eeuo pipefail
          read -r canary_trace_id canary_parent_span_id < <(
            node --input-type=module -e \
              'import { randomBytes } from "node:crypto"; console.log(`${randomBytes(16).toString("hex")} ${randomBytes(8).toString("hex")}`)'
          )
          if [[ ! "$canary_trace_id" =~ ^[0-9a-f]{32}$
            || "$canary_trace_id" == 00000000000000000000000000000000
            || ! "$canary_parent_span_id" =~ ^[0-9a-f]{16}$
            || "$canary_parent_span_id" == 0000000000000000 ]]; then
            echo "Failed to generate a sampled W3C deployment canary trace context" >&2
            exit 1
          fi
          printf 'DEPLOY_CANARY_TRACE_ID=%s\n' "$canary_trace_id" >> "$GITHUB_ENV"
          printf 'DEPLOY_TRACE_START_EPOCH_SECONDS=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
          printf 'RULEPILOT_CANARY_TRACEPARENT=00-%s-%s-01\n' \
            "$canary_trace_id" "$canary_parent_span_id" >> "$GITHUB_ENV"

      - name: Preserve the exact rollback checkpoint
        id: rollback_checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          previous_release_id=$(ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" "$DEPLOY_RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$(readlink -f "$1")
          release_id=$2
          if [[ ! "$release_id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]; then
            echo "Rollback checkpoint release coordinate is invalid" >&2
            exit 1
          fi
          archive="/tmp/rulepilot-${release_id}.tar.gz"
          guard_dir="${application_root}/deployment-guards/${release_id}"
          guard_script="${guard_dir}/production-release-guard.sh"
          temporary_guard=$(mktemp "/tmp/rulepilot-release-guard.${release_id}.XXXXXX")
          cleanup_guard() {
            rm -f "$temporary_guard"
          }
          trap cleanup_guard EXIT
          test -f "$archive"
          tar -xOf "$archive" ./scripts/production-release-guard.sh > "$temporary_guard"
          bash -n "$temporary_guard"
          install -d -m 0700 "$guard_dir"
          install -m 0755 "$temporary_guard" "$guard_script"
          previous_release_id=$("$guard_script" checkpoint "$application_root" "$release_id")
          "$guard_script" start "$application_root" "$release_id" "$previous_release_id"
          printf '%s\n' "$previous_release_id"
          REMOTE
          )
          if [[ ! "$previous_release_id" =~ ^[0-9a-f]{40}-[0-9]+(-[0-9]+)?$ ]]; then
            echo "Rollback checkpoint did not return an immutable release id" >&2
            exit 1
          fi
          printf 'DEPLOY_PREVIOUS_RELEASE_ID=%s\n' "$previous_release_id" >> "$GITHUB_ENV"

      - name: Activate release and verify production health
        id: activate_release
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" "$DEPLOY_RELEASE_ID" "$DEPLOY_PREVIOUS_RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$1
          release_id=$2
          previous_release_id=$3
          if [[ ! "$release_id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$
            || ! "$previous_release_id" =~ ^[0-9a-f]{40}-[0-9]+(-[0-9]+)?$ ]]; then
            echo "Activation release coordinates are invalid" >&2
            exit 1
          fi
          archive="/tmp/rulepilot-${release_id}.tar.gz"
          backend_image="rulepilot-backend:${release_id}"
          backend_image_filename="rulepilot-backend-${release_id}.tar.gz"
          backend_image_archive="/tmp/${backend_image_filename}"
          backend_image_checksum="${backend_image_archive}.sha256"
          releases_root="${application_root}/releases"
          release_dir="${application_root}/releases/${release_id}"
          current_release=$(readlink -f "${application_root}/current" 2>/dev/null || true)
          guard_script="${application_root}/deployment-guards/${release_id}/production-release-guard.sh"
          test -x "$guard_script"
          exec 9>"${application_root}/deployment.lock"
          flock -x 9

          safe_container_state() {
            docker inspect --format \
              'container={{.Id}} status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}not-configured{{end}}' \
              "$1" || true
          }

          diagnose_failure() {
            status=$?
            trap - ERR
            echo "Production activation failed; collecting safe diagnostics." >&2
            cd "${release_dir}" 2>/dev/null || cd "${application_root}/current"
            echo "Production filesystem usage:"
            df -h "${application_root}" || true
            echo "Production directory usage:"
            du -x -h --max-depth=1 "${application_root}" /var/lib/docker /var/log 2>/dev/null | sort -h || true
            echo "Production Docker usage:"
            docker system df || true
            echo "Production container status:"
            docker compose --env-file .env \
              -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml ps --all || true
            postgres_container=$(docker compose --env-file .env \
              -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml ps -q postgres 2>/dev/null || true)
            if [[ -n "$postgres_container" ]]; then
              echo "PostgreSQL runtime state:"
              safe_container_state "$postgres_container"
            fi
            api_container=$(docker compose --env-file .env \
              -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml ps -q api 2>/dev/null || true)
            if [[ -n "$api_container" ]]; then
              echo "API runtime state:"
              safe_container_state "$api_container"
            fi
            if [[ -n "$current_release" && -d "$current_release" && -f "${current_release}/.env" ]]; then
              echo "Restoring the complete current release after failed activation."
              if "$guard_script" rollback-held \
                "$application_root" "$release_id" "$previous_release_id"; then
                echo "Restored the immutable frontend and backend checkpoint."
              else
                echo "Automatic current-release service restoration failed." >&2
              fi
            fi
            exit "$status"
          }
          trap diagnose_failure ERR

          test -f "${application_root}/.env"
          test -f "$archive"
          test -f "$backend_image_archive"
          test -f "$backend_image_checksum"
          deploy_sha=${release_id%%-*}
          find /tmp -maxdepth 1 -type f -name "rulepilot-${deploy_sha}-*.tar.gz" \
            ! -path "$archive" -delete
          find /tmp -maxdepth 1 -type f -name "rulepilot-backend-${deploy_sha}-*.tar.gz*" \
            ! -path "$backend_image_archive" \
            ! -path "$backend_image_checksum" -delete
          install -d -m 0755 "$releases_root"
          removed_releases=0
          for candidate in "${releases_root}"/*; do
            [[ -d "$candidate" ]] || continue
            candidate_path=$(readlink -f "$candidate")
            [[ "$candidate_path" == "$current_release" ]] && continue
            [[ "$candidate_path" == "$release_dir" ]] && continue
            if [[ "$candidate_path" != "${releases_root}/"* ]]; then
              echo "Refusing to remove release outside ${releases_root}: ${candidate_path}" >&2
              exit 1
            fi
            rm -rf -- "$candidate_path"
            removed_releases=$((removed_releases + 1))
          done
          printf 'Reclaimed %d inactive release artifact(s); current release retained.\n' "$removed_releases"
          if [[ -n "$current_release" && -d "$current_release" && -f "${current_release}/.env" ]]; then
            echo "Ensuring the current release remains available while the replacement image builds."
            cd "$current_release"
            RULEPILOT_RELEASE_ID="${current_release##*/}" docker compose --env-file .env \
              -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml up -d --no-build api worker
          fi
          (cd /tmp && sha256sum --check "${backend_image_filename}.sha256")
          gzip -dc "$backend_image_archive" | docker load
          docker image inspect "$backend_image" >/dev/null
          install -d -m 0755 "${release_dir}"
          tar -xzf "${archive}" -C "${release_dir}"
          # A GitHub Actions rerun reuses the same release id and may resume after
          # extraction. Replace only this known deployment-owned symlink so the
          # activation remains safe and idempotent.
          ln -sfn "${application_root}/.env" "${release_dir}/.env"

          cd "${release_dir}"
          sh scripts/run-production.sh config
          "$guard_script" arm "$application_root" "$release_id" "$previous_release_id"
          RULEPILOT_BACKEND_IMAGE="$backend_image" \
            RULEPILOT_PREBUILT_BACKEND_IMAGE=true \
            make production-up

          frontend_container=$(docker compose --env-file .env \
            -f infra/compose.yml \
            -f infra/compose.deployment.yml \
            -f infra/compose.production.yml ps -q frontend)
          test -n "$frontend_container"
          frontend_image_id=$(docker inspect --format '{{.Image}}' "$frontend_container")
          docker image inspect "$frontend_image_id" >/dev/null
          docker tag "$frontend_image_id" "rulepilot-frontend:${release_id}"
          docker tag "$backend_image" rulepilot-backend:local
          ln -sfn "${release_dir}" "${application_root}/current"
          "$guard_script" heartbeat "$application_root" "$release_id" "$previous_release_id"
          rm -f "$archive" "$backend_image_archive" "$backend_image_checksum"
          printf 'Activated production release %s\n' "${release_id}"
          docker image ls \
            --filter 'reference=rulepilot-backend:*' \
            --format '{{.Repository}}:{{.Tag}}' | while IFS= read -r candidate; do
            [[ "$candidate" == "$backend_image" ]] && continue
            [[ "$candidate" == "rulepilot-backend:local" ]] && continue
            [[ "$candidate" == "rulepilot-backend:${previous_release_id}" ]] && continue
            if [[ "$candidate" =~ ^rulepilot-backend:[0-9a-f]{40}-[0-9]+(-[0-9]+)?$ ]]; then
              docker image rm "$candidate" || \
                echo "Deferred removal of inactive backend image ${candidate}." >&2
            fi
          done
          docker image ls \
            --filter 'reference=rulepilot-frontend:*' \
            --format '{{.Repository}}:{{.Tag}}' | while IFS= read -r candidate; do
            [[ "$candidate" == "rulepilot-frontend:${release_id}" ]] && continue
            [[ "$candidate" == "rulepilot-frontend:local" ]] && continue
            [[ "$candidate" == "rulepilot-frontend:${previous_release_id}" ]] && continue
            if [[ "$candidate" =~ ^rulepilot-frontend:[0-9a-f]{40}-[0-9]+(-[0-9]+)?$ ]]; then
              docker image rm "$candidate" || \
                echo "Deferred removal of inactive frontend image ${candidate}." >&2
            fi
          done
          echo "Reclaiming stale Docker build cache and dangling images after activation."
          docker builder prune --force --filter "until=168h" || \
            echo "Deferred Docker build-cache cleanup after successful activation." >&2
          docker image prune --force || \
            echo "Deferred dangling-image cleanup after successful activation." >&2
          REMOTE

      - name: Verify public release availability and commit it
        id: public_availability
        shell: bash
        env:
          RULEPILOT_PUBLIC_URL: https://rulepilot.cn
        run: |
          set -Eeuo pipefail
          invoke_guard() {
            local action=$1
            ssh \
              -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              -o StrictHostKeyChecking=yes \
              -p "$DEPLOY_SSH_PORT" \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'bash -s' -- "$DEPLOY_PATH" "$DEPLOY_RELEASE_ID" "$DEPLOY_PREVIOUS_RELEASE_ID" "$action" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$(readlink -f "$1")
          release_id=$2
          previous_release_id=$3
          action=$4
          guard_script="${application_root}/deployment-guards/${release_id}/production-release-guard.sh"
          test -x "$guard_script"
          "$guard_script" "$action" "$application_root" "$release_id" "$previous_release_id"
          REMOTE
          }
          invoke_guard heartbeat
          keep_guard_alive() {
            while sleep 30; do
              invoke_guard heartbeat || return 1
            done
          }
          keep_guard_alive &
          guard_heartbeat_pid=$!
          stop_guard_heartbeat() {
            kill "$guard_heartbeat_pid" 2>/dev/null || true
            wait "$guard_heartbeat_pid" 2>/dev/null || true
          }
          trap stop_guard_heartbeat EXIT INT TERM
          node scripts/verify-production-availability.mjs
          invoke_guard commit

      - name: Roll back any activated release without successful public availability
        if: >-
          always() &&
          steps.rollback_checkpoint.outcome == 'success' &&
          steps.activate_release.outcome != 'skipped' &&
          steps.public_availability.outcome != 'success'
        shell: bash
        env:
          RULEPILOT_PUBLIC_URL: https://rulepilot.cn
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" "$DEPLOY_RELEASE_ID" "$DEPLOY_PREVIOUS_RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$(readlink -f "$1")
          failed_release_id=$2
          previous_release_id=$3
          if [[ ! "$failed_release_id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$
            || ! "$previous_release_id" =~ ^[0-9a-f]{40}-[0-9]+(-[0-9]+)?$ ]]; then
            echo "Rollback release coordinates are invalid" >&2
            exit 1
          fi
          guard_script="${application_root}/deployment-guards/${failed_release_id}/production-release-guard.sh"
          test -x "$guard_script"
          "$guard_script" rollback "$application_root" "$failed_release_id" "$previous_release_id"
          REMOTE
          read -r recovery_trace_id recovery_parent_span_id < <(
            node --input-type=module -e \
              'import { randomBytes } from "node:crypto"; console.log(`${randomBytes(16).toString("hex")} ${randomBytes(8).toString("hex")}`)'
          )
          RULEPILOT_CANARY_TRACEPARENT="00-${recovery_trace_id}-${recovery_parent_span_id}-01" \
            node scripts/verify-production-availability.mjs

      - name: Collect exact-release trace diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PUBLIC_AVAILABILITY_OUTCOME: ${{ steps.public_availability.outcome }}
        run: |
          set -Eeuo pipefail
          umask 077
          artifact_dir="$GITHUB_WORKSPACE/.artifacts/deploy-production"
          trace_evidence="$artifact_dir/release-traces.json"
          trace_candidate="$artifact_dir/release-traces.candidate.json"
          mkdir -p "$artifact_dir"
          chmod 700 "$artifact_dir"
          if [[ ! "${DEPLOY_RELEASE_ID:-}" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$
            || ! "${DEPLOY_CANARY_TRACE_ID:-}" =~ ^[0-9a-f]{32}$
            || "${DEPLOY_CANARY_TRACE_ID:-}" == 00000000000000000000000000000000
            || ! "${DEPLOY_TRACE_START_EPOCH_SECONDS:-}" =~ ^[1-9][0-9]*$ ]]; then
            jq -n '{
              schemaVersion: 1,
              releaseId: null,
              traceId: null,
              window: null,
              queryOutcome: "NOT_RUN",
              queryFailureCause: "CANARY_TRACE_NOT_STARTED",
              releaseTraceObserved: false,
              observedReleaseTraceCount: 0,
              resultLimitReached: false,
              attemptsUsed: 0,
              businessWorkflowTerminal: {
                workflow: "recommendation",
                observed: false,
                state: "NOT_OBSERVED",
                latestDurationMs: null,
                observedTraceCount: 0,
                observedStateCounts: []
              }
            }' > "$trace_evidence"
            chmod 600 "$trace_evidence"
            exit 0
          fi
          trace_end_epoch_seconds=$(date +%s)
          jq -n \
            --arg releaseId "$DEPLOY_RELEASE_ID" \
            --arg traceId "$DEPLOY_CANARY_TRACE_ID" \
            --argjson startEpochSeconds "$DEPLOY_TRACE_START_EPOCH_SECONDS" \
            --argjson endEpochSeconds "$trace_end_epoch_seconds" '{
              schemaVersion: 1,
              releaseId: $releaseId,
              traceId: $traceId,
              window: {
                startEpochSeconds: $startEpochSeconds,
                endEpochSeconds: $endEpochSeconds
              },
              queryOutcome: "NOT_AVAILABLE",
              queryFailureCause: "UNKNOWN",
              releaseTraceObserved: false,
              observedReleaseTraceCount: 0,
              resultLimitReached: false,
              attemptsUsed: 0,
              businessWorkflowTerminal: {
                workflow: "recommendation",
                observed: false,
                state: "NOT_OBSERVED",
                latestDurationMs: null,
                observedTraceCount: 0,
                observedStateCounts: []
              }
            }' > "$trace_evidence"
          chmod 600 "$trace_evidence"
          tempo_tunnel_pid=
          cleanup_tunnel() {
            if [[ -n "$tempo_tunnel_pid" ]]; then
              kill "$tempo_tunnel_pid" 2>/dev/null || true
              wait "$tempo_tunnel_pid" 2>/dev/null || true
            fi
            rm -f "$trace_candidate"
          }
          trap cleanup_tunnel EXIT

          # A previous release may predate persistent production tracing and stop
          # observability services during rollback. Public availability has already
          # been restored above; now use only this failed release's reviewed Compose
          # definition to make its persisted Tempo spans queryable.
          if [[ "$PUBLIC_AVAILABILITY_OUTCOME" != success ]]; then
            if ! ssh \
              -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              -o StrictHostKeyChecking=yes \
              -p "$DEPLOY_SSH_PORT" \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'bash -s' -- "$DEPLOY_PATH" "$DEPLOY_RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$(readlink -f "$1")
          release_id=$2
          if [[ ! "$release_id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]; then
            echo "Trace recovery release coordinate is invalid" >&2
            exit 1
          fi
          releases_root=$(readlink -f "$application_root/releases")
          failed_release=$(readlink -f "$releases_root/$release_id")
          if [[ "${failed_release%/*}" != "$releases_root"
            || ! -d "$failed_release" || ! -f "$failed_release/.env" ]]; then
            echo "Trace recovery release is outside the immutable releases root" >&2
            exit 1
          fi
          cd "$failed_release"
          RULEPILOT_RELEASE_ID="$release_id" docker compose --env-file .env \
            -f infra/compose.yml \
            -f infra/compose.deployment.yml \
            -f infra/compose.production.yml \
            --profile observability up -d --no-deps tempo
          REMOTE
            then
              echo "Production Tempo could not be restarted after rollback; retaining sanitized NOT_AVAILABLE evidence." >&2
            fi
          fi

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            -N -L 13200:127.0.0.1:3200 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" &
          tempo_tunnel_pid=$!
          tempo_ready=false
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:13200/ready >/dev/null 2>&1; then
              tempo_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$tempo_ready" != true ]]; then
            echo "Production Tempo tunnel is not ready; continuing bounded queries to retain NOT_AVAILABLE evidence." >&2
          fi

          trace_attempts=10
          if [[ "$PUBLIC_AVAILABILITY_OUTCOME" == failure ]]; then
            trace_attempts=3
          fi

          node scripts/summarize-production-release-traces.mjs \
            --tempo-url http://127.0.0.1:13200 \
            --release-id "$DEPLOY_RELEASE_ID" \
            --trace-id "$DEPLOY_CANARY_TRACE_ID" \
            --start-epoch-seconds "$DEPLOY_TRACE_START_EPOCH_SECONDS" \
            --end-epoch-seconds "$trace_end_epoch_seconds" \
            --attempts "$trace_attempts" \
            --retry-delay-ms 3000 \
            --output "$trace_candidate" || \
            echo "Exact-release trace summarization failed; retaining sanitized NOT_AVAILABLE evidence." >&2
          if jq -e \
            --arg releaseId "$DEPLOY_RELEASE_ID" \
            --arg traceId "$DEPLOY_CANARY_TRACE_ID" \
            '.schemaVersion == 1 and .releaseId == $releaseId and .traceId == $traceId' \
            "$trace_candidate" >/dev/null 2>&1; then
            mv "$trace_candidate" "$trace_evidence"
          fi

      - name: Upload sanitized deployment trace diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-production-traces-${{ github.run_id }}
          path: .artifacts/deploy-production/release-traces.json
          if-no-files-found: warn
          retention-days: 7

      - name: Collect production service status after a failed verification
        if: failure() && steps.configure_ssh.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$1
          active_release=$(readlink -f "${application_root}/current")
          if [[ "$active_release" != "${application_root}/releases/"* ]]; then
            echo "Refusing to inspect an active release outside ${application_root}/releases" >&2
            exit 1
          fi
          cd "$active_release"
          compose=(
            docker compose --env-file .env
            -f infra/compose.yml
            -f infra/compose.deployment.yml
            -f infra/compose.production.yml
          )
          echo "Active production services:"
          "${compose[@]}" ps api worker frontend gateway
          REMOTE
