name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-runtime
  queue: max
  cancel-in-progress: false

jobs:
  seal_source:
    name: Seal the qualified Git control plane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main'
    outputs:
      deploy_sha: ${{ steps.release_identity.outputs.deploy_sha }}
      deploy_tree: ${{ steps.release_identity.outputs.deploy_tree }}
      release_id: ${{ steps.release_identity.outputs.release_id }}
      build_attempt: ${{ steps.release_identity.outputs.build_attempt }}
      control_plane_sha256: ${{ steps.release_identity.outputs.control_plane_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3

      - name: Verify and seal the exact qualified Git tree
        id: release_identity
        shell: bash
        env:
          QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$QUALIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=3 origin +refs/heads/main:refs/remotes/origin/main
          deploy_sha=$(git rev-parse HEAD)
          deploy_tree=$(git rev-parse "${deploy_sha}^{tree}")
          current_main_sha=$(git rev-parse refs/remotes/origin/main)
          [[ "$deploy_sha" == "$WORKFLOW_SHA" ]]
          [[ "$deploy_sha" == "$QUALIFIED_SHA" ]]
          [[ "$deploy_sha" == "$current_main_sha" ]] || {
            echo "Qualified CI revision is no longer the current main revision; skipping stale deployment." >&2
            exit 1
          }
          release_id="${deploy_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          control_plane_dir="$RUNNER_TEMP/rulepilot-control-plane"
          frontend_history_dir="$RUNNER_TEMP/rulepilot-frontend-history"
          release_bundle="rulepilot-release-${release_id}.tar.gz"
          control_plane_identity="rulepilot-control-plane-${release_id}.identity"
          control_plane_manifest="rulepilot-control-plane-${release_id}.sha256"
          mkdir -p "$control_plane_dir" "$frontend_history_dir"

          # This job deliberately does not install dependencies or invoke anything from the repository. Git writes
          # the deployable control plane before any repository-controlled build process can mutate a workspace.
          git archive --format=tar --prefix=./ "$WORKFLOW_SHA" \
            | gzip -n > "$control_plane_dir/$release_bundle"
          printf 'deploy_sha=%s\ndeploy_tree=%s\nrelease_id=%s\nbuild_attempt=%s\n' \
            "$deploy_sha" "$deploy_tree" "$release_id" "$GITHUB_RUN_ATTEMPT" \
            > "$control_plane_dir/$control_plane_identity"
          (
            cd "$control_plane_dir"
            sha256sum "$release_bundle" "$control_plane_identity" > "$control_plane_manifest"
            sha256sum --check "$control_plane_manifest"
          )
          control_plane_sha256=$(sha256sum "$control_plane_dir/$release_bundle" | awk '{print $1}')

          for release_distance in 1 2; do
            previous_sha=$(git rev-parse "${deploy_sha}~${release_distance}^{commit}")
            previous_archive="rulepilot-frontend-${release_id}-previous-${release_distance}.tar.gz"
            git archive --format=tar --prefix=./ "$previous_sha" -- frontend \
              | gzip -n > "$frontend_history_dir/$previous_archive"
          done
          (
            cd "$frontend_history_dir"
            sha256sum rulepilot-frontend-*.tar.gz > frontend-history.sha256
            sha256sum --check frontend-history.sha256
          )

          printf 'deploy_sha=%s\ndeploy_tree=%s\nrelease_id=%s\nbuild_attempt=%s\ncontrol_plane_sha256=%s\n' \
            "$deploy_sha" "$deploy_tree" "$release_id" "$GITHUB_RUN_ATTEMPT" \
            "$control_plane_sha256" >> "$GITHUB_OUTPUT"

      - name: Publish the sealed production control plane
        uses: actions/upload-artifact@v7
        with:
          name: rulepilot-control-plane-${{ steps.release_identity.outputs.release_id }}
          path: ${{ runner.temp }}/rulepilot-control-plane
          if-no-files-found: error
          retention-days: 1

      - name: Publish sealed prior-frontend build inputs
        uses: actions/upload-artifact@v7
        with:
          name: rulepilot-frontend-history-${{ steps.release_identity.outputs.release_id }}
          path: ${{ runner.temp }}/rulepilot-frontend-history
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build immutable RulePilot runtime images
    needs: seal_source
    if: needs.seal_source.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CONTROL_PLANE_SHA256: ${{ needs.seal_source.outputs.control_plane_sha256 }}
      DEPLOY_BUILD_ATTEMPT: ${{ needs.seal_source.outputs.build_attempt }}
      DEPLOY_RELEASE_ID: ${{ needs.seal_source.outputs.release_id }}
      DEPLOY_SHA: ${{ needs.seal_source.outputs.deploy_sha }}
      DEPLOY_TREE: ${{ needs.seal_source.outputs.deploy_tree }}
    steps:
      - name: Download the sealed control plane into runner-temporary storage
        uses: actions/download-artifact@v8
        with:
          name: rulepilot-control-plane-${{ needs.seal_source.outputs.release_id }}
          path: ${{ runner.temp }}/rulepilot-sealed-control-plane

      - name: Download sealed prior-frontend build inputs
        uses: actions/download-artifact@v8
        with:
          name: rulepilot-frontend-history-${{ needs.seal_source.outputs.release_id }}
          path: ${{ runner.temp }}/rulepilot-frontend-history

      - name: Verify and extract an isolated sealed source copy
        shell: bash
        run: |
          set -Eeuo pipefail
          control_plane_dir="$RUNNER_TEMP/rulepilot-sealed-control-plane"
          frontend_history_dir="$RUNNER_TEMP/rulepilot-frontend-history"
          source_root="$RUNNER_TEMP/rulepilot-build-source"
          release_bundle="rulepilot-release-${DEPLOY_RELEASE_ID}.tar.gz"
          release_tar="$RUNNER_TEMP/rulepilot-release-${DEPLOY_RELEASE_ID}.tar"
          control_plane_identity="rulepilot-control-plane-${DEPLOY_RELEASE_ID}.identity"
          control_plane_manifest="rulepilot-control-plane-${DEPLOY_RELEASE_ID}.sha256"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROL_PLANE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEPLOY_BUILD_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEPLOY_RELEASE_ID" == "${DEPLOY_SHA}-${GITHUB_RUN_ID}-${DEPLOY_BUILD_ATTEMPT}" ]]
          for sealed_file in "$release_bundle" "$control_plane_identity" "$control_plane_manifest"; do
            test -f "$control_plane_dir/$sealed_file" && test ! -L "$control_plane_dir/$sealed_file"
          done
          [[ "$(find "$control_plane_dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" == 3 ]]
          (
            cd "$control_plane_dir"
            sha256sum --check "$control_plane_manifest"
          )
          actual_control_plane_sha256=$(sha256sum "$control_plane_dir/$release_bundle" | awk '{print $1}')
          [[ "$actual_control_plane_sha256" == "$CONTROL_PLANE_SHA256" ]]
          test ! -e "$release_tar" && test ! -L "$release_tar"
          gzip -dc "$control_plane_dir/$release_bundle" > "$release_tar"
          archive_commit=$(git get-tar-commit-id < "$release_tar")
          [[ "$archive_commit" == "$DEPLOY_SHA" ]]
          expected_identity=$(printf 'deploy_sha=%s\ndeploy_tree=%s\nrelease_id=%s\nbuild_attempt=%s' \
            "$DEPLOY_SHA" "$DEPLOY_TREE" "$DEPLOY_RELEASE_ID" "$DEPLOY_BUILD_ATTEMPT")
          [[ "$(<"$control_plane_dir/$control_plane_identity")" == "$expected_identity" ]]
          test -f "$frontend_history_dir/frontend-history.sha256"
          test ! -L "$frontend_history_dir/frontend-history.sha256"
          [[ "$(find "$frontend_history_dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" == 3 ]]
          (
            cd "$frontend_history_dir"
            sha256sum --check frontend-history.sha256
          )
          test ! -e "$source_root"
          mkdir -p "$source_root"
          tar -xf "$release_tar" -C "$source_root"
          printf 'RULEPILOT_BUILD_SOURCE=%s\n' "$source_root" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build immutable deployment artifacts
        run: |
          ./mvnw -q -DskipTests package
        working-directory: ${{ runner.temp }}/rulepilot-build-source/backend

      - name: Build immutable backend runtime image
        shell: bash
        run: |
          set -Eeuo pipefail
          backend_image="rulepilot-backend:${DEPLOY_RELEASE_ID}"
          backend_image_archive="rulepilot-backend-${DEPLOY_RELEASE_ID}.tar.gz"
          docker build \
            --file "$RULEPILOT_BUILD_SOURCE/backend/Dockerfile.runtime" \
            --tag "$backend_image" \
            "$RULEPILOT_BUILD_SOURCE/backend"
          docker image inspect "$backend_image" >/dev/null
          artifact_dir="$RUNNER_TEMP/rulepilot-release-artifacts"
          mkdir -p "$artifact_dir"
          docker save "$backend_image" | gzip -1 > "$artifact_dir/$backend_image_archive"
          test -s "$artifact_dir/$backend_image_archive"
          (cd "$artifact_dir" && sha256sum "$backend_image_archive" > "${backend_image_archive}.sha256")
          sha256sum "$artifact_dir/$backend_image_archive"

      - name: Build frontend artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run build
          previous_build_roots=()
          cleanup_previous_builds() {
            for previous_root in "${previous_build_roots[@]}"; do
              if [[ "$previous_root" == "$RUNNER_TEMP"/rulepilot-previous-frontend.* ]]; then
                rm -rf -- "$previous_root"
              fi
            done
          }
          trap cleanup_previous_builds EXIT
          for release_distance in 1 2; do
            previous_root=$(mktemp -d "$RUNNER_TEMP/rulepilot-previous-frontend.XXXXXX")
            previous_build_roots+=("$previous_root")
            previous_archive="$RUNNER_TEMP/rulepilot-frontend-history/rulepilot-frontend-${DEPLOY_RELEASE_ID}-previous-${release_distance}.tar.gz"
            test -f "$previous_archive" && test ! -L "$previous_archive"
            tar -xzf "$previous_archive" -C "$previous_root"
            (
              cd "$previous_root/frontend"
              npm ci --prefer-offline --no-audit --no-fund
              npm run build
            )
            bash "$RULEPILOT_BUILD_SOURCE/scripts/retain-frontend-release-assets.sh" \
              dist/assets \
              "$previous_root/frontend/dist/assets"
          done
        working-directory: ${{ runner.temp }}/rulepilot-build-source/frontend

      - name: Build immutable frontend runtime image
        shell: bash
        run: |
          set -Eeuo pipefail
          frontend_image="rulepilot-frontend:${DEPLOY_RELEASE_ID}"
          frontend_image_archive="rulepilot-frontend-${DEPLOY_RELEASE_ID}.tar.gz"
          artifact_dir="$RUNNER_TEMP/rulepilot-release-artifacts"
          mkdir -p "$artifact_dir"
          docker build \
            --file "$RULEPILOT_BUILD_SOURCE/frontend/Dockerfile.runtime" \
            --tag "$frontend_image" \
            "$RULEPILOT_BUILD_SOURCE/frontend"
          docker image inspect "$frontend_image" >/dev/null
          docker save "$frontend_image" | gzip -1 > "$artifact_dir/$frontend_image_archive"
          test -s "$artifact_dir/$frontend_image_archive"
          (cd "$artifact_dir" && sha256sum "$frontend_image_archive" > "${frontend_image_archive}.sha256")
          sha256sum "$artifact_dir/$frontend_image_archive"

      - name: Verify the exact runtime artifact set
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="$RUNNER_TEMP/rulepilot-release-artifacts"
          backend_image_archive="rulepilot-backend-${DEPLOY_RELEASE_ID}.tar.gz"
          frontend_image_archive="rulepilot-frontend-${DEPLOY_RELEASE_ID}.tar.gz"
          (
            cd "$artifact_dir"
            sha256sum \
              "rulepilot-backend-${DEPLOY_RELEASE_ID}.tar.gz" \
              "rulepilot-frontend-${DEPLOY_RELEASE_ID}.tar.gz" \
              > release-artifacts.sha256
            sha256sum --check release-artifacts.sha256
            sha256sum --check "${backend_image_archive}.sha256"
            sha256sum --check "${frontend_image_archive}.sha256"
          )
          [[ "$(find "$artifact_dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" == 5 ]]

      - name: Publish immutable runtime artifacts for the isolated deploy runner
        uses: actions/upload-artifact@v7
        with:
          name: rulepilot-release-${{ needs.seal_source.outputs.release_id }}
          path: ${{ runner.temp }}/rulepilot-release-artifacts
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy RulePilot from verified artifacts
    needs: [seal_source, build]
    if: needs.seal_source.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
    env:
      CONTROL_PLANE_SHA256: ${{ needs.seal_source.outputs.control_plane_sha256 }}
      DEPLOY_SHA: ${{ needs.seal_source.outputs.deploy_sha }}
      DEPLOY_TREE: ${{ needs.seal_source.outputs.deploy_tree }}
      DEPLOY_RELEASE_ID: ${{ needs.seal_source.outputs.release_id }}
      DEPLOY_BUILD_ATTEMPT: ${{ needs.seal_source.outputs.build_attempt }}
    steps:
      - name: Download the sealed production control plane on a fresh runner
        uses: actions/download-artifact@v8
        with:
          name: rulepilot-control-plane-${{ needs.seal_source.outputs.release_id }}
          path: ${{ runner.temp }}/rulepilot-sealed-control-plane

      - name: Download immutable release artifacts on a fresh runner
        uses: actions/download-artifact@v8
        with:
          name: rulepilot-release-${{ needs.seal_source.outputs.release_id }}
          path: ${{ runner.temp }}/rulepilot-runtime-artifacts

      - name: Verify the exact artifact set before production authority exists
        shell: bash
        run: |
          set -Eeuo pipefail
          control_plane_dir="$RUNNER_TEMP/rulepilot-sealed-control-plane"
          runtime_artifact_dir="$RUNNER_TEMP/rulepilot-runtime-artifacts"
          release_bundle="rulepilot-release-${DEPLOY_RELEASE_ID}.tar.gz"
          release_tar="$RUNNER_TEMP/rulepilot-release-${DEPLOY_RELEASE_ID}.tar"
          control_plane_identity="rulepilot-control-plane-${DEPLOY_RELEASE_ID}.identity"
          control_plane_manifest="rulepilot-control-plane-${DEPLOY_RELEASE_ID}.sha256"
          backend_image_archive="rulepilot-backend-${DEPLOY_RELEASE_ID}.tar.gz"
          frontend_image_archive="rulepilot-frontend-${DEPLOY_RELEASE_ID}.tar.gz"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROL_PLANE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEPLOY_BUILD_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          # A "re-run failed jobs" deployment consumes the successful build artifact from its original attempt.
          # Bind identity to that artifact-producing attempt, not the newer deploy-only runner attempt.
          [[ "$DEPLOY_RELEASE_ID" == "${DEPLOY_SHA}-${GITHUB_RUN_ID}-${DEPLOY_BUILD_ATTEMPT}" ]]
          for control_plane_file in \
            "$release_bundle" \
            "$control_plane_identity" \
            "$control_plane_manifest"; do
            test -f "$control_plane_dir/$control_plane_file" \
              && test ! -L "$control_plane_dir/$control_plane_file"
          done
          for runtime_artifact in \
            "$backend_image_archive" \
            "${backend_image_archive}.sha256" \
            "$frontend_image_archive" \
            "${frontend_image_archive}.sha256" \
            release-artifacts.sha256; do
            test -f "$runtime_artifact_dir/$runtime_artifact" \
              && test ! -L "$runtime_artifact_dir/$runtime_artifact"
          done
          [[ "$(find "$control_plane_dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" == 3 ]]
          [[ "$(find "$runtime_artifact_dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" == 5 ]]
          (
            cd "$control_plane_dir"
            sha256sum --check "$control_plane_manifest"
          )
          (
            cd "$runtime_artifact_dir"
            sha256sum --check release-artifacts.sha256
            sha256sum --check "${backend_image_archive}.sha256"
            sha256sum --check "${frontend_image_archive}.sha256"
          )
          actual_control_plane_sha256=$(sha256sum "$control_plane_dir/$release_bundle" | awk '{print $1}')
          [[ "$actual_control_plane_sha256" == "$CONTROL_PLANE_SHA256" ]]
          test ! -e "$release_tar" && test ! -L "$release_tar"
          gzip -dc "$control_plane_dir/$release_bundle" > "$release_tar"
          archive_commit=$(git get-tar-commit-id < "$release_tar")
          [[ "$archive_commit" == "$DEPLOY_SHA" ]]
          expected_identity=$(printf 'deploy_sha=%s\ndeploy_tree=%s\nrelease_id=%s\nbuild_attempt=%s' \
            "$DEPLOY_SHA" "$DEPLOY_TREE" "$DEPLOY_RELEASE_ID" "$DEPLOY_BUILD_ATTEMPT")
          [[ "$(<"$control_plane_dir/$control_plane_identity")" == "$expected_identity" ]]

      - name: Configure production SSH trust
        id: configure_ssh
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          for required_secret in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY DEPLOY_USER; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required production deployment secret: ${required_secret}" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload release bundle
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_SSH_PORT" \
            "$RUNNER_TEMP/rulepilot-sealed-control-plane/rulepilot-release-${DEPLOY_RELEASE_ID}.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/rulepilot-${DEPLOY_RELEASE_ID}.tar.gz"

      - name: Upload immutable backend and frontend runtime images
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          backend_image_archive="rulepilot-backend-${DEPLOY_RELEASE_ID}.tar.gz"
          frontend_image_archive="rulepilot-frontend-${DEPLOY_RELEASE_ID}.tar.gz"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_SSH_PORT" \
            "$RUNNER_TEMP/rulepilot-runtime-artifacts/$backend_image_archive" \
            "$RUNNER_TEMP/rulepilot-runtime-artifacts/${backend_image_archive}.sha256" \
            "$RUNNER_TEMP/rulepilot-runtime-artifacts/$frontend_image_archive" \
            "$RUNNER_TEMP/rulepilot-runtime-artifacts/${frontend_image_archive}.sha256" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"

      - name: Preserve the exact rollback checkpoint
        id: rollback_checkpoint
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          qualified_main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          [[ "$qualified_main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$qualified_main_sha" == "$DEPLOY_SHA" ]] || {
            echo "Candidate release is no longer the current qualified main revision" >&2
            exit 1
          }
          previous_release_id=$(ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" "$DEPLOY_RELEASE_ID" "$qualified_main_sha" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$(readlink -f "$1")
          release_id=$2
          qualified_main_sha=$3
          if [[ ! "$release_id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]; then
            echo "Rollback checkpoint release coordinate is invalid" >&2
            exit 1
          fi
          archive="/tmp/rulepilot-${release_id}.tar.gz"
          guard_dir="${application_root}/deployment-guards/${release_id}"
          guard_script="${guard_dir}/production-release-guard.sh"
          temporary_guard=$(mktemp "/tmp/rulepilot-release-guard.${release_id}.XXXXXX")
          cleanup_guard() {
            rm -f "$temporary_guard"
          }
          trap cleanup_guard EXIT
          test -f "$archive"
          tar -xOf "$archive" ./scripts/production-release-guard.sh > "$temporary_guard"
          bash -n "$temporary_guard"
          install -d -m 0700 "$guard_dir"
          install -m 0755 "$temporary_guard" "$guard_script"
          previous_release_id=$("$guard_script" checkpoint "$application_root" "$release_id" "$qualified_main_sha")
          printf '%s\n' "$previous_release_id"
          REMOTE
          )
          if [[ ! "$previous_release_id" =~ ^[0-9a-f]{40}-[0-9]+(-[0-9]+)?$ ]]; then
            echo "Rollback checkpoint did not return an immutable release id" >&2
            exit 1
          fi
          printf 'DEPLOY_PREVIOUS_RELEASE_ID=%s\n' "$previous_release_id" >> "$GITHUB_ENV"

      - name: Synchronize protected integration credentials and managed runtime configuration
        id: synchronize_runtime
        shell: bash
        env:
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
          DOCLING_API_KEY: ${{ secrets.DOCLING_API_KEY }}
          DOCLING_SERVICE_URL: ${{ secrets.DOCLING_SERVICE_URL }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$BGG_API_TOKEN" ]]; then
            echo "Missing required production integration secret: BGG_API_TOKEN" >&2
            exit 1
          fi
          if (( ${#BGG_API_TOKEN} > 4096 )) || [[ ! "$BGG_API_TOKEN" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "BGG_API_TOKEN has an invalid format" >&2
            exit 1
          fi
          if [[ -n "$DOCLING_SERVICE_URL" || -n "$DOCLING_API_KEY" ]]; then
            if [[ -z "$DOCLING_SERVICE_URL" || ${#DOCLING_SERVICE_URL} -gt 2048
              || ! "$DOCLING_SERVICE_URL" =~ ^https://[A-Za-z0-9][A-Za-z0-9./:_?\&=%+-]*$ ]]; then
              echo "DOCLING_SERVICE_URL has an invalid format" >&2
              exit 1
            fi
            if [[ -z "$DOCLING_API_KEY" || ${#DOCLING_API_KEY} -gt 4096
              || ! "$DOCLING_API_KEY" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "DOCLING_API_KEY has an invalid format" >&2
              exit 1
            fi
          fi

          local_token_file="$RUNNER_TEMP/rulepilot-bgg-token-${DEPLOY_RELEASE_ID}"
          remote_token_file="/tmp/rulepilot-bgg-token-${DEPLOY_RELEASE_ID}"
          local_docling_url_file="$RUNNER_TEMP/rulepilot-docling-url-${DEPLOY_RELEASE_ID}"
          remote_docling_url_file="/tmp/rulepilot-docling-url-${DEPLOY_RELEASE_ID}"
          local_docling_key_file="$RUNNER_TEMP/rulepilot-docling-key-${DEPLOY_RELEASE_ID}"
          remote_docling_key_file="/tmp/rulepilot-docling-key-${DEPLOY_RELEASE_ID}"
          cleanup_local() {
            rm -f "$local_token_file" "$local_docling_url_file" "$local_docling_key_file"
          }
          trap cleanup_local EXIT
          umask 077
          printf '%s' "$BGG_API_TOKEN" > "$local_token_file"
          printf '%s' "$DOCLING_SERVICE_URL" > "$local_docling_url_file"
          printf '%s' "$DOCLING_API_KEY" > "$local_docling_key_file"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_SSH_PORT" \
            "$local_token_file" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_token_file}"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_SSH_PORT" \
            "$local_docling_url_file" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_docling_url_file}"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_SSH_PORT" \
            "$local_docling_key_file" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_docling_key_file}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- \
              "$DEPLOY_PATH" \
              "$remote_token_file" \
              "$remote_docling_url_file" \
              "$remote_docling_key_file" \
              "$DEPLOY_RELEASE_ID" \
              "$DEPLOY_PREVIOUS_RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$1
          token_file=$2
          docling_url_file=$3
          docling_key_file=$4
          release_id=$5
          previous_release_id=$6
          if [[ ! "$release_id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$
            || ! "$previous_release_id" =~ ^[0-9a-f]{40}-[0-9]+(-[0-9]+)?$ ]]; then
            echo "Runtime synchronization release coordinates are invalid" >&2
            exit 1
          fi
          env_file="${application_root}/.env"
          temporary_env="${application_root}/.env.${GITHUB_RUN_ID:-sync}.tmp"
          guard_script="${application_root}/deployment-guards/${release_id}/production-release-guard.sh"
          cleanup_remote() {
            rm -f "$token_file" "$docling_url_file" "$docling_key_file" "$temporary_env"
          }
          trap cleanup_remote EXIT

          test -f "$env_file"
          test -f "$token_file"
          test -f "$docling_url_file"
          test -f "$docling_key_file"
          chmod 600 "$token_file"
          chmod 600 "$docling_url_file" "$docling_key_file"
          token=$(<"$token_file")
          if [[ -z "$token" ]] || (( ${#token} > 4096 )) || [[ ! "$token" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Uploaded BGG credential has an invalid format" >&2
            exit 1
          fi
          docling_service_url=$(<"$docling_url_file")
          docling_api_key=$(<"$docling_key_file")
          docling_enabled=false
          if [[ -n "$docling_service_url" || -n "$docling_api_key" ]]; then
            if [[ -z "$docling_service_url" || ${#docling_service_url} -gt 2048
              || ! "$docling_service_url" =~ ^https://[A-Za-z0-9][A-Za-z0-9./:_?\&=%+-]*$ ]]; then
              echo "Uploaded Docling service URL has an invalid format" >&2
              exit 1
            fi
            if [[ -z "$docling_api_key" || ${#docling_api_key} -gt 4096
              || ! "$docling_api_key" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Uploaded Docling credential has an invalid format" >&2
              exit 1
            fi
            docling_enabled=true
          fi

          # Arm under the deployment lock before the first shared-environment mutation. If the runner disappears
          # before activation, the independent watchdog can restore the checkpoint as soon as this lock is released.
          test -x "$guard_script"
          exec 9>"${application_root}/deployment.lock"
          flock -x 9
          "$guard_script" arm "$application_root" "$release_id" "$previous_release_id"

          umask 077
          found=false
          qwen_enabled=false
          qwen_key_present=false
          deepseek_enabled=false
          deepseek_key_present=false
          model_credential_key_present=false
          managed_runtime_keys=' DOCLING_ENABLED DOCLING_SERVICE_URL DOCLING_API_KEY DOCLING_TIMEOUT DOCLING_POLL_INTERVAL DOCLING_MAX_FILE_BYTES DOCLING_MAX_RESULT_BYTES EMBEDDING_PROVIDER TEACHING_PROVIDER TEACHING_MODEL_PROVIDER TEACHING_AGENT_MAX_WORKLOAD_TIMEOUT TEACHING_AGENT_MAX_WORKLOAD_TOKENS TEACHING_OUTLINE_SHARD_PARALLELISM VISUAL_PROVIDER VISUAL_MODEL_PROVIDER ANSWER_PROVIDER ANSWER_MODEL_PROVIDER DEEPSEEK_GENERATION_THINKING AGENT_TIMEOUT BGG_TRANSLATION_ENABLED BGG_TRANSLATION_TIMEOUT BGG_TRANSLATION_CACHE_TTL BGG_TRANSLATION_HOURLY_LIMIT BGG_TRANSLATION_PROVIDER_CONCURRENCY BGG_CACHE_PREWARM_ENABLED BGG_CACHE_PREWARM_GAME_COUNT BGG_CACHE_MAXIMUM_ENTRIES BGG_CACHE_MAXIMUM_BYTES BGG_CACHE_PREWARM_COHORT_SIZE BGG_CACHE_PREWARM_TRANSLATION_COHORT_SIZE BGG_CACHE_PREWARM_RESUME_DELAY BGG_CACHE_PREWARM_LEASE_DURATION BGG_RECOMMENDATION_PROVIDER BGG_RECOMMENDATION_MODEL_PROVIDER BGG_RECOMMENDATION_MODEL BGG_RECOMMENDATION_PUBLICATION_MODEL BGG_RECOMMENDATION_HEDGE_DELAY BGG_RECOMMENDATION_MODEL_CANDIDATE_LIMIT BGG_RECOMMENDATION_MAX_OUTPUT_TOKENS BGG_RECOMMENDATION_AGENT_TIMEOUT BGG_RECOMMENDATION_TEMPERATURE BGG_RECOMMENDATION_WEB_RESEARCH_ENABLED BGG_RECOMMENDATION_WEB_RESEARCH_TIMEOUT WEB_SEARCH_MODEL QWEN_MODEL QWEN_VISION_CAPABLE RULEBOOK_DISCOVERY_MODEL RULEBOOK_DISCOVERY_NEGATIVE_CACHE_TTL RULEBOOK_DISCOVERY_HOURLY_LIMIT RULEBOOK_DISCOVERY_PROVIDER_CONCURRENCY PRODUCTION_TRACING_EXPORT_OTLP_ENABLED PRODUCTION_TRACING_OTLP_ENDPOINT PRODUCTION_TRACING_SAMPLING_PROBABILITY '
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ "$line" == BGG_API_TOKEN=* ]]; then
              printf 'BGG_API_TOKEN=%s\n' "$token"
              found=true
            elif [[ "$line" == QWEN_ENABLED=true ]]; then
              printf '%s\n' "$line"
              qwen_enabled=true
            elif [[ "$line" == QWEN_API_KEY=* ]]; then
              printf '%s\n' "$line"
              [[ -n "${line#QWEN_API_KEY=}" ]] && qwen_key_present=true
            elif [[ "$line" == DEEPSEEK_ENABLED=true ]]; then
              printf '%s\n' "$line"
              deepseek_enabled=true
            elif [[ "$line" == DEEPSEEK_API_KEY=* ]]; then
              printf '%s\n' "$line"
              [[ -n "${line#DEEPSEEK_API_KEY=}" ]] && deepseek_key_present=true
            elif [[ "$line" == MODEL_CREDENTIAL_ENCRYPTION_KEY=* ]]; then
              printf '%s\n' "$line"
              [[ -n "${line#MODEL_CREDENTIAL_ENCRYPTION_KEY=}" ]] && model_credential_key_present=true
            elif [[ "$managed_runtime_keys" == *" ${line%%=*} "* ]]; then
              continue
            else
              printf '%s\n' "$line"
            fi
          done < "$env_file" > "$temporary_env"
          if [[ "$found" == false ]]; then
            printf 'BGG_API_TOKEN=%s\n' "$token" >> "$temporary_env"
          fi
          if [[ "$qwen_enabled" != true || "$qwen_key_present" != true ]]; then
            echo "Production Qwen configuration is required for recommendation, teaching, visual evidence, and answers" >&2
            exit 1
          fi
          if [[ "$deepseek_enabled" != true || "$deepseek_key_present" != true ]]; then
            echo "Production DeepSeek configuration is required for persistent Chinese catalog translations" >&2
            exit 1
          fi
          if [[ "$model_credential_key_present" != true ]]; then
            printf 'MODEL_CREDENTIAL_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32 | tr -d '\n')" >> "$temporary_env"
          fi
          printf 'DOCLING_SERVICE_URL=%s\n' "$docling_service_url" >> "$temporary_env"
          printf 'DOCLING_API_KEY=%s\n' "$docling_api_key" >> "$temporary_env"
          printf 'DOCLING_ENABLED=%s\n' "$docling_enabled" >> "$temporary_env"
          printf '%s\n' \
            'DOCLING_TIMEOUT=PT5M' \
            'DOCLING_POLL_INTERVAL=PT1S' \
            'DOCLING_MAX_FILE_BYTES=104857600' \
            'DOCLING_MAX_RESULT_BYTES=33554432' \
            'EMBEDDING_PROVIDER=qwen' \
            'TEACHING_PROVIDER=spring-ai' \
            'TEACHING_MODEL_PROVIDER=deepseek' \
            'TEACHING_AGENT_MAX_WORKLOAD_TIMEOUT=PT16H' \
            'TEACHING_AGENT_MAX_WORKLOAD_TOKENS=16000000' \
            'TEACHING_OUTLINE_SHARD_PARALLELISM=10' \
            'VISUAL_PROVIDER=spring-ai' \
            'VISUAL_MODEL_PROVIDER=qwen' \
            'ANSWER_PROVIDER=spring-ai' \
            'ANSWER_MODEL_PROVIDER=qwen' \
            'DEEPSEEK_GENERATION_THINKING=false' \
            'AGENT_TIMEOUT=PT2M' \
            'BGG_TRANSLATION_ENABLED=true' \
            'BGG_TRANSLATION_TIMEOUT=PT20S' \
            'BGG_TRANSLATION_CACHE_TTL=P30D' \
            'BGG_TRANSLATION_HOURLY_LIMIT=60' \
            'BGG_TRANSLATION_PROVIDER_CONCURRENCY=2' \
            'BGG_CACHE_PREWARM_ENABLED=true' \
            'BGG_CACHE_PREWARM_GAME_COUNT=10000' \
            'BGG_CACHE_MAXIMUM_ENTRIES=20000' \
            'BGG_CACHE_MAXIMUM_BYTES=268435456' \
            'BGG_CACHE_PREWARM_COHORT_SIZE=500' \
            'BGG_CACHE_PREWARM_TRANSLATION_COHORT_SIZE=60' \
            'BGG_CACHE_PREWARM_RESUME_DELAY=PT1H' \
            'BGG_CACHE_PREWARM_LEASE_DURATION=PT30M' \
            'BGG_RECOMMENDATION_PROVIDER=spring-ai' \
            'BGG_RECOMMENDATION_MODEL_PROVIDER=qwen' \
            'BGG_RECOMMENDATION_MODEL=qwen3.7-plus' \
            'BGG_RECOMMENDATION_PUBLICATION_MODEL=qwen3.7-plus' \
            'BGG_RECOMMENDATION_HEDGE_DELAY=PT2S' \
            'BGG_RECOMMENDATION_MODEL_CANDIDATE_LIMIT=8' \
            'BGG_RECOMMENDATION_MAX_OUTPUT_TOKENS=2000' \
            'BGG_RECOMMENDATION_TEMPERATURE=0.0' \
            'BGG_RECOMMENDATION_WEB_RESEARCH_ENABLED=true' \
            'BGG_RECOMMENDATION_WEB_RESEARCH_TIMEOUT=PT5S' \
            'WEB_SEARCH_MODEL=qwen3.8-flash' \
            'QWEN_MODEL=qwen3.7-plus' \
            'QWEN_VISION_CAPABLE=true' \
            'RULEBOOK_DISCOVERY_MODEL=qwen3.7-max' \
            'RULEBOOK_DISCOVERY_NEGATIVE_CACHE_TTL=PT10M' \
            'RULEBOOK_DISCOVERY_HOURLY_LIMIT=30' \
            'RULEBOOK_DISCOVERY_PROVIDER_CONCURRENCY=1' \
            'PRODUCTION_TRACING_EXPORT_OTLP_ENABLED=true' \
            'PRODUCTION_TRACING_OTLP_ENDPOINT=http://tempo:4318/v1/traces' \
            'PRODUCTION_TRACING_SAMPLING_PROBABILITY=0.05' >> "$temporary_env"
          chmod 600 "$temporary_env"
          mv "$temporary_env" "$env_file"
          unset token docling_service_url docling_api_key docling_enabled
          echo "Synchronized managed production integration configuration."
          REMOTE

      - name: Remove staged integration credentials
        if: always() && steps.configure_ssh.outcome == 'success'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          release_id=$1
          if [[ ! "$release_id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]; then
            echo "Staged credential release coordinate is invalid" >&2
            exit 1
          fi
          rm -f -- \
            "/tmp/rulepilot-bgg-token-${release_id}" \
            "/tmp/rulepilot-docling-url-${release_id}" \
            "/tmp/rulepilot-docling-key-${release_id}"
          REMOTE

      - name: Activate release and verify production health
        id: activate_release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" "$DEPLOY_RELEASE_ID" "$DEPLOY_PREVIOUS_RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$1
          release_id=$2
          previous_release_id=$3
          if [[ ! "$release_id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$
            || ! "$previous_release_id" =~ ^[0-9a-f]{40}-[0-9]+(-[0-9]+)?$ ]]; then
            echo "Activation release coordinates are invalid" >&2
            exit 1
          fi
          archive="/tmp/rulepilot-${release_id}.tar.gz"
          backend_image="rulepilot-backend:${release_id}"
          backend_image_filename="rulepilot-backend-${release_id}.tar.gz"
          backend_image_archive="/tmp/${backend_image_filename}"
          backend_image_checksum="${backend_image_archive}.sha256"
          frontend_image="rulepilot-frontend:${release_id}"
          frontend_image_filename="rulepilot-frontend-${release_id}.tar.gz"
          frontend_image_archive="/tmp/${frontend_image_filename}"
          frontend_image_checksum="${frontend_image_archive}.sha256"
          releases_root="${application_root}/releases"
          release_dir="${application_root}/releases/${release_id}"
          guard_script="${application_root}/deployment-guards/${release_id}/production-release-guard.sh"
          test -x "$guard_script"
          exec 9>"${application_root}/deployment.lock"
          flock -x 9
          # The watchdog may have completed a rollback while the runner was between SSH sessions. Re-enter the
          # transaction fail-closed before touching releases, images, services, or the current pointer.
          "$guard_script" assert-activation-held \
            "$application_root" "$release_id" "$previous_release_id"
          # The release pointer is part of the guarded deployment transaction. Read it only after taking the same
          # server lock used by checkpoint, watchdog rollback, activation, and commit.
          current_release=$(readlink -f "${application_root}/current" 2>/dev/null || true)

          safe_container_state() {
            docker inspect --format \
              'container={{.Id}} status={{.State.Status}} running={{.State.Running}} restartCount={{.RestartCount}} oomKilled={{.State.OOMKilled}} exit={{.State.ExitCode}} error={{json .State.Error}} startedAt={{.State.StartedAt}} finishedAt={{.State.FinishedAt}} health={{with index .State "Health"}}{{.Status}}{{else}}not-configured{{end}}' \
              "$1" || true
          }

          diagnose_failure() {
            status=$?
            trap - ERR
            echo "Production activation failed; collecting safe diagnostics." >&2
            cd "${release_dir}" 2>/dev/null || cd "${application_root}/current"
            echo "Production container state at the failure boundary:"
            for service in postgres redis rabbitmq minio api worker frontend gateway; do
              service_container=$(docker compose --env-file .env \
                -f infra/compose.yml \
                -f infra/compose.deployment.yml \
                -f infra/compose.production.yml ps -q "$service" 2>/dev/null || true)
              if [[ -n "$service_container" ]]; then
                printf 'service=%s ' "$service"
                safe_container_state "$service_container"
              else
                printf 'service=%s container=missing\n' "$service"
              fi
            done
            echo "Production filesystem usage:"
            df -h "${application_root}" || true
            echo "Production directory usage:"
            du -x -h --max-depth=1 "${application_root}" /var/lib/docker /var/log 2>/dev/null | sort -h || true
            echo "Production Docker usage:"
            docker system df || true
            echo "Production container status:"
            docker compose --env-file .env \
              -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml ps --all || true
            if [[ -n "$current_release" && -d "$current_release" && -f "${current_release}/.env" ]]; then
              echo "Restoring the complete current release after failed activation."
              if "$guard_script" rollback-held \
                "$application_root" "$release_id" "$previous_release_id"; then
                echo "Restored the immutable frontend and backend checkpoint."
              else
                echo "Automatic current-release service restoration failed." >&2
              fi
            fi
            exit "$status"
          }
          trap diagnose_failure ERR

          test -f "${application_root}/.env"
          test -f "$archive"
          test -f "$backend_image_archive"
          test -f "$backend_image_checksum"
          test -f "$frontend_image_archive"
          test -f "$frontend_image_checksum"
          deploy_sha=${release_id%%-*}
          find /tmp -maxdepth 1 -type f -name "rulepilot-${deploy_sha}-*.tar.gz" \
            ! -path "$archive" -delete
          find /tmp -maxdepth 1 -type f -name "rulepilot-backend-${deploy_sha}-*.tar.gz*" \
            ! -path "$backend_image_archive" \
            ! -path "$backend_image_checksum" -delete
          find /tmp -maxdepth 1 -type f -name "rulepilot-frontend-${deploy_sha}-*.tar.gz*" \
            ! -path "$frontend_image_archive" \
            ! -path "$frontend_image_checksum" -delete
          install -d -m 0755 "$releases_root"
          removed_releases=0
          for candidate in "${releases_root}"/*; do
            [[ -d "$candidate" ]] || continue
            candidate_path=$(readlink -f "$candidate")
            [[ "$candidate_path" == "$current_release" ]] && continue
            [[ "$candidate_path" == "$release_dir" ]] && continue
            if [[ "$candidate_path" != "${releases_root}/"* ]]; then
              echo "Refusing to remove release outside ${releases_root}: ${candidate_path}" >&2
              exit 1
            fi
            rm -rf -- "$candidate_path"
            removed_releases=$((removed_releases + 1))
          done
          printf 'Reclaimed %d inactive release artifact(s); current release retained.\n' "$removed_releases"
          if [[ -n "$current_release" && -d "$current_release" && -f "${current_release}/.env" ]]; then
            echo "Ensuring the current release remains available while replacement images are prepared."
            cd "$current_release"
            RULEPILOT_RELEASE_ID="${current_release##*/}" docker compose --env-file .env \
              -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml up -d --no-build --no-deps api worker
          fi
          (cd /tmp && sha256sum --check "${backend_image_filename}.sha256")
          (cd /tmp && sha256sum --check "${frontend_image_filename}.sha256")
          gzip -dc "$backend_image_archive" | docker load
          gzip -dc "$frontend_image_archive" | docker load
          docker image inspect "$backend_image" >/dev/null
          docker image inspect "$frontend_image" >/dev/null
          install -d -m 0755 "${release_dir}"
          tar -xzf "${archive}" -C "${release_dir}"
          # A GitHub Actions rerun reuses the same release id and may resume after
          # extraction. Replace only this known deployment-owned symlink so the
          # activation remains safe and idempotent.
          ln -sfn "${application_root}/.env" "${release_dir}/.env"
          # The sealed Git control plane intentionally contains no build output. The prebuilt backend image makes
          # this directory content-free, but the existing launcher still validates its traversal permissions.
          install -d -m 0755 "${release_dir}/backend/target"

          cd "${release_dir}"
          # Candidate execution is limited to the installed release guard and the necessary production-up target;
          # production-up owns the single declarative Compose validation/start path for the sealed control plane.
          RULEPILOT_BACKEND_IMAGE="$backend_image" \
            RULEPILOT_FRONTEND_IMAGE="$frontend_image" \
            RULEPILOT_PREBUILT_BACKEND_IMAGE=true \
            RULEPILOT_PREBUILT_FRONTEND_IMAGE=true \
            make production-up

          frontend_container=$(docker compose --env-file .env \
            -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml ps -q frontend)
          test -n "$frontend_container"
          expected_frontend_image_id=$(docker image inspect --format '{{.Id}}' "$frontend_image")
          running_frontend_image_id=$(docker inspect --format '{{.Image}}' "$frontend_container")
          [[ "$running_frontend_image_id" == "$expected_frontend_image_id" ]]
          docker tag "$backend_image" rulepilot-backend:local
          docker tag "$frontend_image" rulepilot-frontend:local
          ln -sfn "${release_dir}" "${application_root}/current"
          "$guard_script" heartbeat "$application_root" "$release_id" "$previous_release_id"
          rm -f \
            "$archive" \
            "$backend_image_archive" \
            "$backend_image_checksum" \
            "$frontend_image_archive" \
            "$frontend_image_checksum"
          printf 'Activated production release %s\n' "${release_id}"
          docker image ls \
            --filter 'reference=rulepilot-backend:*' \
            --format '{{.Repository}}:{{.Tag}}' | while IFS= read -r candidate; do
            [[ "$candidate" == "$backend_image" ]] && continue
            [[ "$candidate" == "rulepilot-backend:local" ]] && continue
            [[ "$candidate" == "rulepilot-backend:${previous_release_id}" ]] && continue
            if [[ "$candidate" =~ ^rulepilot-backend:[0-9a-f]{40}-[0-9]+(-[0-9]+)?$ ]]; then
              docker image rm "$candidate" || \
                echo "Deferred removal of inactive backend image ${candidate}." >&2
            fi
          done
          docker image ls \
            --filter 'reference=rulepilot-frontend:*' \
            --format '{{.Repository}}:{{.Tag}}' | while IFS= read -r candidate; do
            [[ "$candidate" == "rulepilot-frontend:${release_id}" ]] && continue
            [[ "$candidate" == "rulepilot-frontend:local" ]] && continue
            [[ "$candidate" == "rulepilot-frontend:${previous_release_id}" ]] && continue
            if [[ "$candidate" =~ ^rulepilot-frontend:[0-9a-f]{40}-[0-9]+(-[0-9]+)?$ ]]; then
              docker image rm "$candidate" || \
                echo "Deferred removal of inactive frontend image ${candidate}." >&2
            fi
          done
          echo "Reclaiming stale Docker build cache and dangling images after activation."
          docker builder prune --force --filter "until=168h" || \
            echo "Deferred Docker build-cache cleanup after successful activation." >&2
          docker image prune --force || \
            echo "Deferred dangling-image cleanup after successful activation." >&2
          # A watchdog may already be waiting on this lock after a slow image cleanup. Refresh the lease as the
          # final locked mutation so its first post-lock recheck cannot roll back a healthy candidate.
          "$guard_script" heartbeat "$application_root" "$release_id" "$previous_release_id"
          REMOTE

      - name: Read bounded production preflight credentials and renew the rollback lease
        id: preflight_credentials
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          credential_file="$RUNNER_TEMP/rulepilot-production-preflight-credentials"
          cleanup_deploy_key() {
            rm -f "$HOME/.ssh/id_ed25519"
          }
          trap cleanup_deploy_key EXIT
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" "$DEPLOY_RELEASE_ID" "$DEPLOY_PREVIOUS_RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$(readlink -f "$1")
          release_id=$2
          previous_release_id=$3
          guard_script="${application_root}/deployment-guards/${release_id}/production-release-guard.sh"
          test -x "$guard_script"
          "$guard_script" heartbeat "$application_root" "$release_id" "$previous_release_id"
          REMOTE
          credentials=$(ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          env_file="$1/current/.env"
          read_value() {
            local key=$1 line value first_character last_character
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ "${line%%=*}" == "$key" ]] || continue
              value=${line#*=}
              if (( ${#value} >= 2 )); then
                first_character=${value:0:1}
                last_character=${value: -1}
                if [[ "$first_character" == "$last_character"
                  && ( "$first_character" == '"' || "$first_character" == "'" ) ]]; then
                  value=${value:1:${#value}-2}
                fi
              fi
              printf '%s' "$value"
              return 0
            done < "$env_file"
          }
          printf '%s\n%s\n' \
            "$(read_value RULEPILOT_USER_USERNAME)" \
            "$(read_value RULEPILOT_USER_PASSWORD)"
          REMOTE
          )
          mapfile -t credential_lines <<< "$credentials"
          preflight_username=${credential_lines[0]:-}
          preflight_password=${credential_lines[1]:-}
          test -n "$preflight_username"
          test -n "$preflight_password"
          echo "::add-mask::$preflight_username"
          echo "::add-mask::$preflight_password"
          umask 077
          printf '%s\n%s\n' "$preflight_username" "$preflight_password" > "$credential_file"
          printf 'RULEPILOT_PREFLIGHT_CREDENTIAL_FILE=%s\n' "$credential_file" >> "$GITHUB_ENV"
          unset preflight_username preflight_password credentials credential_lines
          cleanup_deploy_key
          trap - EXIT

      - name: Classify independent public observation without repository code or production SSH authority
        id: public_availability
        timeout-minutes: 2
        shell: bash
        env:
          RULEPILOT_PUBLIC_URL: https://rulepilot.cn
        run: |
          set -Eeuo pipefail
          test ! -e "$HOME/.ssh/id_ed25519"
          credential_file=${RULEPILOT_PREFLIGHT_CREDENTIAL_FILE:?}
          preflight_dir=$(mktemp -d "$RUNNER_TEMP/rulepilot-public-preflight.XXXXXX")
          cleanup_credentials() {
            rm -f "$credential_file"
            if [[ "$preflight_dir" == "$RUNNER_TEMP"/rulepilot-public-preflight.* ]]; then
              rm -rf -- "$preflight_dir"
            fi
          }
          trap cleanup_credentials EXIT
          mapfile -t credential_lines < "$credential_file"
          preflight_username=${credential_lines[0]:-}
          preflight_password=${credential_lines[1]:-}
          test -n "$preflight_username"
          test -n "$preflight_password"

          https_get() {
            local request_url=$1 body_path=$2 headers_path=${3:-}
            RULEPILOT_HTTPS_URL="$request_url" \
            RULEPILOT_HTTPS_BODY_PATH="$body_path" \
            RULEPILOT_HTTPS_HEADERS_PATH="$headers_path" \
            RULEPILOT_HTTPS_BASIC_USERNAME="${RULEPILOT_HTTPS_BASIC_USERNAME:-}" \
            RULEPILOT_HTTPS_BASIC_PASSWORD="${RULEPILOT_HTTPS_BASIC_PASSWORD:-}" \
            RULEPILOT_HTTPS_ACCEPT="${RULEPILOT_HTTPS_ACCEPT:-}" \
              python3 - <<'PY'
          import base64
          import http.client
          import os
          import signal
          import ssl
          import sys
          from urllib import error, parse, request

          TIMEOUT_SECONDS = 6
          MAX_RESPONSE_BYTES = 1024 * 1024

          def require_https_url(value):
              parsed = parse.urlsplit(value)
              if parsed.scheme != "https" or not parsed.hostname:
                  raise ValueError("only absolute HTTPS URLs are allowed")
              if parsed.username is not None or parsed.password is not None:
                  raise ValueError("URL credentials are not allowed")
              return parsed

          class RejectRedirectHandler(request.HTTPRedirectHandler):
              def redirect_request(self, source_request, file_pointer, code, message, headers, new_url):
                  raise ValueError("production availability probes do not accept redirects")

          def expire_request(_signal_number, _frame):
              raise TimeoutError("HTTPS GET exceeded its total deadline")

          try:
              request_url = os.environ["RULEPILOT_HTTPS_URL"]
              body_path = os.environ["RULEPILOT_HTTPS_BODY_PATH"]
              headers_path = os.environ.get("RULEPILOT_HTTPS_HEADERS_PATH", "")
              username = os.environ.get("RULEPILOT_HTTPS_BASIC_USERNAME", "")
              password = os.environ.get("RULEPILOT_HTTPS_BASIC_PASSWORD", "")
              accept = os.environ.get("RULEPILOT_HTTPS_ACCEPT", "")
              require_https_url(request_url)
              if bool(username) != bool(password):
                  raise ValueError("Basic authentication requires both environment variables")

              probe_headers = {"User-Agent": "RulePilot-Production-Preflight/1"}
              if accept:
                  probe_headers["Accept"] = accept
              if username:
                  token = base64.b64encode(f"{username}:{password}".encode()).decode("ascii")
                  probe_headers["Authorization"] = f"Basic {token}"
              probe = request.Request(request_url, headers=probe_headers, method="GET")

              previous_alarm_handler = signal.signal(signal.SIGALRM, expire_request)
              signal.setitimer(signal.ITIMER_REAL, TIMEOUT_SECONDS)
              try:
                  try:
                      with request.build_opener(RejectRedirectHandler()).open(
                          probe, timeout=TIMEOUT_SECONDS
                      ) as response:
                          require_https_url(response.geturl())
                          body = response.read(MAX_RESPONSE_BYTES + 1)
                          response_headers = tuple(response.headers.items())
                  except error.HTTPError as failure:
                      print(f"HTTPS GET failed with HTTP status {failure.code}", file=sys.stderr)
                      raise SystemExit(75 if failure.code in (502, 503, 504) else 1)
                  except (
                      error.URLError,
                      TimeoutError,
                      ConnectionError,
                      http.client.HTTPException,
                      ssl.SSLError,
                      OSError,
                  ) as failure:
                      reason = getattr(failure, "reason", failure)
                      print(
                          f"HTTPS GET failed before a complete HTTP response ({type(reason).__name__})",
                          file=sys.stderr,
                      )
                      raise SystemExit(75)
              finally:
                  signal.setitimer(signal.ITIMER_REAL, 0)
                  signal.signal(signal.SIGALRM, previous_alarm_handler)
              if len(body) > MAX_RESPONSE_BYTES:
                  raise ValueError("HTTPS GET response exceeds the size limit")

              with open(body_path, "wb") as output:
                  output.write(body)
              if headers_path:
                  with open(headers_path, "w", encoding="iso-8859-1", newline="\n") as output:
                      for name, value in response_headers:
                          output.write(f"{name}: {value.replace(chr(13), '').replace(chr(10), ' ')}\n")
          except (OSError, ValueError) as failure:
              print(f"HTTPS GET failed ({type(failure).__name__})", file=sys.stderr)
              raise SystemExit(1)
          PY
          }

          verify_public_once() {
            local release_body release_headers model_body home_body csrf_body recommendations_body
            local first_bgg_id detail_body
            release_body="$preflight_dir/release.body"
            release_headers="$preflight_dir/release.headers"
            model_body="$preflight_dir/model.body"
            home_body="$preflight_dir/home.body"
            csrf_body="$preflight_dir/csrf.body"
            recommendations_body="$preflight_dir/recommendations.body"
            detail_body="$preflight_dir/detail.body"

            https_get \
              "$RULEPILOT_PUBLIC_URL/api/public/release" \
              "$release_body" \
              "$release_headers" || return $?
            jq -e --arg deploy_sha "$DEPLOY_SHA" --arg deploy_release_id "$DEPLOY_RELEASE_ID" '
              .commitSha == $deploy_sha
              and .releaseId == $deploy_release_id
            ' "$release_body" >/dev/null || return 1
            tr -d '\r' < "$release_headers" | awk '
            tolower($0) ~ /^cache-control:/ {
              value = substr($0, index($0, ":") + 1)
              directive_count = split(value, directives, ",")
              for (index_value = 1; index_value <= directive_count; index_value++) {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", directives[index_value])
                if (tolower(directives[index_value]) == "no-store") found = 1
              }
            }
            END { exit(found ? 0 : 1) }
            ' || return 1

            RULEPILOT_HTTPS_BASIC_USERNAME="$preflight_username" \
            RULEPILOT_HTTPS_BASIC_PASSWORD="$preflight_password" \
            RULEPILOT_HTTPS_ACCEPT="application/json" \
              https_get \
                "$RULEPILOT_PUBLIC_URL/api/v1/model-configuration" \
                "$model_body" || return $?
            jq -e '
              .recommendationModel.provider == "qwen"
              and .recommendationModel.model == "qwen3.7-plus"
            ' "$model_body" >/dev/null || return 1

            https_get "$RULEPILOT_PUBLIC_URL/" "$home_body" || return $?
            [[ -s "$home_body" ]] || return 1

            https_get "$RULEPILOT_PUBLIC_URL/api/auth/csrf" "$csrf_body" || return $?
            jq -e '
              (.token | type == "string" and length > 0)
              and (.headerName | type == "string" and length > 0)
            ' "$csrf_body" >/dev/null || return 1

            https_get \
              "$RULEPILOT_PUBLIC_URL/api/v1/bgg/recommendations" \
              "$recommendations_body" || return $?
            first_bgg_id=$(jq -er '
              .[0]
              | select(
                  (.bggId | type) == "number"
                  and .bggId > 0
                  and (.bggId | floor) == .bggId
                  and (.name | type) == "string"
                  and (.name | length) > 0
                )
              | .bggId
            ' "$recommendations_body") || return 1

            https_get \
              "$RULEPILOT_PUBLIC_URL/api/v1/bgg/games/${first_bgg_id}?locale=zh-CN" \
              "$detail_body" || return $?
            jq -e --argjson bgg_id "$first_bgg_id" '
              .bggId == $bgg_id
              and (.description | type) == "string"
              and (.descriptionTranslated | type) == "boolean"
              and (.categories | type) == "array"
              and (.mechanics | type) == "array"
            ' "$detail_body" >/dev/null
          }

          verified=false
          observer_unreachable=true
          for attempt in 1 2 3; do
            if verify_public_once; then
              verified=true
              break
            else
              verification_status=$?
            fi
            if [[ "$verification_status" != 75 ]]; then
              observer_unreachable=false
              break
            fi
            [[ "$attempt" == 3 ]] || sleep 3
          done
          if [[ "$verified" == true ]]; then
            echo "Independent public observer verified the exact candidate release."
          elif [[ "$observer_unreachable" == true ]]; then
            echo "::warning title=Independent public observer unreachable::The observer received no verifiable HTTP response after three bounded attempts. Candidate eligibility will be decided by the production gateway boundary owned by the release guard."
          else
            echo "Independent public observer received a deterministic contract failure." >&2
            exit 1
          fi
          unset preflight_username preflight_password credential_lines

      - name: Verify the candidate publication boundary and commit the release
        id: commit_release
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          cleanup_deploy_key() {
            rm -f "$HOME/.ssh/id_ed25519"
          }
          trap cleanup_deploy_key EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          commit_release_once() {
            ssh \
              -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              -o StrictHostKeyChecking=yes \
              -p "$DEPLOY_SSH_PORT" \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'bash -s' -- "$DEPLOY_PATH" "$DEPLOY_RELEASE_ID" "$DEPLOY_PREVIOUS_RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$(readlink -f "$1")
          release_id=$2
          previous_release_id=$3
          guard_script="${application_root}/deployment-guards/${release_id}/production-release-guard.sh"
          test -x "$guard_script"
          "$guard_script" heartbeat "$application_root" "$release_id" "$previous_release_id"
          "$guard_script" commit "$application_root" "$release_id" "$previous_release_id"
          REMOTE
          }
          committed=false
          for attempt in 1 2 3; do
            if commit_release_once; then
              committed=true
              break
            else
              commit_status=$?
            fi
            if [[ "$commit_status" != 75 && "$commit_status" != 255 ]]; then
              echo "Candidate publication boundary rejected the release; the same request will not be retried." >&2
              exit "$commit_status"
            fi
            [[ "$attempt" == 3 ]] || sleep 3
          done
          [[ "$committed" == true ]]

      - name: Roll back any uncommitted production mutation
        if: >-
          always() &&
          steps.rollback_checkpoint.outcome == 'success' &&
          (steps.public_availability.outcome != 'success' ||
           steps.commit_release.outcome != 'success')
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          cleanup_deploy_key() {
            rm -f "$HOME/.ssh/id_ed25519"
          }
          trap cleanup_deploy_key EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" "$DEPLOY_RELEASE_ID" "$DEPLOY_PREVIOUS_RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$(readlink -f "$1")
          failed_release_id=$2
          previous_release_id=$3
          if [[ ! "$failed_release_id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$
            || ! "$previous_release_id" =~ ^[0-9a-f]{40}-[0-9]+(-[0-9]+)?$ ]]; then
            echo "Rollback release coordinates are invalid" >&2
            exit 1
          fi
          guard_script="${application_root}/deployment-guards/${failed_release_id}/production-release-guard.sh"
          test -x "$guard_script"
          "$guard_script" rollback "$application_root" "$failed_release_id" "$previous_release_id"
          REMOTE

      - name: Collect production service status after a failed verification
        if: failure() && steps.configure_ssh.outcome == 'success'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          cleanup_deploy_key() {
            rm -f "$HOME/.ssh/id_ed25519"
          }
          trap cleanup_deploy_key EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$1
          active_release=$(readlink -f "${application_root}/current")
          if [[ "$active_release" != "${application_root}/releases/"* ]]; then
            echo "Refusing to inspect an active release outside ${application_root}/releases" >&2
            exit 1
          fi
          cd "$active_release"
          compose=(
            docker compose --env-file .env
            -f infra/compose.yml
            -f infra/compose.deployment.yml
            -f infra/compose.production.yml
          )
          echo "Active production services:"
          "${compose[@]}" ps api worker frontend gateway
          REMOTE

      - name: Remove exact remote staging artifacts
        if: always() && steps.configure_ssh.outcome == 'success' && steps.commit_release.outcome != 'success'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          cleanup_runner() {
            rm -f "$HOME/.ssh/id_ed25519"
          }
          trap cleanup_runner EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          release_id=$1
          if [[ ! "$release_id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]; then
            echo "Invalid production staging release id" >&2
            exit 2
          fi
          # This workflow-owned cleanup never extracts or executes the failed candidate. It removes only exact
          # deployment-owned filenames derived from the validated immutable release coordinate.
          rm -f -- \
            "/tmp/rulepilot-${release_id}.tar.gz" \
            "/tmp/rulepilot-backend-${release_id}.tar.gz" \
            "/tmp/rulepilot-backend-${release_id}.tar.gz.sha256" \
            "/tmp/rulepilot-frontend-${release_id}.tar.gz" \
            "/tmp/rulepilot-frontend-${release_id}.tar.gz.sha256" \
            "/tmp/rulepilot-bgg-token-${release_id}"
          REMOTE

      - name: Remove runner-side production credentials
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            "$HOME/.ssh/id_ed25519" \
            "${RULEPILOT_PREFLIGHT_CREDENTIAL_FILE:-$RUNNER_TEMP/rulepilot-production-preflight-credentials}"
