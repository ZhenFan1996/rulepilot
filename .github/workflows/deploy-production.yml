name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy RulePilot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare immutable release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DEPLOY_RELEASE_ID=$(git rev-parse HEAD)-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Build immutable deployment artifacts
        run: |
          ./mvnw -q -DskipTests package
        working-directory: backend

      - name: Build immutable backend runtime image
        shell: bash
        run: |
          set -Eeuo pipefail
          backend_image="rulepilot-backend:${DEPLOY_RELEASE_ID}"
          backend_image_archive="rulepilot-backend-${DEPLOY_RELEASE_ID}.tar.gz"
          docker build \
            --file backend/Dockerfile.runtime \
            --tag "$backend_image" \
            backend
          docker image inspect "$backend_image" >/dev/null
          docker save "$backend_image" | gzip -1 > "$RUNNER_TEMP/$backend_image_archive"
          test -s "$RUNNER_TEMP/$backend_image_archive"
          (cd "$RUNNER_TEMP" && sha256sum "$backend_image_archive" > "${backend_image_archive}.sha256")
          sha256sum "$RUNNER_TEMP/$backend_image_archive"

      - name: Build frontend artifact
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Configure production SSH trust
        shell: bash
        run: |
          set -Eeuo pipefail
          for required_secret in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY DEPLOY_USER; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required production deployment secret: ${required_secret}" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Synchronize protected BGG credential
        shell: bash
        env:
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$BGG_API_TOKEN" ]]; then
            echo "Missing required production integration secret: BGG_API_TOKEN" >&2
            exit 1
          fi
          if (( ${#BGG_API_TOKEN} > 4096 )) || [[ ! "$BGG_API_TOKEN" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "BGG_API_TOKEN has an invalid format" >&2
            exit 1
          fi

          local_token_file="$RUNNER_TEMP/rulepilot-bgg-token-${GITHUB_RUN_ID}"
          remote_token_file="/tmp/rulepilot-bgg-token-${GITHUB_RUN_ID}"
          cleanup_local() {
            rm -f "$local_token_file"
          }
          trap cleanup_local EXIT
          umask 077
          printf '%s' "$BGG_API_TOKEN" > "$local_token_file"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_SSH_PORT" \
            "$local_token_file" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_token_file}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" "$remote_token_file" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$1
          token_file=$2
          env_file="${application_root}/.env"
          temporary_env="${application_root}/.env.${GITHUB_RUN_ID:-sync}.tmp"
          cleanup_remote() {
            rm -f "$token_file" "$temporary_env"
          }
          trap cleanup_remote EXIT

          test -f "$env_file"
          test -f "$token_file"
          chmod 600 "$token_file"
          token=$(<"$token_file")
          if [[ -z "$token" ]] || (( ${#token} > 4096 )) || [[ ! "$token" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Uploaded BGG credential has an invalid format" >&2
            exit 1
          fi

          umask 077
          found=false
          qwen_enabled=false
          qwen_key_present=false
          managed_recommendation_keys=' BGG_RECOMMENDATION_AGENT_ENABLED BGG_RECOMMENDATION_PROVIDER BGG_RECOMMENDATION_MODEL_PROVIDER BGG_RECOMMENDATION_MODEL_CANDIDATE_LIMIT BGG_RECOMMENDATION_AGENT_TIMEOUT BGG_RECOMMENDATION_WEB_RESEARCH_ENABLED BGG_RECOMMENDATION_WEB_RESEARCH_TIMEOUT WEB_SEARCH_MODEL QWEN_MODEL QWEN_VISION_CAPABLE RULEBOOK_DISCOVERY_MODEL RULEBOOK_DISCOVERY_NEGATIVE_CACHE_TTL RULEBOOK_DISCOVERY_HOURLY_LIMIT RULEBOOK_DISCOVERY_PROVIDER_CONCURRENCY '
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ "$line" == BGG_API_TOKEN=* ]]; then
              printf 'BGG_API_TOKEN=%s\n' "$token"
              found=true
            elif [[ "$line" == QWEN_ENABLED=true ]]; then
              printf '%s\n' "$line"
              qwen_enabled=true
            elif [[ "$line" == QWEN_API_KEY=* ]]; then
              printf '%s\n' "$line"
              [[ -n "${line#QWEN_API_KEY=}" ]] && qwen_key_present=true
            elif [[ "$managed_recommendation_keys" == *" ${line%%=*} "* ]]; then
              continue
            else
              printf '%s\n' "$line"
            fi
          done < "$env_file" > "$temporary_env"
          if [[ "$found" == false ]]; then
            printf 'BGG_API_TOKEN=%s\n' "$token" >> "$temporary_env"
          fi
          if [[ "$qwen_enabled" != true || "$qwen_key_present" != true ]]; then
            echo "Production Qwen configuration is required for the recommendation Agent" >&2
            exit 1
          fi
          printf '%s\n' \
            'BGG_RECOMMENDATION_AGENT_ENABLED=true' \
            'BGG_RECOMMENDATION_PROVIDER=spring-ai' \
            'BGG_RECOMMENDATION_MODEL_PROVIDER=qwen' \
            'BGG_RECOMMENDATION_MODEL_CANDIDATE_LIMIT=8' \
            'BGG_RECOMMENDATION_AGENT_TIMEOUT=PT55S' \
            'BGG_RECOMMENDATION_WEB_RESEARCH_ENABLED=true' \
            'BGG_RECOMMENDATION_WEB_RESEARCH_TIMEOUT=PT25S' \
            'WEB_SEARCH_MODEL=qwen3.7-plus' \
            'QWEN_MODEL=qwen3.7-plus' \
            'QWEN_VISION_CAPABLE=true' \
            'RULEBOOK_DISCOVERY_MODEL=qwen3.7-max' \
            'RULEBOOK_DISCOVERY_NEGATIVE_CACHE_TTL=PT10M' \
            'RULEBOOK_DISCOVERY_HOURLY_LIMIT=30' \
            'RULEBOOK_DISCOVERY_PROVIDER_CONCURRENCY=1' >> "$temporary_env"
          chmod 600 "$temporary_env"
          mv "$temporary_env" "$env_file"
          unset token
          echo "Synchronized managed production integration configuration."
          REMOTE

      - name: Package release
        shell: bash
        run: |
          set -Eeuo pipefail
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude='.env.*' \
            --exclude=.local \
            --exclude=frontend/node_modules \
            -czf "$RUNNER_TEMP/rulepilot-release.tar.gz" .
          sha256sum "$RUNNER_TEMP/rulepilot-release.tar.gz"

      - name: Upload release bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_SSH_PORT" \
            "$RUNNER_TEMP/rulepilot-release.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/rulepilot-${DEPLOY_RELEASE_ID}.tar.gz"

      - name: Upload immutable backend runtime image
        shell: bash
        run: |
          set -Eeuo pipefail
          backend_image_archive="rulepilot-backend-${DEPLOY_RELEASE_ID}.tar.gz"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_SSH_PORT" \
            "$RUNNER_TEMP/$backend_image_archive" \
            "$RUNNER_TEMP/${backend_image_archive}.sha256" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"

      - name: Activate release and verify production health
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" "$DEPLOY_RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$1
          release_id=$2
          archive="/tmp/rulepilot-${release_id}.tar.gz"
          backend_image="rulepilot-backend:${release_id}"
          backend_image_filename="rulepilot-backend-${release_id}.tar.gz"
          backend_image_archive="/tmp/${backend_image_filename}"
          backend_image_checksum="${backend_image_archive}.sha256"
          releases_root="${application_root}/releases"
          release_dir="${application_root}/releases/${release_id}"
          current_release=$(readlink -f "${application_root}/current" 2>/dev/null || true)

          diagnose_failure() {
            status=$?
            echo "Production activation failed; collecting safe diagnostics." >&2
            cd "${release_dir}" 2>/dev/null || cd "${application_root}/current"
            echo "Production filesystem usage:"
            df -h "${application_root}" || true
            echo "Production directory usage:"
            du -x -h --max-depth=1 "${application_root}" /var/lib/docker /var/log 2>/dev/null | sort -h || true
            echo "Production Docker usage:"
            docker system df || true
            echo "Production container status:"
            docker compose --env-file .env \
              -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml ps --all || true
            postgres_container=$(docker compose --env-file .env \
              -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml ps -q postgres 2>/dev/null || true)
            if [[ -n "$postgres_container" ]]; then
              echo "PostgreSQL runtime state:"
              docker inspect --format '{{json .State}}' "$postgres_container" || true
              echo "Recent PostgreSQL logs:"
              docker logs --tail 120 "$postgres_container" || true
            fi
            api_container=$(docker compose --env-file .env \
              -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml ps -q api 2>/dev/null || true)
            if [[ -n "$api_container" ]]; then
              echo "API runtime state:"
              docker inspect --format '{{json .State}}' "$api_container" || true
              echo "Recent API logs:"
              docker logs --tail 160 "$api_container" || true
            fi
            if [[ -n "$current_release" && -d "$current_release" && -f "${current_release}/.env" ]]; then
              echo "Restoring API and worker from the current release after failed activation."
              (cd "$current_release" && docker compose --env-file .env \
                -f infra/compose.yml \
                -f infra/compose.deployment.yml \
                -f infra/compose.production.yml up -d --no-build api worker) || \
                echo "Automatic current-release service restoration failed." >&2
            fi
            exit "$status"
          }
          trap diagnose_failure ERR

          test -f "${application_root}/.env"
          test -f "$archive"
          test -f "$backend_image_archive"
          test -f "$backend_image_checksum"
          deploy_sha=${release_id%%-*}
          find /tmp -maxdepth 1 -type f -name "rulepilot-${deploy_sha}-*.tar.gz" \
            ! -path "$archive" -delete
          find /tmp -maxdepth 1 -type f -name "rulepilot-backend-${deploy_sha}-*.tar.gz*" \
            ! -path "$backend_image_archive" \
            ! -path "$backend_image_checksum" -delete
          install -d -m 0755 "$releases_root"
          removed_releases=0
          for candidate in "${releases_root}"/*; do
            [[ -d "$candidate" ]] || continue
            candidate_path=$(readlink -f "$candidate")
            [[ "$candidate_path" == "$current_release" ]] && continue
            [[ "$candidate_path" == "$release_dir" ]] && continue
            if [[ "$candidate_path" != "${releases_root}/"* ]]; then
              echo "Refusing to remove release outside ${releases_root}: ${candidate_path}" >&2
              exit 1
            fi
            rm -rf -- "$candidate_path"
            removed_releases=$((removed_releases + 1))
          done
          printf 'Reclaimed %d inactive release artifact(s); current release retained.\n' "$removed_releases"
          if [[ -n "$current_release" && -d "$current_release" && -f "${current_release}/.env" ]]; then
            echo "Ensuring the current release remains available while the replacement image builds."
            cd "$current_release"
            docker compose --env-file .env \
              -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml up -d --no-build api worker
          fi
          (cd /tmp && sha256sum --check "${backend_image_filename}.sha256")
          gzip -dc "$backend_image_archive" | docker load
          docker image inspect "$backend_image" >/dev/null
          install -d -m 0755 "${release_dir}"
          tar -xzf "${archive}" -C "${release_dir}"
          ln -s "${application_root}/.env" "${release_dir}/.env"

          cd "${release_dir}"
          sh scripts/run-production.sh config
          RULEPILOT_BACKEND_IMAGE="$backend_image" \
            RULEPILOT_PREBUILT_BACKEND_IMAGE=true \
            make production-up

          docker tag "$backend_image" rulepilot-backend:local
          ln -sfn "${release_dir}" "${application_root}/current"
          rm -f "$archive" "$backend_image_archive" "$backend_image_checksum"
          printf 'Activated production release %s\n' "${release_id}"
          docker image ls \
            --filter 'reference=rulepilot-backend:*' \
            --format '{{.Repository}}:{{.Tag}}' | while IFS= read -r candidate; do
            [[ "$candidate" == "$backend_image" ]] && continue
            [[ "$candidate" == "rulepilot-backend:local" ]] && continue
            if [[ "$candidate" =~ ^rulepilot-backend:[0-9a-f]{40}-[0-9]+$ ]]; then
              docker image rm "$candidate" || \
                echo "Deferred removal of inactive backend image ${candidate}." >&2
            fi
          done
          echo "Reclaiming stale Docker build cache and dangling images after activation."
          docker builder prune --force --filter "until=168h" || \
            echo "Deferred Docker build-cache cleanup after successful activation." >&2
          docker image prune --force || \
            echo "Deferred dangling-image cleanup after successful activation." >&2
          REMOTE

      - name: Verify public browser and API path
        env:
          RULEPILOT_PUBLIC_URL: https://rulepilot.cn
        run: |
          node --input-type=module <<'NODE'
          const pause = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds))
          let lastFailure = 'public verification did not run'
          const readRecommendationStream = async (response, startedAt) => {
            if (!response.ok || !response.body) {
              throw new Error(`recommendation stream returned HTTP ${response.status}`)
            }
            const reader = response.body.getReader()
            const decoder = new TextDecoder()
            let buffer = ''
            let firstProgressMillis = null
            let result = null
            while (true) {
              const next = await reader.read()
              buffer += decoder.decode(next.value ?? new Uint8Array(), { stream: !next.done })
              let separator = buffer.match(/\r?\n\r?\n/)
              while (separator?.index != null) {
                const block = buffer.slice(0, separator.index)
                buffer = buffer.slice(separator.index + separator[0].length)
                let event = 'message'
                const data = []
                for (const line of block.split(/\r?\n/)) {
                  if (line.startsWith('event:')) event = line.slice(6).trim()
                  if (line.startsWith('data:')) data.push(line.slice(5).trimStart())
                }
                if (data.length > 0) {
                  const payload = JSON.parse(data.join('\n'))
                  if (event === 'progress' && firstProgressMillis == null) {
                    firstProgressMillis = Date.now() - startedAt
                  } else if (event === 'result') {
                    result = payload
                  } else if (event === 'error') {
                    throw new Error(`recommendation stream failed: ${payload.message ?? 'unknown error'}`)
                  }
                }
                separator = buffer.match(/\r?\n\r?\n/)
              }
              if (next.done) break
            }
            if (firstProgressMillis == null || firstProgressMillis > 20_000) {
              throw new Error(`recommendation stream first progress took ${firstProgressMillis ?? 'no'} ms`)
            }
            if (result == null) throw new Error('recommendation stream completed without a result event')
            return { result, firstProgressMillis, totalMillis: Date.now() - startedAt }
          }
          // This path invokes paid models. Run it once; application budgets and diagnostics make failure actionable.
          for (let attempt = 1; attempt <= 1; attempt += 1) {
            try {
              const page = await fetch(`${process.env.RULEPILOT_PUBLIC_URL}/`, {
                signal: AbortSignal.timeout(10_000),
              })
              const html = await page.text()
              if (!page.ok || !html.includes('<title>RulePilot')) {
                throw new Error(`frontend returned HTTP ${page.status} without the RulePilot title`)
              }
              const csrf = await fetch(`${process.env.RULEPILOT_PUBLIC_URL}/api/auth/csrf`, {
                signal: AbortSignal.timeout(10_000),
              })
              const payload = await csrf.json()
              if (!csrf.ok || typeof payload.token !== 'string' || payload.token.length === 0) {
                throw new Error(`CSRF endpoint returned an invalid HTTP ${csrf.status} response`)
              }
              const setCookies = typeof csrf.headers.getSetCookie === 'function'
                ? csrf.headers.getSetCookie()
                : [csrf.headers.get('set-cookie')].filter(Boolean)
              const cookie = setCookies.map((value) => value.split(';', 1)[0]).join('; ')
              const openingPrompt = '嗨，今晚五个人聚会，最近合作玩得有点腻，但我还没想清楚换什么方向。你会先怎么帮我挑？'
              const openingStartedAt = Date.now()
              const openingAgent = await fetch(
                `${process.env.RULEPILOT_PUBLIC_URL}/api/v1/bgg/recommendation-agent/stream?locale=zh-CN`,
                {
                  method: 'POST',
                  headers: {
                    'content-type': 'application/json',
                    accept: 'text/event-stream',
                    [payload.headerName]: payload.token,
                    cookie,
                  },
                  body: JSON.stringify({
                    profile: { players: null, maxMinutes: null, maxWeight: null, type: 'all', interaction: 'any' },
                    message: openingPrompt,
                    excludedBggIds: [],
                    transcript: [{ role: 'user', text: openingPrompt }],
                    focusedBggId: null,
                    knownGames: [],
                    shownBggIds: [],
                  }),
                  signal: AbortSignal.timeout(120_000),
                },
              )
              const openingStreamed = await readRecommendationStream(openingAgent, openingStartedAt)
              const openingResult = openingStreamed.result
              if (openingResult.mode !== 'model_assisted'
                  || typeof openingResult.assistantMessage !== 'string'
                  || openingResult.assistantMessage.length === 0
                  || openingStreamed.totalMillis > 45_000) {
                throw new Error(`recommendation Agent did not complete the opening turn: ${JSON.stringify({
                  httpStatus: openingAgent.status,
                  outcome: openingResult.outcome ?? 'missing',
                  totalMillis: openingStreamed.totalMillis,
                  actions: Array.isArray(openingResult.harness?.actions) ? openingResult.harness.actions : [],
                })}`)
              }
              const openingGames = Array.isArray(openingResult.games) ? openingResult.games : []
              const recommendationPrompt = '我想换成能谈判、互相骗一骗的；有两个新手，90 分钟内。你直接挑三款吧。'
              const agentStartedAt = Date.now()
              const agent = await fetch(
                `${process.env.RULEPILOT_PUBLIC_URL}/api/v1/bgg/recommendation-agent/stream?locale=zh-CN`,
                {
                  method: 'POST',
                  headers: {
                    'content-type': 'application/json',
                    accept: 'text/event-stream',
                    [payload.headerName]: payload.token,
                    cookie,
                  },
                  body: JSON.stringify({
                    profile: openingResult.profile,
                    message: recommendationPrompt,
                    excludedBggIds: [],
                    transcript: [
                      { role: 'user', text: openingPrompt },
                      { role: 'assistant', text: openingResult.assistantMessage },
                      { role: 'user', text: recommendationPrompt },
                    ],
                    focusedBggId: null,
                    knownGames: openingGames.map(({ game }) => ({
                      bggId: game.bggId,
                      name: game.name,
                      originalName: game.originalName,
                    })),
                    shownBggIds: openingGames.map(({ game }) => game.bggId),
                  }),
                  signal: AbortSignal.timeout(120_000),
                },
              )
              const streamed = await readRecommendationStream(agent, agentStartedAt)
              const agentResult = streamed.result
              const agentActions = agentResult.harness?.actions
              const completedRecommendation = Array.isArray(agentActions)
                && agentActions.includes('RECOMMEND_GAMES')
              const usedSemanticReActTools = Array.isArray(agentActions)
                && (agentActions.includes('SEARCH_BGG_BY_NAME')
                  || agentActions.includes('DISCOVER_CANDIDATES'))
                && agentActions.includes('LOOKUP_BGG_CANDIDATES')
              if (agentResult.mode !== 'model_assisted'
                  || !Array.isArray(agentResult.games) || agentResult.games.length === 0
                  || !completedRecommendation || !usedSemanticReActTools
                  || streamed.totalMillis > 45_000) {
                const diagnostic = JSON.stringify({
                  httpStatus: agent.status,
                  outcome: agentResult.outcome ?? 'missing',
                  gameCount: Array.isArray(agentResult.games) ? agentResult.games.length : -1,
                  totalMillis: streamed.totalMillis,
                  actions: Array.isArray(agentActions) ? agentActions : [],
                })
                throw new Error(`recommendation Agent returned an invalid response: ${diagnostic}`)
              }
              const recommendations = await fetch(
                `${process.env.RULEPILOT_PUBLIC_URL}/api/v1/bgg/recommendations`,
                { signal: AbortSignal.timeout(45_000) },
              )
              const games = await recommendations.json()
              if (!recommendations.ok || !Array.isArray(games) || games.length === 0) {
                throw new Error(`BGG recommendations returned an invalid HTTP ${recommendations.status} response`)
              }
              const firstGame = games[0]
              if (!Number.isInteger(firstGame.bggId) || typeof firstGame.name !== 'string') {
                throw new Error('BGG recommendations did not contain a valid game identity')
              }
              const details = await fetch(
                `${process.env.RULEPILOT_PUBLIC_URL}/api/v1/bgg/games/${firstGame.bggId}?locale=zh-CN`,
                { signal: AbortSignal.timeout(30_000) },
              )
              const game = await details.json()
              if (!details.ok || game.bggId !== firstGame.bggId || typeof game.description !== 'string'
                  || typeof game.descriptionTranslated !== 'boolean'
                  || !Array.isArray(game.categories) || !Array.isArray(game.mechanics)) {
                throw new Error(`BGG game detail returned an invalid HTTP ${details.status} response`)
              }
              console.log(
                `Verified public frontend, two-turn recommendation SSE (${openingStreamed.totalMillis}/${streamed.totalMillis} ms total; ${openingStreamed.firstProgressMillis}/${streamed.firstProgressMillis} ms first progress), BGG API, and game detail on attempt ${attempt}`,
              )
              process.exit(0)
            } catch (error) {
              lastFailure = error instanceof Error ? error.message : String(error)
              if (attempt < 3) await pause(3_000)
            }
          }
          throw new Error(`Public production verification failed: ${lastFailure}`)
          NODE

      - name: Collect bounded production diagnostics after a failed verification
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$1
          active_release=$(readlink -f "${application_root}/current")
          if [[ "$active_release" != "${application_root}/releases/"* ]]; then
            echo "Refusing to inspect an active release outside ${application_root}/releases" >&2
            exit 1
          fi
          cd "$active_release"
          compose=(
            docker compose --env-file .env
            -f infra/compose.yml
            -f infra/compose.deployment.yml
            -f infra/compose.production.yml
          )
          echo "Active production services:"
          "${compose[@]}" ps api worker frontend gateway
          echo "API logs from the last 10 minutes (bounded to 250 lines):"
          "${compose[@]}" logs --since 10m --tail 250 --no-color api
          REMOTE
