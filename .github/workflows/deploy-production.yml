name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy RulePilot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/rulepilot' }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build immutable deployment artifacts
        run: |
          ./mvnw -q -DskipTests package
        working-directory: backend

      - name: Build frontend artifact
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Configure production SSH trust
        shell: bash
        run: |
          set -Eeuo pipefail
          for required_secret in DEPLOY_HOST DEPLOY_KNOWN_HOSTS DEPLOY_SSH_PRIVATE_KEY DEPLOY_USER; do
            if [[ -z "${!required_secret}" ]]; then
              echo "Missing required production deployment secret: ${required_secret}" >&2
              exit 1
            fi
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Synchronize protected BGG credential
        shell: bash
        env:
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$BGG_API_TOKEN" ]]; then
            echo "Missing required production integration secret: BGG_API_TOKEN" >&2
            exit 1
          fi
          if (( ${#BGG_API_TOKEN} > 4096 )) || [[ ! "$BGG_API_TOKEN" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "BGG_API_TOKEN has an invalid format" >&2
            exit 1
          fi

          local_token_file="$RUNNER_TEMP/rulepilot-bgg-token-${GITHUB_RUN_ID}"
          remote_token_file="/tmp/rulepilot-bgg-token-${GITHUB_RUN_ID}"
          cleanup_local() {
            rm -f "$local_token_file"
          }
          trap cleanup_local EXIT
          umask 077
          printf '%s' "$BGG_API_TOKEN" > "$local_token_file"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_SSH_PORT" \
            "$local_token_file" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_token_file}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" "$remote_token_file" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$1
          token_file=$2
          env_file="${application_root}/.env"
          temporary_env="${application_root}/.env.${GITHUB_RUN_ID:-sync}.tmp"
          cleanup_remote() {
            rm -f "$token_file" "$temporary_env"
          }
          trap cleanup_remote EXIT

          test -f "$env_file"
          test -f "$token_file"
          chmod 600 "$token_file"
          token=$(<"$token_file")
          if [[ -z "$token" ]] || (( ${#token} > 4096 )) || [[ ! "$token" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Uploaded BGG credential has an invalid format" >&2
            exit 1
          fi

          umask 077
          found=false
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ "$line" == BGG_API_TOKEN=* ]]; then
              printf 'BGG_API_TOKEN=%s\n' "$token"
              found=true
            else
              printf '%s\n' "$line"
            fi
          done < "$env_file" > "$temporary_env"
          if [[ "$found" == false ]]; then
            printf 'BGG_API_TOKEN=%s\n' "$token" >> "$temporary_env"
          fi
          chmod 600 "$temporary_env"
          mv "$temporary_env" "$env_file"
          unset token
          echo "Synchronized managed production integration configuration."
          REMOTE

      - name: Package release
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DEPLOY_RELEASE_ID=$(git rev-parse HEAD)-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude='.env.*' \
            --exclude=.local \
            --exclude=frontend/node_modules \
            -czf "$RUNNER_TEMP/rulepilot-release.tar.gz" .
          sha256sum "$RUNNER_TEMP/rulepilot-release.tar.gz"

      - name: Upload release bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_SSH_PORT" \
            "$RUNNER_TEMP/rulepilot-release.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/rulepilot-${DEPLOY_RELEASE_ID}.tar.gz"

      - name: Activate release and verify production health
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_SSH_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -s' -- "$DEPLOY_PATH" "$DEPLOY_RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          application_root=$1
          release_id=$2
          archive="/tmp/rulepilot-${release_id}.tar.gz"
          release_dir="${application_root}/releases/${release_id}"

          diagnose_failure() {
            status=$?
            echo "Production activation failed; collecting safe diagnostics." >&2
            cd "${release_dir}" 2>/dev/null || cd "${application_root}/current"
            echo "Production filesystem usage:"
            df -h "${application_root}" || true
            echo "Production directory usage:"
            du -x -h --max-depth=1 "${application_root}" /var/lib/docker /var/log 2>/dev/null | sort -h || true
            echo "Production Docker usage:"
            docker system df || true
            echo "Production container status:"
            docker compose --env-file .env \
              -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml ps --all || true
            postgres_container=$(docker compose --env-file .env \
              -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml ps -q postgres 2>/dev/null || true)
            if [[ -n "$postgres_container" ]]; then
              echo "PostgreSQL runtime state:"
              docker inspect --format '{{json .State}}' "$postgres_container" || true
              echo "Recent PostgreSQL logs:"
              docker logs --tail 120 "$postgres_container" || true
            fi
            api_container=$(docker compose --env-file .env \
              -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml ps -q api 2>/dev/null || true)
            if [[ -n "$api_container" ]]; then
              echo "API runtime state:"
              docker inspect --format '{{json .State}}' "$api_container" || true
              echo "Recent API logs:"
              docker logs --tail 160 "$api_container" || true
            fi
            exit "$status"
          }
          trap diagnose_failure ERR

          test -f "${application_root}/.env"
          deploy_sha=${release_id%%-*}
          current_release=$(readlink -f "${application_root}/current" 2>/dev/null || true)
          find /tmp -maxdepth 1 -type f -name "rulepilot-${deploy_sha}-*.tar.gz" \
            ! -path "$archive" -delete
          for candidate in "${application_root}"/releases/"${deploy_sha}"-*; do
            [[ -d "$candidate" ]] || continue
            [[ "$(readlink -f "$candidate")" == "$current_release" ]] && continue
            rm -rf -- "$candidate"
          done
          echo "Reclaiming unused Docker build cache and images before activation."
          docker builder prune --all --force
          docker image prune --all --force
          if [[ -d "${application_root}/current" ]]; then
            cd "${application_root}/current"
            docker compose --env-file .env \
              -f infra/compose.yml \
              -f infra/compose.deployment.yml \
              -f infra/compose.production.yml stop worker api || true
          fi
          install -d -m 0755 "${release_dir}"
          tar -xzf "${archive}" -C "${release_dir}"
          ln -s "${application_root}/.env" "${release_dir}/.env"

          cd "${release_dir}"
          sh scripts/run-production.sh config
          make production-up

          ln -sfn "${release_dir}" "${application_root}/current"
          rm -f "${archive}"
          printf 'Activated production release %s\n' "${release_id}"
          REMOTE

      - name: Verify public browser and API path
        env:
          RULEPILOT_PUBLIC_URL: https://rulepilot.cn
        run: |
          node --input-type=module <<'NODE'
          const pause = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds))
          let lastFailure = 'public verification did not run'
          for (let attempt = 1; attempt <= 20; attempt += 1) {
            try {
              const page = await fetch(`${process.env.RULEPILOT_PUBLIC_URL}/`, {
                signal: AbortSignal.timeout(10_000),
              })
              const html = await page.text()
              if (!page.ok || !html.includes('<title>RulePilot')) {
                throw new Error(`frontend returned HTTP ${page.status} without the RulePilot title`)
              }
              const csrf = await fetch(`${process.env.RULEPILOT_PUBLIC_URL}/api/auth/csrf`, {
                signal: AbortSignal.timeout(10_000),
              })
              const payload = await csrf.json()
              if (!csrf.ok || typeof payload.token !== 'string' || payload.token.length === 0) {
                throw new Error(`CSRF endpoint returned an invalid HTTP ${csrf.status} response`)
              }
              const recommendations = await fetch(
                `${process.env.RULEPILOT_PUBLIC_URL}/api/v1/bgg/recommendations`,
                { signal: AbortSignal.timeout(45_000) },
              )
              const games = await recommendations.json()
              if (!recommendations.ok || !Array.isArray(games) || games.length === 0) {
                throw new Error(`BGG recommendations returned an invalid HTTP ${recommendations.status} response`)
              }
              const firstGame = games[0]
              if (!Number.isInteger(firstGame.bggId) || typeof firstGame.name !== 'string') {
                throw new Error('BGG recommendations did not contain a valid game identity')
              }
              const details = await fetch(
                `${process.env.RULEPILOT_PUBLIC_URL}/api/v1/bgg/games/${firstGame.bggId}`,
                { signal: AbortSignal.timeout(30_000) },
              )
              const game = await details.json()
              if (!details.ok || game.bggId !== firstGame.bggId || typeof game.description !== 'string'
                  || !Array.isArray(game.categories) || !Array.isArray(game.mechanics)) {
                throw new Error(`BGG game detail returned an invalid HTTP ${details.status} response`)
              }
              console.log(
                `Verified public frontend, API, BGG recommendations, and game detail on attempt ${attempt}`,
              )
              process.exit(0)
            } catch (error) {
              lastFailure = error instanceof Error ? error.message : String(error)
              if (attempt < 20) await pause(3_000)
            }
          }
          throw new Error(`Public production verification failed: ${lastFailure}`)
          NODE
