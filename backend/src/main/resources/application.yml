spring:
  application:
    name: rulepilot
  ai:
    mcp:
      server:
        name: rulepilot
        version: 0.1.0
        protocol: STATELESS
        type: SYNC
        annotation-scanner:
          enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rulepilot}
    username: ${POSTGRES_USER:rulepilot}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rulepilot}
    password: ${RABBITMQ_PASSWORD:change-me-local-only}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_PDF_UPLOAD_SIZE:50MB}
      max-request-size: ${MAX_PDF_UPLOAD_SIZE:50MB}
  session:
    timeout: 8h
    data:
      redis:
        namespace: rulepilot:session
  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      service.namespace: rulepilot
      service.version: ${RULEPILOT_RELEASE_ID:local}
      deployment.environment.name: ${RULEPILOT_DEPLOYMENT_ENVIRONMENT:development}
      rulepilot.runtime.role: ${RULEPILOT_RUNTIME_ROLE:combined}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

rulepilot:
  release:
    id: ${RULEPILOT_RELEASE_ID:local}
  runtime:
    api-enabled: true
    worker-enabled: true
  agent:
    max-tokens: ${AGENT_MAX_TOKENS:24000}
    timeout: ${AGENT_TIMEOUT:PT2M}
  document:
    max-pdf-pages: ${MAX_PDF_PAGES:500}
    max-extracted-characters: ${MAX_PDF_EXTRACTED_CHARACTERS:5000000}
    visual-renderer: ${RULEBOOK_VISUAL_RENDERER:poppler}
    # Poppler reports each closed JPEG as soon as it is complete, so an eight-page session overlaps page storage while
    # retaining a strict decoder-memory bound and avoiding four repeated PDF/process initializations per session.
    render-session-pages: ${DOCUMENT_RENDER_SESSION_PAGES:8}
    # Rendered JPEGs are large. Keep this lane deliberately small: it overlaps object storage with the next page's
    # rendering, while the producer-side bound prevents a full rulebook from accumulating in Worker memory.
    page-image-storage-parallelism: ${DOCUMENT_PAGE_IMAGE_STORAGE_PARALLELISM:2}
    messaging:
      exchange: ${DOCUMENT_PROCESSING_EXCHANGE:rulepilot.document.processing}
      queue: ${DOCUMENT_PROCESSING_QUEUE:rulepilot.document.processing.v1}
      routing-key: ${DOCUMENT_PROCESSING_ROUTING_KEY:document.processing.requested.v1}
      retry-exchange: ${DOCUMENT_PROCESSING_RETRY_EXCHANGE:rulepilot.document.processing.retry}
      dead-letter-exchange: ${DOCUMENT_PROCESSING_DLX:rulepilot.document.processing.dlx}
      dead-letter-queue: ${DOCUMENT_PROCESSING_DLQ:rulepilot.document.processing.dlq.v1}
      max-attempts: ${DOCUMENT_PROCESSING_MAX_ATTEMPTS:4}
      retry-delays: ${DOCUMENT_PROCESSING_RETRY_DELAYS:1s,5s,20s}
      metrics-fixed-delay: ${DOCUMENT_PROCESSING_METRICS_FIXED_DELAY:5s}
      batch-size: ${OUTBOX_PUBLISH_BATCH_SIZE:20}
      fixed-delay: ${OUTBOX_PUBLISH_FIXED_DELAY:500ms}
      confirm-timeout: ${OUTBOX_PUBLISH_CONFIRM_TIMEOUT:5s}
      # Commit-time hints use one bounded non-request lane; the scheduled outbox scan remains the recovery path.
      wakeup-queue-capacity: ${OUTBOX_WAKEUP_QUEUE_CAPACITY:8}
    ready-notification:
      exchange: ${DOCUMENT_READY_EXCHANGE:rulepilot.document.ready}
      queue: ${DOCUMENT_READY_QUEUE:rulepilot.document.ready.api.v1}
      routing-key: ${DOCUMENT_READY_ROUTING_KEY:document.ready.v1}
  teaching:
    provider: ${TEACHING_PROVIDER:fake}
    model-provider: ${TEACHING_MODEL_PROVIDER:gemini}
    temperature: ${TEACHING_TEMPERATURE:0.2}
    outline-temperature: ${TEACHING_OUTLINE_TEMPERATURE:0.1}
    # Page-owned outline shards are independent; bounded concurrency removes dense-rulebook serial critical paths.
    outline-shard-parallelism: ${TEACHING_OUTLINE_SHARD_PARALLELISM:10}
    import-handoff:
      batch-size: ${TEACHING_IMPORT_HANDOFF_BATCH_SIZE:4}
      fixed-delay: ${TEACHING_IMPORT_HANDOFF_FIXED_DELAY:500ms}
      # Claiming persisted READY intents must not wait behind Rabbit publisher confirms or queue metrics.
      scheduler-pool-size: ${TEACHING_IMPORT_HANDOFF_SCHEDULER_POOL_SIZE:1}
    agent:
      # Workload estimates scale tokens and active time relative to this ordinary-capacity baseline. It is not a call
      # limit: valid recovery can continue while the persisted token envelope and deadline still allow work.
      model-call-capacity-baseline: ${TEACHING_AGENT_MODEL_CALL_CAPACITY_BASELINE:72}
      max-tokens: ${TEACHING_AGENT_MAX_TOKENS:300000}
      timeout: ${TEACHING_AGENT_TIMEOUT:PT30M}
      # Estimated workloads extend the ordinary wall budget proportionally. Sixteen hours is an active-work boundary,
      # not a call-count limit or a promise that every source fits provider context or available account quota.
      max-workload-timeout: ${TEACHING_AGENT_MAX_WORKLOAD_TIMEOUT:PT16H}
      # Scale the execution-token envelope with estimated work; provider account quota remains an independent
      # entitlement boundary. The cap prevents an oversized workload from authorizing unbounded token usage.
      max-workload-tokens: ${TEACHING_AGENT_MAX_WORKLOAD_TOKENS:16000000}
    background:
      core-pool-size: ${TEACHING_BACKGROUND_CORE_POOL_SIZE:1}
      max-pool-size: ${TEACHING_BACKGROUND_MAX_POOL_SIZE:3}
      queue-capacity: ${TEACHING_BACKGROUND_QUEUE_CAPACITY:20}
    startup:
      # One lane covers outline preparation and the first cited section. Remaining chapters and review use the
      # background pool, preventing their long tail from occupying every path to a new player's first useful content.
      queue-capacity: ${TEACHING_STARTUP_QUEUE_CAPACITY:8}
      # RECEIVED means queued, not active. If no worker claims it within this lease, fail explicitly so the player
      # can retry instead of watching an unbounded background state.
      admission-timeout: ${TEACHING_STARTUP_ADMISSION_TIMEOUT:PT2M}
    long-preparation:
      # Page-sharded visual rulebooks have their own bounded lane so they cannot age ordinary queued work past its
      # deadline. Capacity is an overload boundary; the admission lease below is the user-visible wait boundary.
      queue-capacity: ${TEACHING_LONG_PREPARATION_QUEUE_CAPACITY:8}
      admission-timeout: ${TEACHING_LONG_PREPARATION_ADMISSION_TIMEOUT:PT30M}
    candidate:
      # Public-library regeneration is not on the player's first-use lane, but accepted work still needs a durable
      # terminal boundary if every background worker remains occupied.
      admission-timeout: ${TEACHING_CANDIDATE_ADMISSION_TIMEOUT:PT30M}
    continuation:
      # Every remaining chapter gets a fresh queue lease after the first cited section is already readable.
      admission-timeout: ${TEACHING_CONTINUATION_ADMISSION_TIMEOUT:PT30M}
    visual-enrichment:
      # Retained only to read historical VISUAL_ENRICHMENT runs. New crops are bounded chapter work inside TEACHING.
      agent:
        max-tokens: ${VISUAL_ENRICHMENT_AGENT_MAX_TOKENS:600000}
        timeout: ${VISUAL_ENRICHMENT_AGENT_TIMEOUT:PT30M}
    # First-pass chapters use the planner's rulebook-language terms. Supplemental searches belong to
    # post-publication review instead of delaying the first complete, cited lesson.
    base-max-retrieval-queries-per-section: ${TEACHING_BASE_MAX_RETRIEVAL_QUERIES_PER_SECTION:3}
  visual:
    provider: ${VISUAL_PROVIDER:fake}
    model-provider: ${VISUAL_MODEL_PROVIDER:gemini}
    region-proposal:
      # A local pixel tool proposes immutable crop geometry. The visual model may select only opaque candidate IDs;
      # it never authors coordinates. Per-page work is short and failure falls back to existing PDF layout candidates.
      enabled: ${VISUAL_REGION_PROPOSAL_ENABLED:true}
      python-command: ${VISUAL_REGION_PROPOSAL_PYTHON_COMMAND:python3}
      timeout: ${VISUAL_REGION_PROPOSAL_TIMEOUT:PT2S}
      max-regions-per-page: ${VISUAL_REGION_PROPOSAL_MAX_REGIONS_PER_PAGE:32}
    # Every cited, sufficiently evidenced section may receive optional crop work. Candidate images travel in bounded
    # per-call batches; the visual Agent decides when another finite batch is no longer useful.
    # Complete post-publication positioning and visual audits use their own bounded pool.
    request-parallelism: ${VISUAL_REQUEST_PARALLELISM:10}
    # Structured rule interpretation is heavier and retains the measured four-request provider headroom.
    semantic-request-parallelism: ${VISUAL_SEMANTIC_REQUEST_PARALLELISM:4}
    location-timeout: ${VISUAL_LOCATION_TIMEOUT:PT45S}
    # Legacy callers without an observable Agent run still share one workflow wall deadline across every candidate
    # batch. This bounds elapsed time without imposing a final image or section count.
    compatibility-workflow-timeout: ${VISUAL_COMPATIBILITY_WORKFLOW_TIMEOUT:PT10M}
    # One page-bound catalog window covers the finite rule-page batch. The deadline is shared so slow provider calls
    # cannot multiply the background enrichment time.
    catalog-timeout: ${VISUAL_CATALOG_TIMEOUT:PT120S}
  game-session:
    context-retention: ${GAME_SESSION_CONTEXT_RETENTION:PT12H}
  answer:
    provider: ${ANSWER_PROVIDER:fake}
    model-provider: ${ANSWER_MODEL_PROVIDER:gemini}
    temperature: ${ANSWER_TEMPERATURE:0.15}
    interpretation-temperature: ${ANSWER_INTERPRETATION_TEMPERATURE:0.0}
    cache-retention: ${ANSWER_CACHE_RETENTION:PT6H}
    cache-retention-jitter: ${ANSWER_CACHE_RETENTION_JITTER:PT1H}
    rate-limit:
      user-requests: ${ANSWER_RATE_USER_REQUESTS:20}
      user-window: ${ANSWER_RATE_USER_WINDOW:PT1M}
      session-concurrency: ${ANSWER_RATE_SESSION_CONCURRENCY:1}
      provider-concurrency: ${ANSWER_RATE_PROVIDER_CONCURRENCY:8}
      lease: ${ANSWER_RATE_LEASE:PT30S}
  critic:
    provider: ${CRITIC_PROVIDER:fake}
    model-provider: ${CRITIC_MODEL_PROVIDER:gemini}
    temperature: ${CRITIC_TEMPERATURE:0.0}
    evaluation-mode: ${CRITIC_EVALUATION_MODE:false}
  answer-regression:
    dataset: ${ANSWER_REGRESSION_DATASET:}
    name: ${ANSWER_REGRESSION_NAME:external-answer-regressions}
  models:
    credential-encryption-key: ${MODEL_CREDENTIAL_ENCRYPTION_KEY:}
    credential-encryption-key-version: ${MODEL_CREDENTIAL_ENCRYPTION_KEY_VERSION:1}
    default-monthly-token-limit: ${MODEL_DEFAULT_MONTHLY_TOKEN_LIMIT:2000000}
    per-call-reservation-tokens: ${MODEL_PER_CALL_RESERVATION_TOKENS:16000}
    request-timeout: ${MODEL_REQUEST_TIMEOUT:PT2M}
    startup-allowed-users: ${RULEPILOT_MODELS_STARTUP_ALLOWED_USERS:}
    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_MODEL:gpt-5-mini}
      vision-capable: ${OPENAI_VISION_CAPABLE:true}
    gemini:
      enabled: ${GEMINI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      vision-capable: ${GEMINI_VISION_CAPABLE:true}
    deepseek:
      enabled: ${DEEPSEEK_ENABLED:false}
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      generation-thinking: ${DEEPSEEK_GENERATION_THINKING:false}
      vision-capable: ${DEEPSEEK_VISION_CAPABLE:false}
    qwen:
      enabled: ${QWEN_ENABLED:false}
      api-key: ${QWEN_API_KEY:}
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${QWEN_MODEL:qwen3.7-plus}
      vision-capable: ${QWEN_VISION_CAPABLE:true}
    compatible:
      enabled: ${COMPATIBLE_MODEL_ENABLED:false}
      api-key: ${COMPATIBLE_MODEL_API_KEY:}
      base-url: ${COMPATIBLE_MODEL_BASE_URL:http://localhost:11434/v1}
      model: ${COMPATIBLE_MODEL_NAME:local-model}
      vision-capable: ${COMPATIBLE_MODEL_VISION_CAPABLE:false}
  bgg:
    base-url: ${BGG_BASE_URL:https://boardgamegeek.com}
    api-token: ${BGG_API_TOKEN:}
    resolved-addresses: ${BGG_RESOLVED_ADDRESSES:}
    cache:
      hot-fresh-ttl: ${BGG_CACHE_HOT_FRESH_TTL:PT1H}
      hot-stale-ttl: ${BGG_CACHE_HOT_STALE_TTL:P1D}
      detail-fresh-ttl: ${BGG_CACHE_DETAIL_FRESH_TTL:P7D}
      detail-stale-ttl: ${BGG_CACHE_DETAIL_STALE_TTL:P30D}
      maximum-entry-bytes: ${BGG_CACHE_MAXIMUM_ENTRY_BYTES:262144}
      maximum-entries: ${BGG_CACHE_MAXIMUM_ENTRIES:20000}
      maximum-bytes: ${BGG_CACHE_MAXIMUM_BYTES:268435456}
      cleanup-delay: ${BGG_CACHE_CLEANUP_DELAY:PT1H}
      prewarm:
        enabled: ${BGG_CACHE_PREWARM_ENABLED:true}
        game-count: ${BGG_CACHE_PREWARM_GAME_COUNT:10000}
        cohort-size: ${BGG_CACHE_PREWARM_COHORT_SIZE:500}
        translation-cohort-size: ${BGG_CACHE_PREWARM_TRANSLATION_COHORT_SIZE:60}
        initial-delay: ${BGG_CACHE_PREWARM_INITIAL_DELAY:PT5M}
        resume-delay: ${BGG_CACHE_PREWARM_RESUME_DELAY:PT1H}
        lease-duration: ${BGG_CACHE_PREWARM_LEASE_DURATION:PT30M}
    ranked-catalog:
      minimum-rows: ${BGG_RANKED_CATALOG_MINIMUM_ROWS:100000}
      maximum-rows: ${BGG_RANKED_CATALOG_MAXIMUM_ROWS:500000}
    translation:
      enabled: ${BGG_TRANSLATION_ENABLED:${DEEPSEEK_ENABLED:false}}
      timeout: ${BGG_TRANSLATION_TIMEOUT:PT20S}
      cache-ttl: ${BGG_TRANSLATION_CACHE_TTL:P30D}
      hourly-limit: ${BGG_TRANSLATION_HOURLY_LIMIT:60}
      provider-concurrency: ${BGG_TRANSLATION_PROVIDER_CONCURRENCY:2}
    recommendation-agent:
      provider: ${BGG_RECOMMENDATION_PROVIDER:fake}
      model-provider: ${BGG_RECOMMENDATION_MODEL_PROVIDER:qwen}
      model: ${BGG_RECOMMENDATION_MODEL:}
      temperature: ${BGG_RECOMMENDATION_TEMPERATURE:0.0}
      model-candidate-limit: ${BGG_RECOMMENDATION_MODEL_CANDIDATE_LIMIT:8}
      result-count: ${BGG_RECOMMENDATION_RESULT_COUNT:3}
      diversity-overlap-limit: ${BGG_RECOMMENDATION_DIVERSITY_OVERLAP_LIMIT:0.66}
      timeout: ${AGENT_TIMEOUT:PT2M}
      web-research:
        enabled: ${BGG_RECOMMENDATION_WEB_RESEARCH_ENABLED:false}
        api-key: ${WEB_SEARCH_API_KEY:${QWEN_API_KEY:}}
        base-url: ${WEB_SEARCH_BASE_URL:${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
        model: ${WEB_SEARCH_MODEL:qwen3.7-plus}
        timeout: ${BGG_RECOMMENDATION_WEB_RESEARCH_TIMEOUT:PT25S}
        cache-ttl: ${BGG_RECOMMENDATION_WEB_RESEARCH_CACHE_TTL:P7D}
        hourly-limit: ${BGG_RECOMMENDATION_WEB_RESEARCH_HOURLY_LIMIT:60}
        provider-concurrency: ${BGG_RECOMMENDATION_WEB_RESEARCH_PROVIDER_CONCURRENCY:2}
  rulebook-discovery:
    enabled: ${RULEBOOK_DISCOVERY_ENABLED:${QWEN_ENABLED:false}}
    api-key: ${RULEBOOK_DISCOVERY_API_KEY:${WEB_SEARCH_API_KEY:${QWEN_API_KEY:}}}
    base-url: ${RULEBOOK_DISCOVERY_BASE_URL:${WEB_SEARCH_BASE_URL:${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}}
    model: ${RULEBOOK_DISCOVERY_MODEL:qwen3.7-max}
    timeout: ${RULEBOOK_DISCOVERY_TIMEOUT:PT30S}
    catalog-provider-budget: ${RULEBOOK_DISCOVERY_CATALOG_PROVIDER_BUDGET:PT6S}
    source-inspection-provider-budget: ${RULEBOOK_DISCOVERY_SOURCE_INSPECTION_PROVIDER_BUDGET:PT6S}
    web-search-provider-budget: ${RULEBOOK_DISCOVERY_WEB_SEARCH_PROVIDER_BUDGET:PT18S}
    total-budget: ${RULEBOOK_DISCOVERY_TOTAL_BUDGET:PT30S}
    cache-ttl: ${RULEBOOK_DISCOVERY_CACHE_TTL:P30D}
    negative-cache-ttl: ${RULEBOOK_DISCOVERY_NEGATIVE_CACHE_TTL:PT10M}
    hourly-limit: ${RULEBOOK_DISCOVERY_HOURLY_LIMIT:30}
    provider-concurrency: ${RULEBOOK_DISCOVERY_PROVIDER_CONCURRENCY:1}
    trusted-domains: ${RULEBOOK_TRUSTED_DOMAINS:${RULEBOOK_OFFICIAL_DOMAINS:}}
    gstone-catalog-enabled: ${RULEBOOK_GSTONE_CATALOG_ENABLED:true}
    source-inspection-timeout: ${RULEBOOK_SOURCE_INSPECTION_TIMEOUT:PT8S}
    max-source-page-bytes: ${RULEBOOK_SOURCE_PAGE_MAX_BYTES:1048576}
  rulebook-import:
    queue-capacity: ${RULEBOOK_IMPORT_QUEUE_CAPACITY:8}
    connect-timeout: ${RULEBOOK_IMPORT_CONNECT_TIMEOUT:PT10S}
    read-timeout: ${RULEBOOK_IMPORT_READ_TIMEOUT:PT30S}
    call-timeout: ${RULEBOOK_IMPORT_CALL_TIMEOUT:PT2M}
    max-compressible-pdf-bytes: ${RULEBOOK_IMPORT_MAX_COMPRESSIBLE_PDF_BYTES:104857600}
  embedding:
    provider: ${EMBEDDING_PROVIDER:fake}
    qwen:
      api-key: ${QWEN_API_KEY:}
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${QWEN_EMBEDDING_MODEL:text-embedding-v4}
      dimensions: ${QWEN_EMBEDDING_DIMENSIONS:1024}
      request-timeout: ${QWEN_EMBEDDING_REQUEST_TIMEOUT:PT30S}
      batch-size: ${QWEN_EMBEDDING_BATCH_SIZE:10}
  storage:
    minio:
      endpoint: http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
      access-key: ${MINIO_ACCESS_KEY:rulepilot}
      secret-key: ${MINIO_SECRET_KEY:change-me-local-only}
      bucket: ${MINIO_BUCKET:rulepilot-documents}
      max-pdf-bytes: ${MAX_PDF_BYTES:52428800}
  identity:
    user:
      username: ${RULEPILOT_USER_USERNAME:player}
      password: ${RULEPILOT_USER_PASSWORD:rulepilot-local}
    admin:
      username: ${RULEPILOT_ADMIN_USERNAME:admin}
      password: ${RULEPILOT_ADMIN_PASSWORD:rulepilot-admin-local}
