spring:
  application:
    name: rulepilot
  ai:
    mcp:
      server:
        name: rulepilot
        version: 0.1.0
        protocol: STATELESS
        type: SYNC
        annotation-scanner:
          enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rulepilot}
    username: ${POSTGRES_USER:rulepilot}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rulepilot}
    password: ${RABBITMQ_PASSWORD:change-me-local-only}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  servlet:
    multipart:
      max-file-size: ${MAX_PDF_UPLOAD_SIZE:50MB}
      max-request-size: ${MAX_PDF_UPLOAD_SIZE:50MB}
  session:
    timeout: 8h
    data:
      redis:
        namespace: rulepilot:session
  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      service.namespace: rulepilot
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

rulepilot:
  runtime:
    api-enabled: true
    worker-enabled: true
  agent:
    max-steps: ${AGENT_MAX_STEPS:40}
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:24}
    max-model-calls: ${AGENT_MAX_MODEL_CALLS:16}
    max-tokens: ${AGENT_MAX_TOKENS:24000}
    timeout: ${AGENT_TIMEOUT:PT2M}
  document:
    max-pdf-pages: ${MAX_PDF_PAGES:500}
    max-extracted-characters: ${MAX_PDF_EXTRACTED_CHARACTERS:5000000}
    messaging:
      exchange: ${DOCUMENT_PROCESSING_EXCHANGE:rulepilot.document.processing}
      queue: ${DOCUMENT_PROCESSING_QUEUE:rulepilot.document.processing.v1}
      routing-key: ${DOCUMENT_PROCESSING_ROUTING_KEY:document.processing.requested.v1}
      retry-exchange: ${DOCUMENT_PROCESSING_RETRY_EXCHANGE:rulepilot.document.processing.retry}
      dead-letter-exchange: ${DOCUMENT_PROCESSING_DLX:rulepilot.document.processing.dlx}
      dead-letter-queue: ${DOCUMENT_PROCESSING_DLQ:rulepilot.document.processing.dlq.v1}
      max-attempts: ${DOCUMENT_PROCESSING_MAX_ATTEMPTS:4}
      retry-delays: ${DOCUMENT_PROCESSING_RETRY_DELAYS:1s,5s,20s}
      metrics-fixed-delay: ${DOCUMENT_PROCESSING_METRICS_FIXED_DELAY:5s}
      batch-size: ${OUTBOX_PUBLISH_BATCH_SIZE:20}
      fixed-delay: ${OUTBOX_PUBLISH_FIXED_DELAY:2s}
      confirm-timeout: ${OUTBOX_PUBLISH_CONFIRM_TIMEOUT:5s}
  teaching:
    provider: ${TEACHING_PROVIDER:fake}
    model-provider: ${TEACHING_MODEL_PROVIDER:gemini}
    agent:
      max-tool-calls: ${TEACHING_AGENT_MAX_TOOL_CALLS:72}
      max-model-calls: ${TEACHING_AGENT_MAX_MODEL_CALLS:144}
      max-tokens: ${TEACHING_AGENT_MAX_TOKENS:300000}
      timeout: ${TEACHING_AGENT_TIMEOUT:PT30M}
    background:
      core-pool-size: ${TEACHING_BACKGROUND_CORE_POOL_SIZE:2}
      max-pool-size: ${TEACHING_BACKGROUND_MAX_POOL_SIZE:4}
      queue-capacity: ${TEACHING_BACKGROUND_QUEUE_CAPACITY:20}
  visual:
    provider: ${VISUAL_PROVIDER:fake}
    model-provider: ${VISUAL_MODEL_PROVIDER:gemini}
  game-session:
    context-retention: ${GAME_SESSION_CONTEXT_RETENTION:PT12H}
  answer:
    provider: ${ANSWER_PROVIDER:fake}
    model-provider: ${ANSWER_MODEL_PROVIDER:gemini}
    cache-retention: ${ANSWER_CACHE_RETENTION:PT6H}
    cache-retention-jitter: ${ANSWER_CACHE_RETENTION_JITTER:PT1H}
    rate-limit:
      user-requests: ${ANSWER_RATE_USER_REQUESTS:20}
      user-window: ${ANSWER_RATE_USER_WINDOW:PT1M}
      session-concurrency: ${ANSWER_RATE_SESSION_CONCURRENCY:1}
      provider-concurrency: ${ANSWER_RATE_PROVIDER_CONCURRENCY:8}
      lease: ${ANSWER_RATE_LEASE:PT30S}
  critic:
    provider: ${CRITIC_PROVIDER:fake}
    model-provider: ${CRITIC_MODEL_PROVIDER:gemini}
    evaluation-mode: ${CRITIC_EVALUATION_MODE:false}
    atomic-confirmation-concurrency: ${CRITIC_ATOMIC_CONFIRMATION_CONCURRENCY:4}
  models:
    request-timeout: ${MODEL_REQUEST_TIMEOUT:PT2M}
    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_MODEL:gpt-5-mini}
    gemini:
      enabled: ${GEMINI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
    deepseek:
      enabled: ${DEEPSEEK_ENABLED:false}
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      generation-thinking: ${DEEPSEEK_GENERATION_THINKING:false}
    qwen:
      enabled: ${QWEN_ENABLED:false}
      api-key: ${QWEN_API_KEY:}
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${QWEN_MODEL:qwen3-vl-plus}
    compatible:
      enabled: ${COMPATIBLE_MODEL_ENABLED:false}
      api-key: ${COMPATIBLE_MODEL_API_KEY:}
      base-url: ${COMPATIBLE_MODEL_BASE_URL:http://localhost:11434/v1}
      model: ${COMPATIBLE_MODEL_NAME:local-model}
  bgg:
    base-url: ${BGG_BASE_URL:https://boardgamegeek.com}
    api-token: ${BGG_API_TOKEN:}
  embedding:
    provider: ${EMBEDDING_PROVIDER:fake}
  speech:
    provider: ${SPEECH_PROVIDER:fake}
  video:
    provider: ${VIDEO_PROVIDER:manifest}
  storage:
    minio:
      endpoint: http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
      access-key: ${MINIO_ACCESS_KEY:rulepilot}
      secret-key: ${MINIO_SECRET_KEY:change-me-local-only}
      bucket: ${MINIO_BUCKET:rulepilot-documents}
      max-pdf-bytes: ${MAX_PDF_BYTES:52428800}
  identity:
    user:
      username: ${RULEPILOT_USER_USERNAME:player}
      password: ${RULEPILOT_USER_PASSWORD:rulepilot-local}
    admin:
      username: ${RULEPILOT_ADMIN_USERNAME:admin}
      password: ${RULEPILOT_ADMIN_PASSWORD:rulepilot-admin-local}
